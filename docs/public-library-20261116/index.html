    "common": "# 连锁店总部 · 公共商品库与基础资料公共ID\n\n版本：V1.0\n\n## 公共说明\n\n### 共享定义：公共ID与本地ID\n\n公共ID标识总部公共资料，本地ID标识某门店自身记录。具体生成、匹配及保存规则唯一维护于《商品与基础资料使用稳定公共ID》；\n\n### 共享定义：推荐标签与是否推荐\n\n推荐标签是可绑定商品的公共资料；“是否推荐”是门店商品独立开关。同步口径见《公共推荐标签与推荐状态》、《更新字段分组与库存保护》。\n\n### 文档信息\n\n| 项目 | 内容 |\n| --- | --- |\n| 建档日期 | 2026-11-16 |\n| 最近修订日期 | 2026-11-19 |\n| 版本 | V1.0 |\n| 正式系统开发／上线 | 待确认 |\n| 本地联动评审 | [打开](商品公共库与基础资料公共ID_联动评审.html) |\n\n### 目标与范围\n\n本次改动后，连锁店后台不再提供套餐功能入口。\n\n总部新增独立公共商品库，模板引用公共商品；普通连锁与品牌总部均适用。保留单门店原表、结构及页面，本期按既定规则补公共ID映射和保存保护。仅总部已有明确改版及绑定品牌总部菜单显隐发生变化；各端无公共ID保存不再新增二次确认；商家APP、总后台、运营商PC不新增权限核对业务页面，用户端不新增页面。商品使用新增表及自增ID，分类、属性分类、属性组、小料、推荐标签复用现有表及记录ID；属性值行化和组、值公共ID字段为本次独立处理范围，具体取值见《商品与基础资料使用稳定公共ID》的“公共ID来源与表复用”。门店初始化直接选择门店后，统一处理无公共ID的商品信息、商品分类、商品属性、商品小料和推荐标签，不再按资料类型分别发起；有公共ID资料及既有引用、历史订单保护按对应规则保留。\n\n### 关键流程与规则入口\n\n公共资料（《公共分类与层级身份》 /《总部属性组、属性值独立保存与公共ID》 /《公共小料按ID同步》 /《公共推荐标签与推荐状态》） → 公共商品及两种导入 → 新版模板（《模板管理与公共商品引用》） → 同步与字段规则 → 任务及失败处理 → 确认可经营后清理门店旧资料。跨端保存、兼容及权限见《门店公共ID映射与保存规则》 / 旧版APP兼容 / 各端门店权限；首页资格见《开放平台绑定连锁品牌后的商品管理处理》 /《首页三步菜单改版引导》。\n\n### 阅读方式\n\n评审页默认展示全部界面，首页商品管理改版引导位于第一屏，页面筛选也将该界面排在首位。引导弹窗默认显示时，评审面板自动选中对应引导需求；桌面直接滚动至该说明，无需点击编号。\n\n后端章节维护业务判断、校验、状态及结果；前端章节维护展示和操作反馈，通过功能名称与主题标题查阅业务依据。异常紧邻所属功能。相同功能在两章出现，只承载各自角色内容。规则按业务主题分组，使用加粗小标题和无序要点，不逐条编号；关键场景是验收依据，不表示测试已通过。\n\n### 待确认与验证边界\n\n需求按本文所列业务规则执行。真实APP、接口、数据库、图片上传、Excel解析、队列并发、重复任务保护、库存订单与历史快照需独立联调，本地原型不能证明正式系统验收完成。\n\n### 原型演示限制\n\n原型中的字母前缀ID仅为演示标识，不代表正式系统数据库ID生成方式；正式取值以“公共ID来源与表复用”为准。使用本地内存模拟，不连接真实业务写接口；刷新重置示例。文件选择只演示文件名反馈，不解析导入表格；CSV下载只用于展示当前示例格式。兼容卡片、权限表、绑定/身份选择均为评审辅助，不能当作新增业务配置页面。任务五状态入口与DEMO记录独立于新任务列表，入口及返回旁标注“仅原型演示显示，实际UI界面不显示”；不回填历史任务、不创建真实任务。首页引导原型使用浏览器本地已读模拟。为便于评审，每次打开或重置本原型均从引导第一步演示，不受既有本地已读标记影响；本轮跳过/完成后关闭，权限条件仍生效。这仅为原型演示，不改变正式业务已读后不再自动弹出的规则。\n",
    "backend": "# 连锁店总部 · 公共商品库与基础资料公共ID\n\n版本：V1.0\n\n## 公共说明\n\n### 共享定义：公共ID与本地ID\n\n公共ID标识总部公共资料，本地ID标识某门店自身记录。具体生成、匹配及保存规则唯一维护于《商品与基础资料使用稳定公共ID》；\n\n### 共享定义：推荐标签与是否推荐\n\n推荐标签是可绑定商品的公共资料；“是否推荐”是门店商品独立开关。同步口径见《公共推荐标签与推荐状态》、《更新字段分组与库存保护》。\n\n### 文档信息\n\n| 项目 | 内容 |\n| --- | --- |\n| 建档日期 | 2026-11-16 |\n| 最近修订日期 | 2026-11-19 |\n| 版本 | V1.0 |\n| 正式系统开发／上线 | 待确认 |\n| 本地联动评审 | [打开](商品公共库与基础资料公共ID_联动评审.html) |\n\n### 目标与范围\n\n本次改动后，连锁店后台不再提供套餐功能入口。\n\n总部新增独立公共商品库，模板引用公共商品；普通连锁与品牌总部均适用。保留单门店原表、结构及页面，本期按既定规则补公共ID映射和保存保护。仅总部已有明确改版及绑定品牌总部菜单显隐发生变化；各端无公共ID保存不再新增二次确认；商家APP、总后台、运营商PC不新增权限核对业务页面，用户端不新增页面。商品使用新增表及自增ID，分类、属性分类、属性组、小料、推荐标签复用现有表及记录ID；属性值行化和组、值公共ID字段为本次独立处理范围，具体取值见《商品与基础资料使用稳定公共ID》的“公共ID来源与表复用”。门店初始化直接选择门店后，统一处理无公共ID的商品信息、商品分类、商品属性、商品小料和推荐标签，不再按资料类型分别发起；有公共ID资料及既有引用、历史订单保护按对应规则保留。\n\n### 关键流程与规则入口\n\n公共资料（《公共分类与层级身份》 /《总部属性组、属性值独立保存与公共ID》 /《公共小料按ID同步》 /《公共推荐标签与推荐状态》） → 公共商品及两种导入 → 新版模板（《模板管理与公共商品引用》） → 同步与字段规则 → 任务及失败处理 → 确认可经营后清理门店旧资料。跨端保存、兼容及权限见《门店公共ID映射与保存规则》 / 旧版APP兼容 / 各端门店权限；首页资格见《开放平台绑定连锁品牌后的商品管理处理》 /《首页三步菜单改版引导》。\n\n### 阅读方式\n\n评审页默认展示全部界面，首页商品管理改版引导位于第一屏，页面筛选也将该界面排在首位。引导弹窗默认显示时，评审面板自动选中对应引导需求；桌面直接滚动至该说明，无需点击编号。\n\n后端章节维护业务判断、校验、状态及结果；前端章节维护展示和操作反馈，通过功能名称与主题标题查阅业务依据。异常紧邻所属功能。相同功能在两章出现，只承载各自角色内容。规则按业务主题分组，使用加粗小标题和无序要点，不逐条编号；关键场景是验收依据，不表示测试已通过。\n\n### 待确认与验证边界\n\n需求按本文所列业务规则执行。真实APP、接口、数据库、图片上传、Excel解析、队列并发、重复任务保护、库存订单与历史快照需独立联调，本地原型不能证明正式系统验收完成。\n\n### 原型演示限制\n\n原型中的字母前缀ID仅为演示标识，不代表正式系统数据库ID生成方式；正式取值以“公共ID来源与表复用”为准。使用本地内存模拟，不连接真实业务写接口；刷新重置示例。文件选择只演示文件名反馈，不解析导入表格；CSV下载只用于展示当前示例格式。兼容卡片、权限表、绑定/身份选择均为评审辅助，不能当作新增业务配置页面。任务五状态入口与DEMO记录独立于新任务列表，入口及返回旁标注“仅原型演示显示，实际UI界面不显示”；不回填历史任务、不创建真实任务。首页引导原型使用浏览器本地已读模拟。为便于评审，每次打开或重置本原型均从引导第一步演示，不受既有本地已读标记影响；本轮跳过/完成后关闭，权限条件仍生效。这仅为原型演示，不改变正式业务已读后不再自动弹出的规则。\n\n\n## 后端功能规则\n\n### 商品与基础资料使用稳定公共ID\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n商品公共ID取新增商品表的自增ID；基础资料复用现有表的记录ID，属性值行化后记录公共ID。门店保留本地ID并保存对应总部公共ID。\n\n#### 公共ID来源与表复用\n\n- **商品**：连锁店总部公共商品使用新增商品表，该表使用自增ID，记录ID直接作为商品公共ID；单门店仍沿用原商品表。\n- **资料信息**：分类（含一级、二级）、属性分类、属性组（属性）、小料、推荐标签复用现有表，直接使用总部对应记录已有的ID作为公共ID；\n- 新建记录沿用原表ID生成机制，并将该记录ID作为公共ID，不另生成一套公共编号。\n- 旧数据不维护，按照新规则展示数据\n- **属性组**：复用现有属性组记录，增加公共ID字段，总部属性组以现有组记录ID保存公共ID。\n- **属性值**：本次单独进行行化处理，一个属性值对应一条行记录，并增加公共ID字段；总部属性值按行化后的各行记录ID保存公共ID，保留所属属性组关联。组公共ID与值公共ID分别记录。\n- 上述取值规则适用于总部公共资料。门店已有或同步新建的资料保留各自本地记录ID，公共ID字段保存总部对应记录的公共ID；门店自建无公共ID资料继续保持为空，不因复用表就将全部本地ID回填为公共ID。\n- 单门店沿用原商品表及属性体系，保留本地ID，维护对应公共ID映射字段。\n\n#### 公共身份与门店映射\n\n- 公共库的商品、一级/二级分类、属性分类、属性组、属性值、小料、推荐标签均具有只读、稳定且不复用的公共ID，具体取值按本功能的“公共ID来源与表复用”；门店自建资料不生成公共ID。\n- 总部、模板和各门店保存相同公共ID；各门店仍保留各自本地唯一ID，不要求与总部或其他门店相同，也不由公共ID覆盖。\n- 商品、分类、属性分类/组/值、小料、标签均适用；按公共ID定位本店记录，新建时生成本店本地ID并保存总部公共ID，层级及商品关联指向本店记录，禁止跨门店混用本地ID。\n- 按“所属连锁＋公共ID”识别，名称只用于展示和搜索；同名不同ID不得合并。\n- 改名、调价、排序、上下架不改变公共ID。\n- 同一门店内，同一类资料的一个公共ID只能对应一条有效记录；\n- 公共ID与门店本地ID的保存按本功能的“公共身份与门店映射”。\n- 两套身份及跨门店区别按本功能的“公共身份与门店映射”。\n\n#### 数据归属与导入边界\n\n- **数据归属**：只有总部公共商品使用新建商品表，商品公共ID取该表自增ID；商品分类、属性分类、属性组、小料、推荐标签复用现有表，将已有记录ID作为公共ID。\n- 快捷导入只新增总部公共资料，不修改来源门店。商品关联的分类、属性和小料，按公共ID复用总部已有资料；无法复用时在总部新建，再与导入商品关联。\n\n#### 异常与边界\n\n- 跨连锁公共ID不能引用；不存在、已删除或已失效的引用在保存和执行时重新校验，阻断对应操作并提示资料类型及公共ID。\n- 同一门店、同一资料类型出现多条相同公共ID的有效记录时，该项处理失败，禁止任意选取一条继续执行。\n\n#### 验证场景：同名不同ID及双门店身份\n\n**前置条件**：两家门店有不同本地ID，映射同一总部公共ID。\n\n**操作步骤**\n\n- 对照本功能的“公共身份与门店映射”修改名称并执行同步。\n\n**预期结果**：公共ID及已有本地ID保留；同名不同ID不合并，按本店映射更新。\n\n\n### 商品列表与行内编辑\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n公共库按左侧分类、右侧未删除商品展示，分类列表按一级排序排列，二级仅在所属一级下排序，修改后立即重排；后台同排序值按分类ID倒序，用户端排序规则沿用现有规则不变；商品字段可横向滚动、操作固定右侧。\n\n#### 复制与身份保留\n\n- 复制商品时，仅生成新的商品公共ID；关联的分类、属性、小料和推荐标签沿用原公共ID。\n\n#### 保存字段与影响范围\n\n- 列表的商品名称旁编辑入口，提交只允许更新当前商品名称及图片；沿用既有名称/图片校验和《失败重试与同步锁》同步锁。商品公共ID及其他信息保持不变，不影响未选商品及门店。\n- 排序、价格、打包费的保存只改变当前总部商品及模板引用，不自动下发门店；沿用原字段校验及《失败重试与同步锁》同步锁。\n- 保存公共商品只变更总部及模板引用，不自动同步门店；未编辑商品及门店数据保持原样。\n\n#### 分类列表与可维护范围\n\n- 公共商品库列表按当前连锁未删除的公共分类及未删除商品查询；\n- 一级包含自身及下属二级商品，二级仅本类。商品启用、上下架状态不作为管理列表排除条件。\n- 后台公共库、模板商品列表及分类管理先按一级分类排序字段数值升序排列分类组，一级排序值相同按分类ID倒序；\n- 二级仅在所属一级内按自身排序值升序、相同按分类ID倒序展示，不能全局混排。\n- 用户端分类排序规则保持现有规则不变，本次不修改用户端排序算法。\n- 左侧分类仅允许修改排序值，复用分类管理与用户端对应的同一分类排序字段；\n- 保存后立即按新排序重排，公共库、模板商品列表和分类管理的顺序保持一致；\n- 当前选中分类与已选商品保留，分类公共ID、名称和父子关系不变。\n- 分类排序字段仍按既有资料同步机制更新到门店，用户端继续使用现有排序规则，不因本次后台排序口径调整而变更；\n- 总部本地保存不自动下发门店。分类名称、层级、类型、显示等资料只能到分类管理中修改。\n- 排序保存沿用非负整数校验、权限及同步锁。\n\n#### 异常与边界\n\n- 编辑/删除及列表行内保存遵守《失败重试与同步锁》的“同步锁的范围与复核时机”；\n\n\n### 创建、编辑与复制公共商品\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n商品只能使用新版公共基础资料。\n\n#### 新建、编辑与复制的身份\n\n- 创建成功生成商品公共ID；编辑只读显示；复制商品之后，新商品将生成新的公共ID。\n\n#### 总部字段与公共资料引用\n\n- 总部不维护总库存、每日库存、虚拟销量，同步与复制商品不读取或复制这些总部字段；不删除门店既有数据。\n- 商品只能引用本连锁公共库有效且有公共ID的分类、属性分类、属性组/值、小料、推荐标签；保存重新校验资料及关联，每个属性值须有自己的公共ID。\n\n#### 商品配置与保存校验\n\n- 售卖时间允许全时段或周＋时段；促销为无/折扣/第二份促销。金额、必填、图片格式尺寸和选项校验沿用现有系统。\n- 商品属性保留属性/规格/小料类型、必选、单多选、数量、组合及适用价格，不再在商品表单自由拼接无ID属性值。\n\n#### 总部新建默认上架\n\n- 连锁店总部创建公共商品时，上下架状态默认上架，不要求用户在商品表单选择；复制产生新公共商品时同样默认上架。模板引用该公共商品，不单独设置上下架。\n- 已有公共商品编辑保存时，该字段缺失不得清空或重置原上下架状态；商品启用/禁用和同步操作资格仍分别执行原规则。\n\n#### 异常与边界\n\n- 失效公共引用不得保存；保存时依本功能的“总部字段与公共资料引用”重新校验。\n\n\n### 公共库批量分类、删除与模板移除\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n公共库单项与批量删除仅按本次商品数量二次确认，确认后逐项校验并执行；结果以醒目吐司提示删除成功、删除失败或成功与不可处理数量，门店使用保护保留。\n\n#### 公共库删除与模板移除\n\n- 删除总部公共库商品（单项或批量）前，按当前所属连锁与商品公共ID，校验关联门店中是否存在该商品。\n- 校验门店范围仅为运营中且未删除的关联门店；任一家该范围门店存在相同商品公共ID，即不可删除对应公共商品；\n- 全部该范围门店均不存在时，才可按既有权限、同步锁及二次确认删除。\n- 非运营中、已删除、已解除关联或其他连锁的门店不计入该校验范围；\n- 商品名称、门店本地ID不作为匹配依据，商品下架或禁用不等于不存在。\n- 允许删除时同时从所有引用它的商品模板中移除，不删除门店已有商品。\n- 公共库删除固定点击入口时本次选择的商品公共ID集合，确认后执行时复核本功能的“公共库删除与模板移除”。不可删除的商品及其模板引用、门店均不变；模板移除仅解除当前模板引用，不套用公共库门店存在性校验。\n- 模板的删除则仅移除该模板关系，公共库及其他模板、门店不变。\n\n#### 批量分类的范围、校验和结果\n\n- 批量修改分类只处理点击入口时本次勾选的商品集合，无选中商品时提示“请先选择商品”；不扩大到未选商品或筛选全部结果。\n- 批量分类只允许当前连锁显示且未删除的有效公共分类；有子类必须到二级，二级必须属于所选一级；无子类时一级即目标。提交复核分类资格、父子关系及同步锁。\n- 确认成功后，本次勾选的所有商品统一按新分类展示，商品关联的分类公共ID更新为所选目标分类公共ID；\n- 存在二级则写入所选二级分类公共ID，否则写入所选一级分类公共ID。\n- 商品自身公共ID不变，未选商品及公共分类定义不变；\n- 公共库列表和模板引用展示新分类，不自动更新门店已有商品。\n\n#### 批量删除的逐项校验和确认范围\n\n- 公共库单项及批量删除均在二次确认后开始执行。按本次明确选择的商品公共ID集合逐项校验，运营中且未删除的关联门店存在同公共ID商品的项不可删除；\n- 跳过不可删除项，其他可删除项继续处理，不因个别项被引用整批阻断。\n- 确认数量为本次选择总数，包含跨分类或筛选保留的已选商品，不预先剔除不可删除项或展示预检清单；\n- 最终执行复核权限、当前连锁归属、商品有效性、门店引用及同步锁。\n- 存在待处理/处理中同步任务仍整批阻止，不按部分成功绕过同步锁。\n- 确认后按执行时状态判断可删除项，期间商品失效或门店引用变化时直接据实跳过，不刷新清单或要求再次确认，不扩大到本次选择以外的商品；全部不可处理时不写入删除，返回删除失败。\n- 只删除本次确认范围内仍符合条件的总部商品，并从全部模板移除这些商品引用；\n- 不可删除项及其引用保留，门店数据不因本操作改变。完成后清除成功项勾选，保留不可处理项选择；\n- 全部成功、全部失败和部分成功的反馈遵循本功能“批量删除确认与结果”。\n\n#### 异常与边界\n\n- 公共分类/属性/小料/标签被引用时删除，复用现有的删除逻辑；如果有商品使用，不可删除分类、属性、小料；标签可以删除，删除之后同步商品上不显示。\n\n#### 验证场景：总部删除与模板移除的范围\n\n**前置条件**：运营中且未删除的关联门店含同公共ID商品。\n\n**操作步骤**\n\n- 尝试公共库单项/批量删除。\n- 在模板内移除引用。\n\n**预期结果**：公共库确认后执行，门店仍使用的商品保留并提示删除失败；模板移除只解除当前引用，不删除公共库和门店商品。\n\n\n### 表格导入格式与规则\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n点击导入商品直接选择本地表格；表格按九列格式填写，最多200条。\n\n#### 文件格式与整批校验\n\n- 导入九列依次为商品公共ID、商品名称、分类、价格、商品信息、商品描述、打包费、属性分类、属性。名称/价格必填；分类空使用“默认”一级分类；打包费空默认为0。\n- **表格版本**：使用当前最新版本格式；旧格式不兼容时明确提示重新下载，不兼容旧表格。\n- **行数**：最多200条商品数据，表头、示例行不算；超过时拒绝导入，并说明数量。\n- **缺必填项**：数据区任意一行缺少商品名称或价格时，表格整批导入失败，本批次不写入商品。\n\n#### 分类和属性资料处理\n\n- **默认分类**：分类为空时创建或复用“默认”一级公共分类；只填名称、价格也可以导入。\n- **属性分类缺失**：属性分类与属性配置必须同时填写；仅填写其中一项时不导入该行商品，错误提示：“属性分类与属性配置必须同时填写”；属性分类和属性均不存在时，可以导入，作为普通商品。\n- **属性**：填写规则保持现有逻辑；如果小料属性在总部不存在，提示：“第*行【商品名称】小料库缺少：小料名称、小料名称...”。\n\n#### 商品公共ID的新增、更新与失败\n\n- **公共ID**：不必填；\n- **公共ID**：未填写，导入后新建公共商品，系统生成新公共 ID；\n- **公共ID**：已填写，当前连锁公共库存在，更新该商品信息，保留公共 ID，属性和分类按照名称同步，相同名称的情况下不更新，不相同的情况下按照导入的数据同步；\n- **公共ID**：已填写，当前连锁公共库不存在，该行失败，提示“第*行，商品公共 ID 不存在”；\n- 如果多个商品公共ID不存在，逐一列出全部涉及行号，提示“第*行、第*行...、第*行，商品公共 ID 不存在”，同时这些商品导入失败；\n- **公共ID**：同一文件出现重复的非空公共 ID 时应报错，提示“第*行、第*行...、第*行的商品公共 ID 重复”，同时全部涉及重复ID的商品导入失败。\n\n#### 关联资料的名称匹配边界\n\n- **公共资料**：仅表格导入时，分类、属性分类及属性按名称匹配，同名视为相同资料，复用对应已有资料及公共ID绑定商品；\n- 需要新建时，记录及公共ID按《商品与基础资料使用稳定公共ID》的“公共ID来源与表复用”处理，属性值按行记录保存。\n- 此名称匹配规则仅适用于表格导入，不用于门店同步；商品自身仍按商品公共ID执行本条新增、更新和失败处理规则。\n\n#### 异常与边界\n\n- 必填项缺失或超过200条时整批不导入；属性分类与属性配置不完整、商品公共ID不存在或非空公共ID重复时，对应行商品导入失败。\n- 公共ID不存在和重复的错误均须列出全部涉及行号，不能只提示第一行；其他未受影响商品按校验结果处理。\n\n#### 验证场景：导入边界与逐行失败\n\n**前置条件**：按当前九列格式准备导入数据。\n\n**操作步骤**\n\n- 分别核对缺必填、超过200条、未知ID、重复非空ID。\n\n**预期结果**：依本功能的“文件格式与整批校验”、本功能的“商品公共ID的新增、更新与失败”区分整批失败与对应行失败，列出全部涉及行号。此为真实导入待联调用例，原型不解析表格。\n\n\n### 关联门店快捷导入\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n快捷导入时，门店商品有公共ID而当前连锁公共库不存在该ID则跳过；已有同ID商品继续跳过，无公共ID商品按原规则新建；分类、属性、小料的公共ID处理规则保留。\n\n#### 来源门店与导入字段\n\n- 来源仅限当前连锁有效关联、有管理权限、正常运营、未删除且未禁用的门店，提交重新校验资格。\n- **商品资料**：仅导入商品资料，不导入销量、点赞、门店总库存、每日库存、虚拟销量。来源门店旧商品不会因导入自动获得公共ID。\n\n#### 商品公共ID的三种处理\n\n- **商品公共ID（已存在）**：来源商品有公共ID且总部公共库已存在相同公共ID，跳过，不导入、不覆盖已有资料；公共库原ID不变。\n- **商品公共ID（不存在）**：来源门店商品存在公共ID，但当前连锁总部公共库不存在相同商品公共ID时，该条数据不导入，直接跳过，不保留该ID新建商品，也不重新分配商品公共ID；\n- 不因该条跳过商品创建分类、属性、小料等依赖资料。其余所选商品按各自规则继续处理。\n- 不按商品名称、分类名称或门店本地ID判断。\n- **商品公共ID（未填写）**：来源商品无公共ID时，无论公共库是否有同名同分类商品，均按各自来源本地ID逐条导入，每件创建一条独立公共商品，系统逐件生成唯一新公共ID；不按名称或分类合并。\n- 有公共ID而跳过的商品计入跳过数量；混合选择不影响其他符合条件商品继续导入。\n\n#### 分类、属性及小料的依赖处理\n\n- **分类**：保留商品所属一级分类归属；来源有二级分类时，商品归到对应一级分类。公共库缺少所需分类时，随导入创建对应一级分类，不复制二级分类。\n- **完整属性**：商品分类与商品属性一并处理。新建资料时保留来源完整属性分类、属性组、属性值及结构和选择规则，包括属性/规格/小料类型、单选/多选/必选、选择数量、规格组合、适用价格和小料配置；\n- 总部存在相同公共ID的资料时，直接使用总部已有资料，不按来源名称或配置覆盖。\n- **基础资料公共ID匹配**：分类、属性（含属性分类、属性组和属性值）、小料均按各自公共ID判断。\n- 来源资料有公共ID且总部存在相同公共ID时，直接复用总部已有资料；\n- 来源无公共ID，或总部不存在该公共ID时，新建总部对应资料，公共ID按《商品与基础资料使用稳定公共ID》的“公共ID来源与表复用”记录；\n- 属性值按行化后的记录ID保存公共ID。仅名称相同不能作为复用依据，不将新公共ID回写来源门店。\n- **依赖与创建顺序**：先按公共ID复用或新建分类及小料，再复用或新建对应属性资料；\n- 新建“小料”类型属性时关联已处理的小料公共ID，最后关联商品。\n- 总部存在同ID资料时直接复用其现有内容；同一来源资料在本次导入中被多个商品引用时复用同一处理结果。\n- 来源ID不同或均无ID的不同资料，即使同名也分别处理。\n\n#### 独立促销与提交复核\n\n- **独立促销排除**：菜品类型标记为【促销】、即参加门店单独促销活动的商品，不查询、不展示、不允许选中导入。\n- 此标记不是是否打折；不能仅因商品有折扣或第二份促销配置而排除，未标记独立促销且符合其余条件的商品仍可查询。\n- 提交重新校验门店及已选菜品资格，已失效门店和已变成独立促销的菜品不得沿用旧勾选导入。\n- 菜品查询、分类、列表展示、勾选、已选区、全选及导入数量统计使用同一有效商品范围。\n\n#### 异常与边界\n\n- 未选商品时提示至少选择一件；只处理当前门店已勾选商品，不扩展到未选商品。\n- 总部存在同ID分类、属性或小料时，即使来源名称、配置不同也直接复用总部已有资料；总部不存在同ID资料时新建，不因名称相同复用其他ID记录。\n- 提交时重新按当前连锁公共库核对商品公共ID；有公共ID但公共库不存在的商品逐条跳过，不使其他可导入商品整批失败。该商品级规则不改变可导入的无ID商品所需基础资料的公共ID复用/新建规则。\n\n#### 验证场景：快捷导入三分支及依赖\n\n**前置条件**：当前门店混合包含无ID商品、总部有同ID商品和总部无同ID商品。\n\n**操作步骤**\n\n- 选择符合资格商品并导入。\n\n**预期结果**：有ID两类均跳过且不创建依赖；无ID逐件新建。依赖依本功能的“分类、属性及小料的依赖处理”，来源不回写。\n\n\n### 公共分类与层级身份\n\n所属端：连锁店总部；页面：公共分类管理\n\n分类改名与调整按ID更新，不因名称相同合并门店分类；连锁店总部分类管理仅查询和显示含公共ID的数据。\n\n#### 分类身份、层级与门店映射\n\n- 一级、二级分类复用现有分类表，各自记录ID直接作为公共ID；二级记录父级公共ID，名称/排序变化不改变ID。\n- 新商品必须选择新版公共分类，父子关系无效不可保存。\n- **同步商品到门店时，先按分类公共 ID 匹配门店分类**：不存在则新建，已存在则更新分类信息，并保持与总部一致的父子分类关系；完成后，将商品关联到对应分类。\n- 门店已有的无公共ID分类独立保留，不因名称相同与公共分类合并。\n- 分类公共身份与门店本地ID分开，父子及商品关联按《商品与基础资料使用稳定公共ID》的“公共身份与门店映射”、本功能的“分类身份、层级与门店映射”。\n\n#### 批量与单项删除保护\n\n- 批量删除仅作用本次明确勾选分类，不扩大至未选项，不自动级联删除子分类。\n- 确认后按本功能的“批量与单项删除保护”逐项判断，删除可删除的总部分类，不删除门店分类；被使用项保留，其余继续。\n- **批量删除保护**：所选分类被商品或子分类引用时，该分类不删除；\n- 其他未被使用、符合删除条件的所选分类继续删除，不因某个分类被使用而整批阻断。\n- 存在待处理/处理中的同步任务时，仍禁止批量删除；确认提交时重新校验同步任务、分类有效性及引用关系，按提交时引用状态逐项判断，不能删除已被使用的分类。\n- 不自动解绑商品、不级联删除子分类。\n- **单项删除**：点击某个分类的删除入口，如果分类被商品引用，保留该分类，提示“分类正在被使用，不可删除”；未被使用且符合删除条件时正常删除。已有子分类引用保护和同步锁继续执行。\n\n#### 新建和编辑校验\n\n- 分类名称必填，上级可为有效一级公共分类或无（一级）；新建沿用原分类表生成记录ID并以该ID保存公共ID，编辑保留原ID，保存复核父子关系及同步锁。实际默认设置沿用现有系统。\n\n#### 总部列表的数据范围\n\n- **查询范围（仅连锁店总部）**：总部公共商品库【分类管理】只查询并显示含公共ID的数据；\n- 公共ID为NULL、缺失、空字符串或纯空白的记录不返回、不展示。\n- 首次加载、刷新/切换回页面及现有查询/重置均保持此条件；\n- 列表数量和可勾选范围与过滤结果一致，不能因名称相同查出无ID资料。\n- 公共ID按原值处理；已有无公共ID资料不因不展示而被删除、补发公共ID或迁移，门店旧数据继续按既定规则处理。\n-  本条不适用于单门店的分类、小料、推荐标签列表，单门店仍按原有规则查询和展示，不套用含公共ID的过滤条件。\n\n#### 分类排序与列表入口\n\n- 公共库、模板商品列表左侧及分类管理均先按一级分类排序值从小到大排列整组，二级跟随所属一级，排序仅在同一一级分类下生效，不跨一级分类比较；\n- 二级排序值再小也不会排到其他一级分类之前，修改二级排序不改变所属一级分类的组位置；\n- 列表中的排序输入与分类管理、用户端分类排序一一对应，修改同一分类排序值，不修改ID或层级。\n- 有效排序保存后后台立即重排；一级分类和同一一级下的二级分类均按排序字段数值升序、数值相同按分类ID倒序。\n- 用户端继续沿用现有分类排序规则，本次不修改用户端排序算法。\n- 商品列表只开放分类排序维护；分类名称、层级、类型、图标及显示等定义仍统一从分类管理修改。分类排序保存不自动同步门店，后续沿用商品同步中同公共ID分类资料更新。\n\n#### 异常与边界\n\n- 共享分类改名可能影响门店其他关联商品展示；共享资料影响按本节规则说明，不额外设置同步预览步骤。\n- **分类删除的引用保护已明确**：批量删除逐项跳过被使用分类，其余可删除项继续删除；单项被商品引用时提示“分类正在被使用，不可删除”。子分类引用保护沿用，不自动迁移、解绑或级联删除。\n\n#### 验证场景：批量分类删除的逐项保护\n\n**前置条件**：勾选有引用和无引用的公共分类。\n\n**操作步骤**\n\n- 打开批量删除并确认。\n\n**预期结果**：被使用项保留，其余可删除项继续；同步锁和确认前新增引用不能被绕过。\n\n\n### 总部属性组、属性值独立保存与公共ID\n\n所属端：连锁店总部；页面：公共属性与属性值\n\n属性组复用现有表并增加公共ID字段；属性值单独行化，每值一行并增加公共ID字段，按行化后记录ID保存总部属性值公共ID。 未删除商品正在使用的属性值禁止修改名称和删除。\n\n#### 组和值的独立身份\n\n- 属性分类、属性组、每个属性值分别拥有公共ID；属性组和属性值增加公共ID字段。属性值必须先完成行化，一个值一行，记录所属组及自身公共ID，禁止只用逗号文本作为值身份。\n- 属性组类型为属性/规格/小料；保持选择规则和数量，排序沿用现有规则；未被未删除商品使用的属性值才允许改名；允许的改名及调价保留行记录ID及公共ID，新增值创建独立行记录，并以其记录ID保存公共ID。\n- 删除再建同名值必须生成新ID，不复用被删除的ID。\n- **改动范围**：属性组复用现有表和组记录ID，不按属性值行化方式拆组；\n- 属性值按值行化后逐行记录公共ID。门店同步在本店组/值记录上保存对应总部公共ID，保留原有本地唯一ID与商品关联；\n- 其他端已有组/值ID、属性结构及既有保存保护继续沿用，不新增其他端的文本拆分或结构迁移任务。\n- 保留门店本地组/值记录ID；同名不同ID不得更新、串绑；门店缺公共组/值先创建再绑定商品。\n- 分类/组/值逐层保留门店本地ID并按总部公共ID建立本店关联。\n\n#### 属性分类与组值保存\n\n- 属性必须关联已创建且有效的公共属性分类，不能跳过分类独立创建。\n- 属性/规格类型保存时，新增属性组沿用原组表记录ID并保存组公共ID；\n- 属性值完成行化后，以各行记录ID保存值公共ID。编辑保留已有组/值记录ID和公共ID，遵循《商品与基础资料使用稳定公共ID》和引用校验。\n\n#### 未删除商品使用的属性值保护\n\n- 属性值只要仍被任一未删除商品使用，就不允许修改名称，也不允许删除；属性、规格、小料类型的属性值均适用。商品已下架、禁用仍属于未删除商品，继续执行保护；已删除商品不计入本项使用判断。\n- 按商品与属性值的实际引用关系及稳定ID判断使用情况，不按名称判断；\n- 仅引用属性组不应误锁同组内未被该商品使用的值。没有未删除商品使用的属性值，可在既有权限、同步锁及校验通过后改名或删除；\n- 改名保留原行记录ID和公共ID，删除后重建仍生成新ID。\n- 改名、移除或删除的操作入口与最终提交均重新校验引用关系。\n- 提交时发现被未删除商品使用，阻止该次保存或删除，保留原名称、记录ID、公共ID及商品关联；\n- 不能通过已打开的弹窗、移除后保存、整组删除、旧版接口或间接修改小料名称绕过。\n\n#### 公共小料引用与去重\n\n- 小料类型只能引用当前总部库存在且公共ID非空的小料，不能手填名称创建引用；确认选择和保存都校验。\n- 每个小料值保留独立属性值公共ID及引用的小料公共ID；同一小料不重复添加，原值ID保留。失效/无ID引用不得保存，沿用同步锁。\n\n#### 选择数量校验\n\n- 每次属性值数量须为正整数，非法数量不保存；与当前选择规则及可用值数量的校验沿用当前表单。\n\n#### 异常与边界\n\n- 属性值行化是本次需要单独处理的工作；总部新增公共库的业务旧数据不维护，不展示\n- 删除属性组沿用现有引用校验；属性值的改名和删除统一依本功能的“未删除商品使用的属性值保护”。允许删除后，不自动修改门店资料；历史订单按成交时快照展示，不能因删除或改名改变订单内容。\n\n#### 验证场景：未删除商品使用的属性值禁止改名和删除\n\n**前置条件**：准备启用、下架或禁用的未删除商品引用的值，以及仅被已删除商品引用和未被使用的值。\n\n**操作步骤**\n\n- 尝试修改被使用值名称、移除该值后保存、删除包含该值的属性组，以及通过小料库间接改名。\n- 打开编辑弹窗后新增商品引用，再提交名称修改或删除。\n- 对无未删除商品引用的值改名或删除；核对同组其他值和原公共ID。\n\n**预期结果**：未删除商品引用的值改名和删除均被阻止，下架/禁用不解除保护；提交复核不被旧弹窗绕过；已删除商品不计入本项引用。未被使用的值按原校验处理，改名不换ID，历史订单快照不变。\n\n\n### 公共小料按ID同步\n\n所属端：连锁店总部；页面：公共小料库\n\n公共小料身份与商品的小料属性关联分开；连锁店总部小料库管理仅查询和显示含公共ID的数据。\n\n#### 小料身份与属性引用\n\n- 小料公共ID用于识别小料库中的记录。复用已有的小料表里面的自增ID，调整为公共ID\n- 属性类型为“小料”时，每个属性值同时保存自身的属性值公共ID和引用的小料公共ID，两者分别保存，不能互相替代。\n- 只能从当前总部小料库中选择有公共ID的小料；无公共ID的历史小料不可选择或保存为属性引用。\n- 同步到门店时，按小料公共ID匹配。门店小料同名但公共ID不同，或没有公共ID的，不能仅按名称复用或合并。\n- 删除或下架商品，不会自动删除或下架其关联的小料和属性。\n- 总部新增小料，以该记录ID作为小料公共ID。\n- 门店自行新增小料不生成公共ID；\n\n#### 名称、价格及库存归属\n\n- 名称及价格的唯一来源和更新时机按本功能的“名称、价格及库存归属”。\n- 门店无同公共ID小料时先创建，名称及价格来自总部，库存默认不限制；门店已有同公共ID小料时复用并更新总部名称及价格，保留门店本地ID与现有库存。小料价格不受商品“价格信息/促销信息”可选开关控制。\n- 小料名称最多10字；总部小料复用现有小料表，以对应记录ID作为公共ID，新建沿用原表ID机制；编辑/改名改价保持ID，金额沿用现有校验。\n- 具有公共ID的小料价格统一由连锁店总部维护，同步至门店后门店不允许修改该小料价格，保存时同样校验；\n- 门店小料库存仍按既有权限维护。本次不增加门店业务UI改版。\n- 旧数据不含公共ID，不按名称与公共小料合并，不新增旧小料价格冲突迁移流程。\n- 小料类型属性中的名称和价格以其关联的小料库记录为准，不另存一套可独立修改的价格；\n- 修改小料名称前，按《总部属性组、属性值独立保存与公共ID》的“未删除商品使用的属性值保护”校验关联属性值，任一关联值被未删除商品使用时禁止该次改名。\n- 允许的改名或改价后，总部属性及模板立即展示新值，门店在执行同步后更新。\n\n#### 总部列表的数据范围\n\n- **查询范围（仅连锁店总部）**：总部公共商品库【小料库管理】只查询并显示含公共ID的数据；\n- 公共ID为NULL、缺失、空字符串或纯空白的记录不返回、不展示。\n- 首次加载、刷新/切换回页面及现有查询/重置均保持此条件；\n- 列表数量和可勾选范围与过滤结果一致，不能因名称相同查出无ID资料。\n- 已有无公共ID资料不因不展示而被删除、补发公共ID或迁移，门店旧数据继续按既定规则处理。\n-  本条不适用于单门店的分类、小料、推荐标签列表，单门店仍按原有规则查询和展示，不套用含公共ID的过滤条件。\n\n#### 异常与边界\n\n- 旧小料公共ID为空，与总部公共小料保持独立；本次不将旧数据按同名匹配或覆盖价格。\n\n\n### 公共推荐标签与推荐状态\n\n所属端：连锁店总部；页面：公共推荐标签\n\n推荐标签沿用现有列表及新增、关联商品、删除样式，增加公共ID；连锁店总部推荐标签管理仅查询和显示含公共ID的数据。\n\n#### 标签身份与同步绑定\n\n- 推荐标签具有独立公共ID；新商品只选新版公共推荐标签；门店缺少同公共ID标签时先创建，已有同公共ID标签时更新名称等资料。\n- 名称变化保持ID；同名无公共ID旧标签不合并。\n- 更新商品信息默认保留门店“是否推荐”，与是否推荐字段不同。\n- 推荐标签映射保留本店本地ID，按《商品与基础资料使用稳定公共ID》的“公共身份与门店映射”；\n- 绑定更新按本功能的“标签身份与同步绑定”，是否推荐按《更新字段分组与库存保护》的“默认更新与默认保留”保留。\n- 更新商品信息时默认按总部商品当前推荐标签覆盖目标商品的标签绑定，无需额外勾选；\n- 先按公共ID创建缺失标签或更新同ID标签，再关联该门店对应记录，保留已有标签本地ID。\n- 同名不同公共ID标签不合并，不修改其他商品的标签绑定。\n\n#### 总部维护与删除范围\n\n- 总部标签名必填且最多3字；推荐标签复用现有表，以对应记录ID作为公共ID，新建沿用原表ID机制，编辑保留ID。\n- 确认只保存当前总部标签的商品关联并更新关联数，不改其他标签或门店数据；取消不保存。\n- 确认删除总部标签及总部商品对该标签的关联；保留商品、其他标签关联、门店资料及是否推荐开关。\n\n#### 品牌门店的维护权限\n\n- 以上新增、编辑、关联商品和删除为连锁总部操作。本条推荐标签限制仅适用于关联品牌类型连锁店的门店，新旧商家APP均执行：不能自行新增、删除、编辑标签或变更标签商品绑定，只可查看关联商品，由品牌连锁店总部维护。\n- 普通连锁门店及其他门店沿用既有权限，不扩展本限制。\n\n#### 总部列表的数据范围\n\n- **查询范围（仅连锁店总部）**：总部公共商品库【推荐标签管理】只查询并显示含公共ID的数据；\n- 公共ID为NULL、缺失、空字符串或纯空白的记录不返回、不展示。\n- 首次加载、刷新/切换回页面及现有查询/重置均保持此条件；\n- 列表数量和可勾选范围与过滤结果一致，不能因名称相同查出无ID资料。\n- 已有无公共ID资料不因不展示而被删除、补发公共ID或迁移，门店旧数据继续按既定规则处理。\n-  本条不适用于单门店的分类、小料、推荐标签列表，单门店仍按原有规则查询和展示，不套用含公共ID的过滤条件。\n\n#### 异常与边界\n\n- 总部商品未关联推荐标签时，更新后清空目标商品的推荐标签绑定；不删除门店标签记录，不修改“是否推荐”开关。\n\n\n### 模板管理与公共商品引用\n\n所属端：连锁店总部；页面：商品模板管理 · 模板列表\n\n模板管理保留现有空态、新增模板及模板列表，点击管理商品进入模板商品管理；模板商品统一引用公共商品库，模板变化需手动同步至门店。\n\n#### 旧模板处理\n\n- 更新前的旧模板及模板内商品数据不再展示，也不自动转换或恢复为新版模板。\n\n#### 新增模板与添加商品\n\n- 新增模板沿用现有逻辑。\n- 创建模板后，通过“添加商品”从公共商品库选择商品，建立模板引用，不在模板内直接新建商品。\n- 复制模板商品同样遵循上述公共商品引用规则，不生成新的商品公共ID。\n\n#### 公共商品修改与门店同步\n\n- 同一公共商品可被多个模板引用，各模板中的商品公共ID保持一致。\n- 修改公共库商品后，引用该商品的模板即时展示最新信息。\n- 模板中的变化不会自动下发门店，需手动执行同步。\n\n#### 添加范围、当前模板去重与提交\n\n- 添加范围仅限启用、未删除的公共商品；排除标记“促销”的独立促销商品；普通折扣/第二份配置不等于促销标记。查询、分类数量、勾选、计数和提交资格一致。\n- “已添加”仅按当前模板的商品公共ID引用判断，其他模板互不影响；提交复核有效性并按当前模板公共ID去重。\n- 分类选品范围遵循本功能的“添加范围、当前模板去重与提交”；确认仅加入当前模板，提交复核启用未删、独立促销排除和当前模板去重。\n\n#### 移除引用的范围\n\n- 删除与批量删除仅移除当前模板中的商品引用，公共商品库中的商品、其他模板引用及门店已有商品均保留。\n- 移除入口和最终提交均遵守权限及《失败重试与同步锁》的规则。\n\n#### 异常与边界\n\n- 同步引用商品时不可移除模板关系。\n- “同步所有商品”跨页且忽略筛选，范围为当前新版模板全部有效公共ID商品；缺失公共ID的异常引用排除并告知数量，不回填更新前旧模板数据。\n\n\n### 五种商品同步\n\n所属端：连锁店总部；页面：商品模板与五种同步\n\n新增、删除、下架、上架、更新都按公共ID匹配。\n\n#### 同步类型与公共ID匹配\n\n- **顺序**：新增门店商品、删除门店商品、下架门店商品、上架门店商品、更新商品信息；删除【替换门店商品】类型以及同步不按名称匹配。\n- 上述新增、删除、下架、上架、更新中的“同ID”均指同一连锁内相同商品公共ID，不是门店本地商品ID。\n- 门店商品保留自己的本地ID；新增记录按门店现有机制生成本地ID并保存总部公共ID；\n- 其余操作在门店按公共ID找到目标后执行，不改变原有跳过/失败口径。\n\n#### 新增、删除、下架、上架与更新的处理结果\n\n- **新增**：同ID有效商品已存在则跳过；无同ID则新建，同名不同ID不拦截、不删除旧品。\n- **删除**：仅删同ID商品，目标缺失跳过，不删分类/属性/小料。\n- **下架**：仅下架同ID商品，已下架为成功无变化，目标缺失跳过，不改依赖状态。\n- **上架**：仅上架同公共ID的已有门店商品；已上架为成功无变化，目标缺失跳过，不新增商品、不按名称匹配，不改商品其他字段及关联资料。\n- 权限、活动限制、同步锁、任务快照、较新任务及失败重试复核沿用既有同步规则。\n- **更新**：仅更新同ID已有商品，保留本地商品ID和销售连续性；缺同ID跳过，不新增、不初始化、不改用名称匹配。\n\n#### 门店范围与资格复核\n\n- 每次确认将区域展开为当时有效且有权限的具体门店集合，后新增门店不纳入原任务，资格依本功能的“门店范围与资格复核”。\n- **门店资格在展示、确认提交、实际执行和失败重试时均校验**：必须属于当前连锁有效关联范围、账号有管理权限、正常运营、未删除且未禁用；\n- 区域选店只包含提交时确认的门店，之后新增门店不自动加入。\n- 执行时不符合条件的门店项失败，其他合格门店继续。\n\n#### 提交与二次确认\n\n- 首次确定只校验选择并请求二次确认，只有再次确定才提交任务；取消不提交。\n- 选择门店和操作类型均为必选。提交设置及最终确认均校验至少一家有效门店、明确选择五种操作类型之一；\n- 缺失或非法类型不可提交或默认执行其他操作。门店和类型均未选时优先提示“请选择需要同步的门店”；\n- 已选门店但未选类型提示“请选择操作类型”，校验失败保持当前输入、不生成任务。\n\n#### 异常与边界\n\n- 任务待处理/同步中不可编辑、删除或变更商品启用状态；任务执行失败并结束后可按原权限修改商品，修改后重新执行旧任务时阻断并提示“商品信息已变更，请重新同步”，需要按当前资料重新发起同步。\n- 门店活动限制沿用系统，参与活动不可操作则单项失败，其他商品继续。\n\n#### 验证场景：门店及操作类型必选与同步上架\n\n**前置条件**：从同步商品或同步所有商品入口打开弹窗，目标门店有同公共ID的下架商品。\n\n**操作步骤**\n\n- 不选门店和类型确认；仅选类型确认；仅选门店确认。\n- 选门店及上架门店商品，检查顺序和二次确认，取消返回再提交。\n- 核对已下架/已上架/目标缺失及活动受限等结果，查看任务类型与详情。\n\n**预期结果**：两项必选且未选不提交，提示原文与优先顺序正确；二次取消保留选择；上架仅改同ID商品为上架，已上架成功无变化，缺失跳过，活动等受限失败；任务类型为上架门店商品，快照及重试规则保留。\n\n\n### 更新字段分组与库存保护\n\n所属端：连锁店总部；页面：商品模板与五种同步\n\n上下架和商品排序默认按总部同步；库存等经营字段保留，价格与售卖时间可选覆盖。\n\n#### 默认更新与默认保留\n\n- **默认同步更新字段**：商品名称、商品图片、打包费、商品信息、商品描述、商品一级/二级分类、商品属性分类、商品属性组和属性值及结构、推荐标签（商品与推荐标签的绑定关系）。\n- 推荐标签、是否上下架、商品排序均为固定默认更新字段，无需额外勾选；\n- 门店商品上下架状态与商品排序按总部对应数据更新。\n- 默认保留门店总库存、每日库存、是否推荐、起购数量及历史销量/点赞；是否上下架与商品排序归入默认同步，按总部数据更新。推荐标签绑定默认按总部商品更新，与“是否推荐”开关分开处理。\n\n#### 可选价格和售卖时间\n\n- 促销信息未勾选保留商品自身价格及促销配置（不含按公共ID统一采用总部价格的小料）；勾选后按来源类型整组同步：无→价格与类型无；折扣→价格/类型/折扣/折后价/限购；第二份→价格/类型/第二份价格。\n- 勾选价格信息且总部促销类型为“无”时，门店商品价格按总部更新，促销类型改为“无”；原折扣或第二份价格即使仍有历史数值，也不得参与当前计价。\n- 售卖时间未勾选时，保留门店完整售卖时间；勾选后，按总部配置更新全时段/分时段、星期和全部时间段。该选项与价格信息选项独立。\n\n#### 上下架与商品排序默认同步\n\n- 执行新增和更新商品信息时，门店对应商品的是否上下架及商品排序默认采用总部对应商品数据，无需勾选；更新已有商品不再保留门店原上下架和商品排序。独立“下架门店商品”操作仍按原范围执行。\n- 商品启用/禁用是允许新增/更新同步的资格条件，是否上下架是默认同步的数据字段，两者分别处理；不能将是否上下架误作可选项或用可选价格、售卖时间控制。\n- **商品排序与左侧分类排序分别维护**：商品排序直接默认同步，分类排序仍作为默认同步的公共分类资料一部分按同公共ID更新。\n- 提交快照固定总部状态、排序与两个可选项，执行和失败重试沿用原任务来源版本及选择；\n- 来源变更仍按既有快照保护阻止旧任务重试。\n\n#### 新建默认值与库存保护\n\n- 新增商品按总部资料创建，总库存和每日库存默认不限（-1），虚拟销量为0；不读取或复制总部库存。更新已有商品时保留门店商品及规格的现有库存，属性资料更新不能覆盖库存。\n\n#### 异常与边界\n\n- 字段配置异常或引用资料缺失时，该商品整项失败，本次商品及关联资料修改全部不生效。\n- 公共小料价格统一采用总部价格，不受商品价格信息/促销信息开关影响；同步后的公共小料不允许门店改价。推荐标签仍默认更新。\n\n#### 验证场景：上下架排序默认同步及两项可选\n\n**前置条件**：总部与门店商品上下架、商品排序、价格及售卖时间不同，门店已有库存和销量。\n\n**操作步骤**\n\n- 在两个可选项均不选时执行更新。\n- 分别仅选择价格、仅选择售卖时间及两项均选执行更新。\n- 核对任务详情及失败重试的原提交快照。\n\n**预期结果**：上下架和商品排序在全部组合下默认按总部更新；价格/售卖时间仅勾选时覆盖，未勾选保持门店值；库存、销量、本地ID和公共ID保留。\n\n\n### 先同步关联资料，再同步商品\n\n所属端：连锁店总部；页面：商品模板与五种同步\n\n商品写入前先处理带公共ID的基础资料。\n\n#### 依赖顺序与门店身份映射\n\n- **处理顺序**：先处理父级和子级公共分类、引用的小料，再处理属性分类、属性组及属性值、推荐标签，最后建立商品关联；各类资料分别按公共ID匹配。\n- 同ID更新保留门店本地ID；缺同ID创建；重复ID、失效父级、跨连锁引用阻断商品执行。\n- 分类、属性分类/组/值、小料、推荐标签处理完成后，将总部公共ID对应到当前门店的本地记录，再使用当前门店对应记录维护商品及层级关联；\n- 各门店独立维护映射，禁止跨门店混用本地ID。已有无公共ID资料不因名称相同自动与总部资料建立映射。\n\n#### 共享资料影响与失效处理\n\n- **共享资料影响**：多个商品可能引用同一分类、属性组、小料或标签。同步更新这些同公共ID资料的名称、价格或选择规则时，引用它的其他门店商品也会使用更新后的资料；不主动改变其他商品的分类、属性组或标签绑定。\n- 总部商品引用的公共资料不存在或已失效时，该商品同步失败，记录资料类型及公共ID；不能改为按名称查找门店资料。\n\n#### 总部删除后的门店边界\n\n- **总部删除未同步的影响范围**：总部删除商品、分类、属性分类、属性组、属性值、小料或推荐标签后，未执行同步的情况下，不影响门店现有数据；\n- 门店已有商品、基础资料及其关联保持不变，不自动删除门店记录或解除门店关联。\n- 总部自身删除仍遵守已明确的引用校验及同步锁。\n\n#### 异常与边界\n\n- 同步只创建缺失的公共资料、更新同ID资料及所选商品关联，不自动删除门店共享资料。\n- 总部已移除的组/值或标签记录，不因本次同步被物理删除；\n- 同ID属性组的值按ID新增或更新，未包含的门店原值保留，不把“总部没有该值”当作删除命令。\n- 商品的分类、属性组及推荐标签绑定按总部当前配置更新；\n- 未选商品的绑定保持原样。\n- 单个商品及其关联资料作为一次完整操作提交；任何一步失败，该商品本次修改全部不生效，其他商品继续处理。\n\n\n### 任务三级结果与字段快照\n\n所属端：连锁店总部；页面：任务记录与失败重试\n\n更新前的旧任务不再展示；更新后初始为空，仅展示更新后新创建的任务，支持任务→全部目标门店→失败商品。\n\n#### 新任务范围与提交快照\n\n- **本次功能更新后的展示范围**：商品任务记录不再展示更新前的旧任务数据；\n- 更新后尚未创建新任务时列表为空，显示“暂无数据”。\n- 新建同步或门店初始化任务成功提交后，列表正常显示对应新任务，并继续支持状态、详情及失败重试。\n- 以本次功能更新为界，不因进入页面、切换菜单或查询而重复清空更新后新任务；\n- 历史任务不回填到新列表。本条约定任务记录展示范围，不要求物理删除历史数据。\n- 提交固定商品、门店、选项及来源资料版本，执行复核资格。提交成功及任务编号反馈沿用《五种商品同步》的“提交结果与范围文案”，不重复定义。\n\n#### 三级结果与可重试范围\n\n- 门店部分商品失败时门店层记失败、原因“部分商品同步失败”，全部失败显示实际原因；分页及状态查询按当前筛选结果，每页20条。重试资格依本功能的“三级结果与可重试范围”。\n- 已成功=全部结束且无失败（成功和跳过均正常，全部跳过也记已成功）；\n- 部分完成=全部结束且同时有成功商品和失败商品，可同时有跳过；\n- 失败=全部结束且有失败商品、成功商品数为0，包括全部失败或只有失败和跳过的情况，跳过不计为成功。\n- 待处理=已提交未执行；处理中=执行未结束，未结束时不提前判定完成结果。\n- 仅已结束失败项可重试，不取消、删除或重跑成功及跳过项；\n- 重试结束后按当前全部商品结果重新汇总任务状态。\n- 任务、门店、商品三级的重新执行均只处理其范围内可重试的失败项，并继续执行资料快照、较新任务覆盖及资格复核。失败原因/历史尝试保留；待处理、处理中、成功和跳过均不能重试。\n\n#### 异常与边界\n\n- 成功、跳过、排队/处理中项不重试；单项失败不阻断其他项，保留失败历史尝试。\n\n#### 验证场景：失败与跳过的任务汇总及重试\n\n**前置条件**：同步任务包含因活动等原因失败的商品及因门店无同公共ID而跳过的商品。\n\n**操作步骤**\n\n- 执行同步，检查没有成功商品的任务记录。\n- 分别核对成功与失败及跳过混合、全部失败、全部跳过的任务状态。\n- 排除失败原因后仅重试失败项，并检查任务汇总状态。\n\n**预期结果**：失败＋跳过且成功数为0、全部失败均记失败；有成功且有失败记部分完成；全跳过沿用已成功；待处理/处理中不提前汇总。跳过项不重试，失败项重试成功后任务重新汇总为已成功。\n\n\n### 失败重试与同步锁\n\n所属端：连锁店总部；页面：任务记录与失败重试\n\n同步期间锁定商品及相关公共资料；失败重试前核对商品、关联资料和关联关系是否变化。\n\n#### 同步锁的范围与复核时机\n\n- **同步锁**：当前连锁存在待处理或处理中的同步任务时，商品信息、分类、属性（含属性分类、属性组及属性值）、小料、推荐标签均不可编辑或删除；\n- 包含列表行内编辑、弹窗保存、批量修改、删除及商品启用/禁用状态变更。\n- 操作入口及最终保存/删除时均重新校验，不允许通过已打开的编辑界面绕过限制。\n- 推荐标签的编辑、删除及商品关联变更，与商品、分类、属性、小料使用相同的同步锁；入口和提交时均校验。\n\n#### 重试前的资料变化校验\n\n- **失败重试校验**：从任务、门店或商品任一入口重新执行失败任务前，比较任务提交时的商品信息与当前商品信息，并比较商品关联的分类、属性（含属性分类、组、值及配置）、小料、推荐标签资料和关联关系。\n- **任一内容变更或被删除时，阻止旧任务重新执行，统一提示**：“商品信息已变更，请重新同步”。\n- **重新提交**：资料变化后需按当前资料重新发起同步任务，不得静默替换失败任务中的商品及关联资料；被阻止的重试不增加执行次数，也不写入门店。\n\n#### 较新任务、重复请求与执行范围\n\n- 旧任务重试不能覆盖同门店同公共ID较新已完成任务；连续点击/网络重发与写成功回执丢失不重复新增。\n- 重试只保留原任务失败范围和原勾选字段，记录每次尝试时间、失败原因和结果；待处理/处理中不得重复执行，任务结束且无其他同步任务时可重新编辑资料。\n\n#### 异常与边界\n\n- 商品名称未变但关联分类、属性或小料内容已变，同样阻止失败任务重试，并使用“商品信息已变更，请重新同步”的提示。\n- 仅与原任务商品无关联的公共资料变化，不视为原任务商品发生变化。关联推荐标签变更同样适用失败重试校验。\n\n#### 验证场景：同步锁及三级重试保护\n\n**前置条件**：先有待处理/处理中任务，再准备结束后的失败任务。\n\n**操作步骤**\n\n- 尝试行内、已打开弹窗、批量及标签关联变更。\n- 失败后修改商品或任一关联资料，从任务/门店/商品重试。\n\n**预期结果**：进行中锁阻断；资料变化时三个入口统一提示，不增加执行次数/写入。无关资料变化不误拦截。\n\n\n### 选择门店后统一初始化商品资料\n\n所属端：连锁店总部；页面：门店初始化\n\n直接选择门店并确认，一次初始化所选门店无公共ID的商品信息、商品分类、商品属性、商品小料及推荐标签；不再选择资料类型或要求分次执行。\n\n#### 门店范围与统一清理对象\n\n- 一次提交覆盖所选门店的商品信息、商品分类、商品属性（含属性分类、属性组及属性值）、商品小料、推荐标签，不按资料类型拆成独立任务。\n- 确认冻结具体门店范围，仅当前连锁有效运营、有权限且未删除/禁用门店；后续新增店不纳入原任务，资格依《五种商品同步》的“门店范围与资格复核”。\n- 各类记录分别按自身公共ID是否为空判断清理资格；有公共ID的记录全部保留，无论是否同名。属性组和值分别检查，不能只看商品或组有无公共ID就整批删除关联资料。\n\n#### 确认、执行顺序与结果\n\n- 首次确认仅校验门店并请求二次确认，不创建任务或清理；二次确定才提交。不再要求先完成另一次商品初始化任务，也不保留分类/属性/小料的分类型前置阻断。\n- 同一任务内部先处理无公共ID商品，再处理无公共ID的基础资料，执行时逐项复核公共ID、活动和引用关系。\n- 商品删除后，已解除引用的资料可继续清理；仍被保留商品、资料或公共子记录引用的记录按《引用保护、执行快照与重试》保留并记录失败原因，不强制解绑。\n- 某一类没有候选记录时继续处理其他类；所选门店全部范围均无可清理数据时，该门店记为跳过，原因“无可清理数据”，不再使用仅商品无候选就失败的旧规则。\n- 任务统一显示“门店商品初始化”；详情说明完整处理范围，失败项显示实际资料类型、门店本地ID及失败原因，任务/门店/单项失败重试继续沿用既定范围。\n\n#### 异常与边界\n\n- 初始化不按名称合并资料；仅处理无公共ID记录，有公共ID资料、仍被使用的记录和历史订单快照继续受保护。\n\n\n### 引用保护、执行快照与重试\n\n所属端：连锁店总部；页面：门店初始化\n\n清理旧资料时保护仍在使用的记录，保留原任务范围及历史订单。\n\n#### 候选快照、执行复核与重试\n\n- 二次提示点击【确定】提交任务时，内部冻结所选门店全部初始化范围内的无公共ID候选，保存资料类型、门店本地ID及必要的属性组归属；\n- 同一门店不同资料类型或不同组的本地ID相同也必须区分。\n- 失败重试只处理原任务失败项，不重新扫描后来新建的无ID记录。\n- **执行时复核候选**：已有关联公共ID则跳过保留，已被删记成功无变化；权限失效则失败。\n- 门店资格与商品同步使用同一标准；确认和执行时重新校验，不通过的门店不执行清理，其他门店继续。\n\n#### 活动、引用和属性层级保护\n\n- 商品参与门店活动按原规则失败，其他可清理商品继续；失败原因“商品参与门店活动，不可操作”。\n- 总部新增公共库不额外引入旧业务资料合并或历史关联迁移；\n- 基础资料原表复用不取消本次属性值行化及组、值公共ID字段处理。\n- 门店统一初始化先清理无ID商品，再处理本次全部无ID基础资料；\n- 仍被使用的分类、属性、小料或推荐标签失败并保留，不强制解除有效关联，其他可清理项继续执行。\n- 商品属性范围包括属性分类、属性组和属性值，分别检查各自公共ID；\n- 带ID组中的无ID值也进入候选，不能因组有ID漏掉旧值；\n- 无ID组含有带ID子值或仍被引用的值时保留组，记录失败原因。\n- 先清理可删除的无ID值，再处理组及属性分类，保留公共记录和有效层级关联。\n\n#### 订单快照与经营统计\n\n- 既有订单所需商品/属性快照与经营统计不能被清理任务破坏，具体留存方式复用系统。\n\n#### 异常与边界\n\n- 初始化不按名称合并资料，不强制解绑或删除被使用的资料；有公共ID的记录及历史订单快照必须保留。\n\n\n### 门店公共ID映射与保存规则\n\n所属端：商家APP；页面：旧版商家APP兼容\n\n门店沿用现有业务UI和原商品表，数据通过公共ID匹配处理；本条仅规定数据及保存规则，不新增核对页面。\n\n#### 门店身份与历史商品并存\n\n- 公共商品与同名无ID历史商品并存；商品初始化后只删除无ID候选。\n- 单门店复用原商品表及原有资料体系，增加公共ID映射字段，不改用总部公共商品新表；同步更新保留本地ID及既定门店经营字段。\n- 在现有角色权限允许的前提下，门店新增商品、分类、属性、小料不生成公共ID；本地新建的属性分类、属性组和属性值也不生成公共ID。门店不能手填、伪造或通过名称匹配自行获得公共ID。\n- 门店本地ID不由公共ID替换，映射与新建按《商品与基础资料使用稳定公共ID》的“公共身份与门店映射”；自建资料不补ID，按本功能的“门店身份与历史商品并存”、本功能的“已有公共ID保留与权限优先”。\n\n#### 无公共ID的直接保存与结果\n\n- 商家APP（新旧版本）、总后台和运营商PC保存无公共ID门店商品及基础资料时，先执行现有权限、同步锁和原表单校验；全部通过后按原流程直接保存，不因缺少公共ID增加二次确认或阻断。\n- 保存成功后公共ID仍为空，不自动生成、补填或按名称绑定；无ID资料不能直接参加公共ID匹配同步。保存失败按原业务规则反馈，不返回保存成功。\n\n#### 已有公共ID保留与权限优先\n\n- 已由总部公共库同步且带有公共ID的门店资料，在允许编辑范围内正常保存；\n- 旧版APP具体兼容依《旧版商家APP读写保护》，后端保留公共ID及关联身份并正常落库，不因公共ID有无阻断，不弹出无公共ID提示。\n- 品牌门店及各端原有权限优先；受限操作仍按既定权限提示阻断。无公共ID可直接保存不解除同步锁和其他既有保存校验，也不授予原本没有的操作权限。\n\n#### 总后台与运营商PC复制商品的公共ID处理\n\n- 适用于总后台及运营商PC后台复制带有公共ID的商品；\n- 总后台的“门店复制菜品”和“单独复制”两种情况均必须处理。\n- 复制创建目标商品时，不复制源商品公共ID，目标新商品公共ID为空；\n- 源商品及其公共ID保持不变。\n- 复制属于创建新门店商品，不适用原记录编辑时保留公共ID的规则；不得因同名、复制来源或客户端回传源公共ID而为目标商品保留或补绑公共ID。后续同步仍按既定公共ID匹配规则执行。\n- 复制仍须遵守当前角色权限、品牌门店限制、同步锁和原复制校验；不通过复制绕过受限新增/编辑。目标商品无公共ID不额外增加保存二次确认，成功后沿用原成功反馈。\n\n#### 异常与边界\n\n- 旧版商家APP允许保存的无公共ID资料按原有流程保存，公共ID仍为空；已有公共ID的资料保留原值。品牌连锁关联门店的推荐标签只读及其他品牌门店、同步锁等权限限制优先，不因兼容保存而解除。\n\n#### 验证场景：两端复制公共ID隔离\n\n**前置条件**：当前账号与门店允许复制，源商品带有公共ID。\n\n**操作步骤**\n\n- 分别执行总后台门店复制菜品、总后台单独复制、运营商PC复制商品。\n- 核对目标新商品和源商品；用受限账号复核不能绕过原复制权限。\n\n**预期结果**：三个入口复制出的目标商品公共ID均为空，不带入源公共ID；源商品公共ID不变，受限操作不新增目标商品。正式接口与数据库结果待联调。\n\n\n### 旧版商家APP读写保护\n\n所属端：商家APP；页面：旧版商家APP兼容\n\n先按现有权限和校验判断；有权限时，旧版APP保存商品、属性、小料及推荐标签不因公共ID有无而阻断。无ID仍为空，已有ID由后端保留并正常入库；不新增UI交互。\n\n#### 先校验权限再兼容保存\n\n- 先执行《商家APP门店操作权限》及当前角色权限、同步锁、引用保护和原有业务校验；\n- 无权操作时仍按原限制处理，不执行兼容写入。兼容只适用于有权操作且其他校验通过的保存，不因APP版本或公共ID有无放宽权限。\n- 有权限时，旧版商家APP处理商品、属性（含属性分类、组、值）、小料、推荐标签，以及既有范围中的分类，均按原有流程正常保存；\n- 不能仅因资料无公共ID、已有公共ID或客户端不认识公共ID而阻断或要求升级。\n- 无公共ID的资料保存后公共ID仍为空，不自动生成、补填或按名称绑定。\n\n#### 已有公共ID与关联身份保留\n\n- 已有公共ID的原记录正常保存后，公共ID必须仍以原值存在于数据库。\n- 公共ID以服务端当前记录为准；旧版未传、传空、传默认值或传入不同公共ID，均不能清空、替换或改绑原公共ID。\n- 该保护同时覆盖商品、属性分类/组/值、小料、推荐标签，不能只保护商品主记录。\n- 通过当前门店的原记录及稳定本地ID对应保存对象；保留原本地ID、公共ID、属性组值层级及有效关联。不按名称、数组顺序或跨门店本地ID猜测公共身份，不采用删除后重建原记录的方式完成兼容保存。\n- 只更新本次有权编辑且实际提交的业务字段；未上传的属性、小料、标签及关联保留。\n- 旧版整体覆盖商品或属性列表时，不能把不认识的新字段、默认空数组或空对象当成清空公共ID及未实际编辑关联的指令；\n- 明确且有权限的关联调整仍按原规则处理。\n- 属性值改名及删除先执行《总部属性组、属性值独立保存与公共ID》的“未删除商品使用的属性值保护”；\n- 允许改名时对应原值更新，不删除重建。品牌类型连锁店关联门店的标签和绑定按原只读权限保护；\n- 兼容保存不解除引用或权限限制。\n\n#### 旧结构适配与提交时保护\n\n- 后端适配旧版请求结构到当前记录，商品含公共属性并不等于旧版不能保存；在可准确对应原记录的前提下正常写入允许字段，并保留公共ID、组值身份、小料类型、计价和关联关系。\n- 确实无法唯一定位本次要修改的原记录时，不按同名或位置猜测，不错误绑定、重建或清空原数据；\n- 本次无法安全完成的保存沿用现有失败反馈，不得静默丢弃用户改动却返回保存成功。\n- 此为异常数据保护，不能作为所有带公共ID资料的统一阻断条件；\n- 旧版真实请求能否准确映射须联调核实。\n- 最终写入时以服务端当前公共ID和关联为准；总部同步或其他编辑已更新的身份、未提交字段不得被旧APP先前读取的数据覆盖。保存结果与实际落库一致，失败不留下部分公共ID或关联变更。\n\n#### 异常与边界\n\n- 品牌连锁关联门店的无公共ID保存兼容不授予标签维护权限；旧接口保存商品时保留原标签数据，直接新增、编辑、删除标签或更改关联仍不允许。普通连锁门店及其他门店标签沿用既有权限。\n\n#### 验证场景：有权保存的有ID与无ID资料\n\n**前置条件**：使用真实旧版APP，当前账号有对应操作权限，原业务校验通过。\n\n**操作步骤**\n\n- 对商品、属性分类/组/值、小料、推荐标签及分类分别保存无公共ID和已有公共ID的记录。\n- 覆盖旧请求未传、传空、默认值和不同公共ID的情况；检查接口结果及数据库，不仅检查页面提示。\n\n**预期结果**：两类资料均可正常保存；无ID仍空，有ID保持原值并存在数据库，原本地ID、层级和有效关联保留。不得因公共ID或APP版本统一阻断。\n\n#### 验证场景：权限、引用保护与旧接口不可绕过\n\n**前置条件**：分别选择有权限门店、品牌受限门店、同步锁及属性值被引用场景。\n\n**操作步骤**\n\n- 通过旧接口提交商品、属性、小料、标签和绑定改动，并核对权限判定。\n- 在有权限场景执行正常业务保存，在受限场景核对失败及原数据。\n\n**预期结果**：仅有权限且通过原校验的操作兼容保存；受限操作按原规则处理，兼容不授予权限、不绕过标签只读、同步锁及属性值引用保护。\n\n#### 验证场景：嵌套覆盖、同名映射与并发保存\n\n**前置条件**：准备同名不同本地ID的属性值、小料或标签，及商品已关联的公共资料。\n\n**操作步骤**\n\n- 提交旧版整组/整表保存请求，覆盖缺字段、默认空集合、属性改名、顺序变化与无法唯一对应记录的异常。\n- 在旧APP读取后由总部同步更新，再保存旧APP允许修改的字段；核对所有关联表、公共ID和经营字段。\n\n**预期结果**：未编辑关联及当前公共身份不被误清空或重建，同名不串绑；允许的改动正确落库。映射异常不猜测写入、不静默成功，失败无部分变更。真实实现待联调。\n\n\n### 旧显示结构与库存订单兼容\n\n所属端：商家APP；页面：旧版商家APP兼容\n\n兼容展示不能改变实体身份和计价语义。\n\n#### 旧版结构读取与写入边界\n\n- 旧版按其原有页面结构读取属性数据，内部ID与选值关系不变化；不能把小料当成规格返回而改变价格或库存。\n- 旧版读写结构由后端适配，保存统一执行《旧版商家APP读写保护》；\n- 不以已有公共ID或新版公共属性为由将资料统一设为只读。\n- 允许字段正常保存，公共身份及计价语义保留；无法唯一映射的真实异常按该功能的数据保护处理。\n- 新旧接口需分别联调，品牌标签权限依《商家APP门店操作权限》。\n\n#### 库存、订单与用户端回归\n\n- 总部同步新增/更新时上下架及商品排序默认按总部更新；其他兼容保存不改写门店上下架；库存、订单扣减、退款返还和成交快照保留；历史订单商品/组/值名称按下单时快照展示。\n- 用户端不新增页面，本期回归促销类型、售卖时间、规格价格、购物车失效校验和旧订单展示。\n\n\n### 商家APP门店操作权限\n\n所属端：商家APP；页面：商家APP操作限制\n\n按连锁店类型、门店创建来源及操作端执行对应限制。\n\n#### 适用门店与版本边界\n\n- **适用范围**：品牌类型的连锁店所关联、非通过开放平台创建的门店，操作限制保持与现有开放平台一致。\n- 连锁类型的连锁店关联门店不增加本次限制，沿用普通门店现有角色权限；\n- 开放平台创建的门店沿用已有开放平台限制，不因本次规则解除或改写。\n-  推荐标签另按本条统一只读规则处理。\n- 此为门店类型对应的业务权限限制，与APP新旧版本无关；旧版本公共ID兼容不能放宽本规则。除已单独明确的推荐标签只读规则外，未列明操作沿用现有权限。\n\n#### 商品、基础资料与允许操作\n\n- **商品管理**：不可新增、编辑、删除商品；属性管理、分类管理不可操作；除商品批量上架、批量下架外，其他批量操作不可操作。\n- **允许的操作**：商品单个上架、下架，以及批量上架、批量下架；小料库存修改。\n- 受限保存一律不写入被禁止改动，权限依本条适用范围与允许/禁止操作判断。\n\n#### 营销活动和推荐标签\n\n- **营销活动**：连锁店后台创建的活动不可操作；商家可自行创建活动，自建活动可以编辑。\n- 本条推荐标签限制仅适用于关联品牌类型连锁店的门店，新旧商家APP均执行：不能自行新增、删除、编辑标签或变更标签商品绑定，只可查看关联商品，由品牌连锁店总部维护。\n- 普通连锁门店及其他门店沿用既有权限，不扩展本限制。\n\n#### 异常与边界\n\n- 连锁类型门店不套用品牌门店限制；开放平台创建门店保留原有权限。推荐标签限制按关联连锁店是否为品牌类型单独判断，不扩展到普通连锁或其他门店。\n- 受限改动不能因入口、保存方式或APP版本不同而写入\n\n\n### 总后台品牌门店操作权限\n\n所属端：总后台；页面：总后台操作限制\n\n按连锁店类型、门店创建来源及操作端执行对应限制。\n\n#### 适用门店与权限边界\n\n- **适用范围**：品牌类型的连锁店所关联、非通过开放平台创建的门店，操作限制保持与现有开放平台一致。\n- 连锁类型的连锁店关联门店不增加本次限制，沿用普通门店现有角色权限；\n- 开放平台创建的门店沿用已有开放平台限制，不因本次规则解除或改写。\n- 未列明操作沿用现有权限；总后台面向门店的限制不改变连锁店总部公共库及模板功能。\n\n#### 商品资料与营销活动限制\n\n- 商品新增、编辑、删除，以及属性、分类、小料库、标签管理均不可操作，受限保存不写入。\n- 批量上下架和商品上架/下架沿用当前权限，可操作；仍按该账号现有角色权限执行，本次不新增上下架限制。\n- **营销活动**：仅可以查看，不可新增、编辑或删除活动。\n\n#### 复制商品的公共ID边界\n\n- 总后台门店复制菜品及单独复制遵循《门店公共ID映射与保存规则》的“总后台与运营商PC复制商品的公共ID处理”：目标新商品不复制源商品公共ID，公共ID为空，源商品保持原公共ID；\n- 操作仍受本端当前权限及原复制校验约束。\n\n#### 异常与边界\n\n- 连锁类型门店不套用品牌门店限制；开放平台创建的门店保持原有权限。\n- 受限改动不能因入口、保存方式或APP版本不同而写入\n\n\n### 运营商PC品牌门店操作权限\n\n所属端：运营商PC后台；页面：运营商PC操作限制\n\n按连锁店类型、门店创建来源及操作端执行对应限制。\n\n#### 适用门店与既有权限\n\n- **适用范围**：品牌类型的连锁店所关联、非通过开放平台创建的门店，操作限制保持与现有开放平台一致。\n- 连锁类型的连锁店关联门店不增加本次限制，沿用普通门店现有角色权限；\n- 开放平台创建的门店沿用已有开放平台限制，不因本次规则解除或改写。\n- 运营商自行创建活动的后续维护，以及图片未列明的其他操作，沿用现有权限，不额外扩大授权或限制。\n\n#### 商品资料与营销活动限制\n\n- 商品新增、编辑、删除，以及属性、分类、小料库、标签管理均不可操作，受限保存不写入。\n- 批量上下架和商品上架/下架沿用当前权限，可操作；仍按该账号现有角色权限执行，本次不新增上下架限制。\n- **营销活动**：可以给门店新增活动；连锁店后台创建的活动不可编辑，只可以查看。\n\n#### 复制商品的公共ID边界\n\n- 运营商PC复制商品遵循《门店公共ID映射与保存规则》的“总后台与运营商PC复制商品的公共ID处理”：目标新商品不复制源商品公共ID，公共ID为空，源商品保持原公共ID；\n- 操作仍受本端当前权限及原复制校验约束。\n\n#### 异常与边界\n\n- 连锁类型门店不套用品牌门店限制；开放平台创建的门店保持原有权限。\n- 受限改动不能因入口、保存方式或APP版本不同而写入\n\n\n### 开放平台绑定连锁品牌后的商品管理处理\n\n所属端：连锁店总部；页面：开放平台处理\n\n连锁总部关联开放平台时只隐藏商品管理及其子菜单，保留其余五项菜单；单门店及未关联的总部保留商品管理。\n\n#### 绑定总部的操作校验\n\n- 当前应用绑定本连锁品牌且身份为连锁总部时，禁止总部商品管理操作；单门店或未绑定总部沿用原权限，不能据此新增授权。\n- 总部商品管理的顶部导航、已有打开页面及直接地址入口不能绕过限制；进入页面或提交相关编辑、删除等商品管理操作时，均按当前品牌绑定关系校验并阻止受限操作。不可仅隐藏菜单而继续允许操作。\n\n#### 单店身份与切换复核\n\n- 切换到单门店身份后，保留单门店现有商品操作；不能将总部因应用绑定品牌而产生的整组菜单隐藏规则直接套用至单门店。单门店继续执行其自身既有角色、开放平台及品牌门店权限，不额外放开受限权限。\n- 总部与单门店切换时重新判断当前身份和应用/品牌绑定关系，避免沿用上一身份的菜单及操作权限；切换不修改已有商品或门店数据。\n\n#### 首页引导资格\n\n- 首页引导资格及已读处理统一依《首页三步菜单改版引导》的“展示资格与权限优先”、《首页三步菜单改版引导》的“已读记录与再次展示”、《首页三步菜单改版引导》的“展示资格与权限优先”；\n- 评审身份选择仅用于模拟，不新增业务配置入口。\n\n#### 异常与边界\n\n- 品牌绑定以实际应用关联的连锁品牌为准，不因其他品牌已绑定而影响当前总部。\n- 单门店“保留操作”指沿用原权限，不能覆盖已有开放平台创建门店限制或品牌门店多端限制。\n\n\n### 首页三步菜单改版引导\n\n所属端：连锁店总部；页面：首页 · 商品管理改版引导\n\n新增功能及改版说明仍在总部首页弹窗中展示；仅有商品管理菜单权限时首次自动弹出三步引导，跳过或我知道了后不再自动显示。\n\n#### 展示资格与权限优先\n\n- 本次改版后，按当前用户、连锁品牌和应用绑定关系判断商品管理菜单权限，仅有权限的普通连锁/品牌总部首次登录首页可展示引导。\n- **权限优先**：开放平台应用已绑定当前品牌的连锁店总部，登录首页不显示本次引导弹窗；\n- 其他无商品管理菜单权限的总部同样不显示。未展示不等于已读，不因无权限自动标记为跳过或完成；\n- 账号/连锁身份变化后按当前权限重新判断，已读频次规则继续独立生效。\n\n#### 已读记录与再次展示\n\n- 已读按用户、连锁总部、本次改版独立记录。跳过或第3步完成才记已读，之后进入/刷新/重登不自动重弹；仅前后步或中途离开/刷新不记已读，下次仍可展示。\n\n#### 新版模板的使用顺序\n\n- **新版使用顺序**：先在公共商品库创建公共商品，再创建商品模板并添加公共商品，最后同步至门店。更新前的模板数据不自动展示或恢复为新版模板；新版模板依旧引用公共商品，不在模板内直接新建商品。\n",
    "frontend": "# 连锁店总部 · 公共商品库与基础资料公共ID\n\n版本：V1.0\n\n## 公共说明\n\n### 共享定义：公共ID与本地ID\n\n公共ID标识总部公共资料，本地ID标识某门店自身记录。具体生成、匹配及保存规则唯一维护于《商品与基础资料使用稳定公共ID》；\n\n### 共享定义：推荐标签与是否推荐\n\n推荐标签是可绑定商品的公共资料；“是否推荐”是门店商品独立开关。同步口径见《公共推荐标签与推荐状态》、《更新字段分组与库存保护》。\n\n### 文档信息\n\n| 项目 | 内容 |\n| --- | --- |\n| 建档日期 | 2026-11-16 |\n| 最近修订日期 | 2026-11-19 |\n| 版本 | V1.0 |\n| 正式系统开发／上线 | 待确认 |\n| 本地联动评审 | [打开](商品公共库与基础资料公共ID_联动评审.html) |\n\n### 目标与范围\n\n本次改动后，连锁店后台不再提供套餐功能入口。\n\n总部新增独立公共商品库，模板引用公共商品；普通连锁与品牌总部均适用。保留单门店原表、结构及页面，本期按既定规则补公共ID映射和保存保护。仅总部已有明确改版及绑定品牌总部菜单显隐发生变化；各端无公共ID保存不再新增二次确认；商家APP、总后台、运营商PC不新增权限核对业务页面，用户端不新增页面。商品使用新增表及自增ID，分类、属性分类、属性组、小料、推荐标签复用现有表及记录ID；属性值行化和组、值公共ID字段为本次独立处理范围，具体取值见《商品与基础资料使用稳定公共ID》的“公共ID来源与表复用”。门店初始化直接选择门店后，统一处理无公共ID的商品信息、商品分类、商品属性、商品小料和推荐标签，不再按资料类型分别发起；有公共ID资料及既有引用、历史订单保护按对应规则保留。\n\n### 关键流程与规则入口\n\n公共资料（《公共分类与层级身份》 /《总部属性组、属性值独立保存与公共ID》 /《公共小料按ID同步》 /《公共推荐标签与推荐状态》） → 公共商品及两种导入 → 新版模板（《模板管理与公共商品引用》） → 同步与字段规则 → 任务及失败处理 → 确认可经营后清理门店旧资料。跨端保存、兼容及权限见《门店公共ID映射与保存规则》 / 旧版APP兼容 / 各端门店权限；首页资格见《开放平台绑定连锁品牌后的商品管理处理》 /《首页三步菜单改版引导》。\n\n### 阅读方式\n\n评审页默认展示全部界面，首页商品管理改版引导位于第一屏，页面筛选也将该界面排在首位。引导弹窗默认显示时，评审面板自动选中对应引导需求；桌面直接滚动至该说明，无需点击编号。\n\n后端章节维护业务判断、校验、状态及结果；前端章节维护展示和操作反馈，通过功能名称与主题标题查阅业务依据。异常紧邻所属功能。相同功能在两章出现，只承载各自角色内容。规则按业务主题分组，使用加粗小标题和无序要点，不逐条编号；关键场景是验收依据，不表示测试已通过。\n\n### 待确认与验证边界\n\n需求按本文所列业务规则执行。真实APP、接口、数据库、图片上传、Excel解析、队列并发、重复任务保护、库存订单与历史快照需独立联调，本地原型不能证明正式系统验收完成。\n\n### 原型演示限制\n\n原型中的字母前缀ID仅为演示标识，不代表正式系统数据库ID生成方式；正式取值以“公共ID来源与表复用”为准。使用本地内存模拟，不连接真实业务写接口；刷新重置示例。文件选择只演示文件名反馈，不解析导入表格；CSV下载只用于展示当前示例格式。兼容卡片、权限表、绑定/身份选择均为评审辅助，不能当作新增业务配置页面。任务五状态入口与DEMO记录独立于新任务列表，入口及返回旁标注“仅原型演示显示，实际UI界面不显示”；不回填历史任务、不创建真实任务。首页引导原型使用浏览器本地已读模拟。为便于评审，每次打开或重置本原型均从引导第一步演示，不受既有本地已读标记影响；本轮跳过/完成后关闭，权限条件仍生效。这仅为原型演示，不改变正式业务已读后不再自动弹出的规则。\n\n\n## 前端 UI 与交互\n\n### 总部框架与公共库布局\n\n- 总部沿用已确认参考图的白色顶栏、左侧菜单、顶部面包屑与菜单导航、浅灰背景及蓝色主按钮。\n- 公共库五个页签内容区不重复展示路径、页面标题、辅助说明或示例数据角标，名称仅在导航及页签展示；不展示公共ID关系示意栏。常驻业务说明保留，具体内容见《商品与基础资料使用稳定公共ID》。\n\n\n\n### 商品与基础资料使用稳定公共ID\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n商品公共ID取新增商品表的自增ID；基础资料复用现有表的记录ID，属性值行化后记录公共ID。门店保留本地ID并保存对应总部公共ID。\n\n#### 菜单与页签\n\n- **左侧菜单**：一级菜单为：商品管理；二级依次为：公共商品库（新增）、商品模板管理(改版优化)、商品任务记录\n- 公共商品库内展示五个页签，按从左到右顺序依次为【商品管理】、【分类管理】、【属性管理】、【小料库管理】、【推荐标签】；进入公共商品库时，默认选中并展示【商品管理】页签。\n\n#### 顶部常驻说明与下载\n\n- 顶部按顺序常驻以下四条说明，切换公共库页签仍可见。\n- **说明文案**：连锁店总部可在公共商品库中创建和管理商品，并将商品同步至门店。系统通过商品公共ID识别对应商品，用于后续商品信息更新。\n- **说明文案**：无商品公共 ID 的商品不可同步到连锁店关联的门店，建议直接删除，并从公共商品库重新添加。删除模板中的旧商品不会删除门店已有商品；\n- **说明文案**：如果门店已经同步了公共库的商品，门店的旧商品可以清除。\n- **说明文案**：总部公共商品资料与导入说明：商品可通过新建、导入表格或关联门店快捷导入添加。总部不维护总库存、每日库存和虚拟销量。请使用最新版导入表格，单次最多 200 条。下载表格示例 ↓\n- 点击顶部说明中的“下载表格示例 ↓”直接下载示例表格，不弹窗、不跳转页面；原型沿用现有新版CSV示例。\n\n#### 各端展示边界\n\n- **展示边界**：属性值公共ID仅数据库保存，前端不展示；商家端通过公共ID处理数据，UI沿用现有；总后台、运营商PC界面UI本期暂无调整。\n\n\n### 商品列表与行内编辑\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n公共库按左侧分类、右侧未删除商品展示，分类列表按一级排序排列，二级仅在所属一级下排序，修改后立即重排；后台同排序值按分类ID倒序，用户端排序规则沿用现有规则不变；商品字段可横向滚动、操作固定右侧。\n\n#### 查询条件与列表展示\n\n- 商品名称支持名称模糊或公共ID精准搜索；促销类型默认全部，选项为全部、无、折扣、第二份促销。商品分类改为左侧分类列表，不再同时展示顶部分类下拉。\n- 左侧展示全部商品入口及未删除的公共一级、二级分类；\n- 后台分类列表先按一级分类排序值从小到大排列一级及其二级整组，排序值相同按一级分类ID倒序；\n- 展开后二级紧随所属一级，仅在同一一级下按排序值从小到大排列，二级排序值相同按二级分类ID倒序，不与其他一级下的二级或一级分类比较。\n- 修改二级排序不改变一级及整组位置。点击一级展示本级及下属二级商品，点击二级仅展示本类；\n- 默认全部商品。分类名称后紧跟括号展示该范围未删除商品数，禁用或下架商品仍计入。\n- 左侧分类栏不再单列“商品分类”标题；顶部同一行左侧为“全部商品（总数）”入口，去掉该入口背景，包括选中和悬停背景；\n- 右侧标题为“排序”，不再重复展示一行全部商品。各分类数量紧跟分类名称显示为“分类名称（数量）”，数字不再独立靠右排列。\n- 分类名称最多显示8个字，超过8字显示前8字加“...”，悬停可查看完整名称；\n- 仅截断显示，不修改原分类名称。分类排序输入框收窄，与名称及数量保持同一行；\n- 二级缩进和分类范围规则保留。\n- 公共库商品列表左侧，有二级分类的一级分类显示独立展开/收起按钮，首次进入默认折叠，点击按钮展开显示所属二级，再次点击收起；\n- 无二级的分类不显示折叠按钮。点击分类名称仅切换商品范围，点击展开/收起不改变当前分类、筛选、数量及已选商品，不修改分类排序或资料；\n- 收起当前选中二级的父级时保留原二级筛选和已选商品。\n- 同一页面内排序保存或查询重绘保留展开状态，重置演示恢复默认折叠。\n- 右侧展示当前分类下所有未删除商品，包括启用、禁用及下架商品；同时应用名称/公共ID与促销筛选，不因未启用而从管理列表隐藏。不新增分页截断分类商品。\n- 列表展示勾选、商品公共ID、排序、商品名称（图片和名称）、分类、分类类型、促销类型、价格、打包费、状态及操作。\n- 状态列仅显示“启用”或“禁用”，不显示上架/下架状态或副标题。\n- 名称最多两行，超出省略并可查看完整名称。中间字段区域可左右滑动查看全部列，编辑/复制/删除操作列固定在右侧，横向滚动时保持可见且不遮挡字段。\n- 空列表显示“暂无数据”；分类或筛选结果为空显示“暂无符合条件的商品”。分类切换与查询仅改变显示范围，不修改商品或已保存数据。\n\n#### 名称和图片编辑\n\n- 名称旁【编辑】打开“编辑商品信息”弹窗，回显名称和图片；图片选择本地文件后预览。仅展示这两个字段及取消/确定，取消或关闭不保存；不进入完整表单。校验失败保留输入，成功后列表及模板回显更新结果。\n\n#### 行内输入与完整编辑\n\n- 排序、价格、打包费显示有边框的输入框，失焦发起保存；启用状态只读。最右操作列【编辑】仍打开完整商品表单，与名称旁编辑区分。\n\n#### 跨分类选择与批量入口\n\n- 行勾选、当前结果全选与已选数量联动。表头全选只作用当前分类及筛选结果，不扩展至其他分类或全部公共库；部分选中显示半选。切换分类、查询及重置筛选保留本次勾选。\n- 右侧列表上方持续展示当前结果数、累计已选数，以及其他分类/筛选结果中已选数量，并提供“清空已选”。\n- 批量删除只处理累计明确勾选的商品，公共库确认弹窗仅显示本次总数，模板移除仍列出完整范围；\n- 不可因切换分类或过滤而静默改变删除对象。切换到其他业务列表时清空选择，公共库与不同模板之间不串选。\n\n#### 异常与边界\n\n- 当前连锁存在待处理或处理中的同步任务时，商品信息、属性、分类、小料、推荐标签均不可编辑或删除，包含行内保存和批量操作；保存及删除时再次校验，提示“商品正在同步，暂无法编辑/删除”。\n\n#### 验证场景：名称旁编辑与取消\n\n**前置条件**：商品列表存在可编辑商品，当前无同步锁。\n\n**操作步骤**\n\n- 点击名称旁编辑，修改名称/图片后取消。\n- 再次打开并确认修改。\n\n**预期结果**：取消不保存；确认只更新当前名称/图片，列表及模板回显；公共ID和其他字段保留。\n\n#### 验证场景：分类层级、排序与固定操作列\n\n**前置条件**：公共库包含一级/二级分类、禁用及已删除商品。\n\n**操作步骤**\n\n- 核对同级分类按排序值从小到大及父子层级，切换一级、二级和全部。\n- 将后方分类排序改为更小的值并失焦保存，核对立即移动到对应位置，公共库、模板与分类管理顺序一致；核对当前分类及已选商品保留。\n- 左右滚动商品表格并操作最右侧按钮。\n\n**预期结果**：仅显示未删除商品，一级包含下级，禁用仍展示；分类排序维护共用字段，保存立即重排，后台排序值小的靠前，相同按分类ID倒序；用户端排序规则保持现有规则不变，二级仍跟随所属一级；名称层级仅从分类管理修改；中间列可滚动，操作始终可见。\n\n\n### 创建、编辑与复制公共商品\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n商品只能使用新版公共基础资料。\n\n#### 表单字段与隐藏项\n\n- 表单保留人气值、名称、分类（有二级须到二级）、单图、价格、打包费、售卖时间、促销、起购量、推荐标签、最多4个且每个最多10字的商品信息、图文描述、状态、排序（默认99）。\n- 总部商品表单不展示总库存、每日库存、虚拟销量三个字段。\n- 新建、完整编辑商品表单保留“基本信息”“商品属性”两个页签。\n\n#### 商品分类、属性、小料及推荐标签选择\n\n- 通过选择器关联商品分类、属性分类、属性组、小料及推荐标签；\n- 需要新增时，前往对应管理页面创建。选择器按既定规则展示资料名称与只读公共ID，只展示有效且有公共ID的资料；\n- 属性值公共ID仅在后台保存，前端不展示。\n\n#### 售卖时间与促销控件\n\n- 表单提供全时段/分时段及既定促销选项；校验依本功能的“商品配置与保存校验”，沿用现有系统控件与反馈。\n\n#### 总部商品默认上架与表单字段\n\n- 公共商品库商品新建、编辑、复制及模板商品只读查看表单均移除“是否上下架”字段，不展示该下拉或只读字段。\n- 总部创建的新公共商品默认上架；复制创建的新公共商品也按新建默认上架，不复制来源的下架状态。\n- 商品启用/禁用字段保留，与上下架状态区分。\n- 编辑已有商品不因该字段未显示或未提交而变更其原上下架状态；模板引用保持与公共库同一商品资料，不单独维护上下架。门店上架/下架通过已确认的同步操作执行；同步更新默认包含上下架的既定规则保留。\n\n#### 异常与边界\n\n- 失败保留当前表单，保存防连点。\n\n\n### 公共库批量分类、删除与模板移除\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n公共库单项与批量删除仅按本次商品数量二次确认，确认后逐项校验并执行；结果以醒目吐司提示删除成功、删除失败或成功与不可处理数量，门店使用保护保留。\n\n#### 删除拦截与确认范围\n\n- 公共库单项删除与批量删除均进入本功能“批量删除确认与结果”的简洁二次确认弹窗，单项数量为1；不在确认前单独弹出门店使用原因或商品清单。\n- 公共库删除后的模板引用清理及门店保护遵循本功能“公共库删除与模板移除”，确认弹窗不额外展示范围说明。\n- **模板移除的确认弹窗须说明**：只从当前模板移除商品，公共商品库、其他模板及门店已有商品均保留；与公共库删除使用不同的范围说明。\n\n#### 批量分类确认流程\n\n- 点击【批量修改分类】先显示“提示”确认框，文案“确定要批量修改这些商品的分类吗?”，底部取消、确定；取消关闭且不改分类，确定后进入【批量修改分类】弹窗。\n\n#### 分类选择与保存反馈\n\n- 初始只显示必填一级分类，提示“请选择一级分类”，不预选；有二级时才显示必填二级，默认“请选择二级分类”。候选依本功能的“批量分类的范围、校验和结果”。\n- 切换一级清空二级；有子类未选二级不能提交。底部取消/确认；取消不修改商品，校验失败保留选择。最终校验依本功能的“批量分类的范围、校验和结果”。\n\n#### 批量删除确认与结果\n\n- 空选提示“请先选择商品”。公共库单项或批量删除弹窗标题为“确认删除”，正文仅显示“确定要批量删除{N}件商品吗？”，N为本次选择总数；\n- 底部仅取消、确定。确认按钮不因预估全部不可删除而禁用，不展示商品表格、可删除/不可删除数量、逐项原因或额外说明。\n- 取消或关闭弹窗不修改数据、保留勾选；点击确定后直接开始校验并执行，不增加清单确认或再次确认步骤。\n- 公共库单项或批量删除在二次确认并执行完成后，关闭确认弹窗，统一用当前可视区域上方居中的吐司提示结果，不受列表滚动位置影响，约4.5秒后自动消失；\n- 移除列表内成功/失败结果条。全部成功提示“删除成功”；\n- 全部失败或全部不可处理提示“删除失败”；部分成功、部分失败提示“删除 {成功数} 件商品，不可处理 {失败数} 件”。\n- 失败数包含被使用、已失效等不可处理项，按本次选择总数核对；\n- 仅显示对应吐司结果提示，不展示可展开明细或逐项原因。\n- 模板批量删除仍使用“确认移除模板商品”及“确认移除 N 件”，仅解除当前模板引用，不删除公共库、其他模板及门店；原商品清单、条件变化再次确认及未处理原因展示保留，不使用公共库的精简确认流程。\n\n#### 验证场景：跨分类批量删除与部分不可删除\n\n**前置条件**：多个分类中存在已被门店使用和未使用的公共商品。\n\n**操作步骤**\n\n- 在不同分类勾选商品并进行搜索，核对累计及隐藏已选数量。\n- 打开批量删除，核对弹窗仅显示总数及取消/确定；取消后重新打开并确定。\n- 在确认前改变引用条件，检查执行时逐项校验及三种结果反馈。\n\n**预期结果**：仅处理本次明确勾选范围；被引用项跳过，其他项确认后删除并清理模板引用；取消或同步锁无删除写入；资格变化直接据实执行，无再次确认。全部成功提示删除成功、全部失败提示删除失败，部分成功显示删除N件商品、不可处理M件，不展示明细。\n\n\n### 表格导入格式与规则\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n点击导入商品直接选择本地表格；表格按九列格式填写，最多200条。\n\n#### 本地选文件与示例下载\n\n- **导入入口**：点击【导入商品】直接调起系统本地文件选择器，不展示中间导入弹窗；取消选择不修改商品或公共资料。\n- 文件格式及列顺序依本功能的“文件格式与整批校验”，沿用顶部说明的“下载表格示例 ↓”入口；不增加网页导入预览步骤。\n\n\n### 关联门店快捷导入\n\n所属端：连锁店总部；页面：公共商品库 · 商品管理\n\n快捷导入时，门店商品有公共ID而当前连锁公共库不存在该ID则跳过；已有同ID商品继续跳过，无公共ID商品按原规则新建；分类、属性、小料的公共ID处理规则保留。\n\n#### 选店与切店\n\n- 打开快捷导入弹窗时仅展示第1步“选择从哪个门店导入”，门店下拉默认展开，按现有顺序列出前10家符合来源资格的门店；不足10家展示实际数量，不默认选中门店，不提前展示第2步。\n- 门店名称输入与候选选择合为一个可搜索下拉，不再分开设置搜索框和原生门店选择框。\n- 输入名称时模糊匹配当前全部符合资格的关联门店，展示对应门店ID和名称；\n- 可搜索默认10家以外的门店，保留原ID搜索能力。无匹配时显示“暂无符合条件的门店”。\n- 选择门店后展示第2步“选择您要导入的商品”，加载该门店符合资格的商品、分类和已选列表。修改门店搜索词时清除原门店选择、商品及分类勾选并隐藏第2步；重新选店后展示对应数据，不串用上家门店商品。\n- 未选定有效门店时确认导入禁用；关闭并重新打开弹窗恢复未选店及默认10家候选，需重新选择门店。\n\n#### 顶部导入说明\n\n- **快捷导入顶部说明**：按商品公共 ID 判断是否导入。\n- **①门店商品有公共 ID，且公共库已有相同 ID**：跳过，不重复导入、不覆盖。\n- **②门店商品有公共 ID，但当前连锁公共库没有相同 ID**：该条不导入，直接跳过。\n- **③门店商品无公共 ID**：直接导入，每件生成一个唯一的新公共 ID。\n- 门店中同名的不同商品分别导入，不按名称或分类合并。\n- 商品分类和完整商品属性一并导入，包括属性组、属性值、规格及小料配置。\n- 不导入门店销量、点赞、总库存、每日库存和虚拟销量。\n- **分类、属性、小料按公共ID匹配**：总部存在相同公共ID直接复用；\n- 来源无公共ID或总部不存在该公共ID时新建，再关联属性和商品；\n- 不按名称合并。\n\n#### 分类选品与空态\n\n- 顶部保留现有“快捷导入顶部说明”。其下第1步为可搜索的门店下拉；\n- **只有选定门店后才展示第2步三栏**：分类、当前分类菜品、已选商品。\n- 分类展示已选数及可选总数，支持全选、分类勾选、单品勾选、跨分类保留、单项移除及全部删除。\n- 全部计数及全选范围只包含过滤后的可导入商品。\n- 无符合条件门店时显示空态并禁止导入；选店后无可导入菜品显示空态，不展示被排除项。\n\n#### 验证场景：默认10家与搜索选店后展示第二步\n\n**前置条件**：当前账号绑定超过10家符合资格的门店，并有不符合资格的门店。\n\n**操作步骤**\n\n- 打开快捷导入，检查默认候选与第2步。\n- 模糊输入默认前10家以外的门店名称并选择。\n- 勾选商品，再修改门店搜索词，选择另一家门店；关闭后重新打开。\n\n**预期结果**：默认只显示前10家且无预选门店；名称模糊匹配全部合资格门店，选择后显示该店商品；改搜索词清空门店/商品/分类并隐藏第2步，重新选店不串数据，重开恢复初始状态。\n\n\n### 公共分类与层级身份\n\n所属端：连锁店总部；页面：公共分类管理\n\n分类改名与调整按ID更新，不因名称相同合并门店分类；连锁店总部分类管理仅查询和显示含公共ID的数据。\n\n#### 页面入口与列表\n\n- 分类页沿用原有添加、编辑和删除入口，分类公共ID只读，父子关系保留，不展示门店初始化入口；初始化统一从商品模板管理进入。\n- 沿用原分类列表样式，将“ID”改为“分类公共ID”；\n- 依次为勾选、分类公共ID、分类名称、分类类型、分类图标、显示、排序、操作。\n- 保留名称/排序输入、图标、显示开关、父子层级展开收起、编辑/删除；\n- 添加右侧为批量删除。保存保留公共ID，权限及同步锁依《商品与基础资料使用稳定公共ID》、《失败重试与同步锁》。\n- 按总部含公共ID的数据范围过滤后无记录时，沿用当前页面既有空状态；搜索、重置及再次进入均不显示无公共ID记录。\n\n#### 批量删除确认和结果\n\n- 【添加分类】右侧增加【批量删除】，列表增加勾选/全选及已选分类数。\n- 空选提示“请选择需要删除的分类”；已选时确认框显示数量及被使用项不删的说明。取消不写入，完成刷新并清空勾选，反馈已删除/因被使用未删除数量。\n\n#### 新增和编辑弹窗\n\n- “新增分类”弹窗依次为只读公共ID、名称、上级、分类类型（普通/必点）、图标、描述、排序、是否显示（开启/隐藏），底部取消/确认；编辑同样式。新建普通类型和开启仅为演示默认值，取消不保存。\n\n\n### 总部属性组、属性值独立保存与公共ID\n\n所属端：连锁店总部；页面：公共属性与属性值\n\n属性组复用现有表并增加公共ID字段；属性值单独行化，每值一行并增加公共ID字段，按行化后记录ID保存总部属性值公共ID。 未删除商品正在使用的属性值禁止修改名称和删除。\n\n#### 维护顺序与分类列表\n\n- **维护顺序**：创建属性分类 → 进入分类【属性列表】 → 添加属性 → 在属性内添加值。\n- **属性分类界面沿用本次现有样式**：顶部保留【添加属性分类】，列表列为公共ID、分类名称、属性数、状态、操作；\n- 原“编号”改为“公共ID”。操作保留属性列表、编辑、删除，不恢复之前已移除的分类示例按钮或额外标题。\n- 属性保存后及返回属性分类列表时，列表中的属性数与该分类当前实际属性数量一致。\n\n#### 属性列表与公共ID展示\n\n- **分类内属性列表沿用现有样式**：顶部【添加属性】、【返回属性分类列表】，展示当前所属分类及属性名称查询；\n- 原“编号”改为“公共ID”。列表保留属性名称、属性值名称、属性类型、排序、编辑和删除；\n- 每个属性值独立行展示名称，不展示属性值公共ID；属性组公共ID继续展示，属性值公共ID仅在数据库中保存，用于同步匹配与更新。\n- 属性名称、排序沿用列表输入方式，修改保留公共ID并受同步锁保护。\n- 属性值公共ID不在前端列表、详情、编辑弹窗、商品属性选择器或门店界面展示，不增加只读输入框；属性/规格/小料类型均适用。隐藏展示不影响后台生成、保存、稳定性及按ID更新。\n\n#### 新增、编辑与选择数量\n\n- 选择类型为必选/可选互斥单选，新建默认必选；下面仅显示“每次必选/每次可选 [数量] 个属性值”，默认1。切换保留数量和草稿；规则保持跟现有一样\n- 新增/编辑弹窗显示当前分类和只读组公共ID，维护属性类型、名称、选择类型及数量、排序、值列表。属性/规格在弹窗内添加值，小料使用小料库选择器。\n\n#### 公共小料选择\n\n- 【添加小料】打开名称/公共ID/价格选择弹窗，支持搜索、勾选、取消/确认；只显示本功能的“公共小料引用与去重”后的小料库数据，无可选项时提示先创建含公共ID小料。\n- 确认将勾选小料加入值列表，取消不改原草稿；重复选择不重复追加已有项。\n\n#### 属性值名称与删除受限反馈\n\n- 编辑属性时，被未删除商品使用的已有属性值名称只读，移除操作禁用；未被使用的值保留原编辑和移除方式，不限制新增属性值。小料值仍从小料库选择，重新选择不得移除被使用的已有值。\n- 因引用保护阻断改名时提示“属性值正在被未删除商品使用，不可修改名称”；阻断删除时提示“属性值正在被未删除商品使用，不可删除”。保存时重新发现引用冲突，保留表单和草稿供调整，原数据不变。\n\n#### 验证场景：必选/可选及公共小料\n\n**前置条件**：进入公共属性新增弹窗。\n\n**操作步骤**\n\n- 检查默认必选和数量1，切换可选后返回必选。\n- 打开添加小料，取消后再确认选择并保存。\n\n**预期结果**：切换保留数量/草稿；取消不变，有效小料不重复添加；属性值公共ID不在前端展示。\n\n\n### 公共小料按ID同步\n\n所属端：连锁店总部；页面：公共小料库\n\n公共小料身份与商品的小料属性关联分开；连锁店总部小料库管理仅查询和显示含公共ID的数据。\n\n#### 列表和页面入口\n\n- **小料库沿用现有样式**：保留顶部小料说明、小料名称搜索、重置/查询、新增小料；\n- 表格增加【公共ID】，其余保留小料名称、价格（元）、关联商品数量、操作（编辑、删除、查看关联商品）。\n- 初始化统一从商品模板管理进入，不在小料页展示入口。\n- 按总部含公共ID的数据范围过滤后无记录时，沿用当前页面既有空状态；搜索、重置及再次进入均不显示无公共ID记录。\n\n#### 新增和编辑弹窗\n\n- 新增/编辑弹窗首字段只读公共ID，新建显示“保存后自动生成”；其后名称、价格及取消/确定，取消不保存。\n- 关联属性值被未删除商品使用时，小料名称只读；提交改名重新校验，受限时提示“属性值正在被未删除商品使用，不可修改名称”，保留原名称及当前表单。\n\n\n### 公共推荐标签与推荐状态\n\n所属端：连锁店总部；页面：公共推荐标签\n\n推荐标签沿用现有列表及新增、关联商品、删除样式，增加公共ID；连锁店总部推荐标签管理仅查询和显示含公共ID的数据。\n\n#### 列表与初始化入口\n\n- 推荐标签页不展示门店初始化入口；从商品模板的【门店商品初始化】选择门店后，与商品信息、分类、属性及小料一起处理无公共ID的旧标签，不再单独选择推荐标签类型。\n- 列表沿用现有推荐标签样式，顶部保留【＋新增】，增加【公共ID】列；其后为推荐标签名称、关联商品数、创建时间、操作。操作保留【关联商品】【编辑】【删除】，不增加内容区重复标题。\n- 按总部含公共ID的数据范围过滤后无记录时，沿用当前页面既有空状态；搜索、重置及再次进入均不显示无公共ID记录。\n\n#### 新增和编辑弹窗\n\n- 新增/编辑弹窗首项只读公共ID，显示名称字数及“最多3个字”，底部取消/确定；取消不写入。\n\n#### 关联商品选择\n\n- “关联商品 - {标签名}”弹窗沿用左分类、中商品、右已选三栏，展示图片/名称/价格；支持模糊搜索、本组全选、勾选、移除，打开回显当前关联，切分类/搜索保留勾选。\n\n#### 删除确认\n\n- 删除前提示“删除【{标签名}】后，已关联的{N}个商品的推荐标签将被清空，是否确认删除？”；N取总部当前关联数，底部取消/删除，取消不变。\n\n\n### 模板管理与公共商品引用\n\n所属端：连锁店总部；页面：商品模板管理 · 模板列表\n\n模板管理保留现有空态、新增模板及模板列表，点击管理商品进入模板商品管理；模板商品统一引用公共商品库，模板变化需手动同步至门店。\n\n#### 模板空态、列表与进入管理\n\n- 无模板时展示原参考图两步介绍及【＋ 新建商品模板】，点击出现名称（必填）/描述及取消/确认弹窗，保存后显示列表。新增模板其余沿用现有逻辑。\n- 模板列表沿用参考图样式，顶部保留【＋ 新建模板】及原有剩余可创建数量提示；\n- 列为模板ID、模板名称、描述、操作，操作保留【管理商品】【编辑】【复制】【删除】。\n- 点击【管理商品】进入当前模板的商品管理界面；不在本需求中展开新增模板规则。\n- **进入【管理商品】后，顶部标题区仅显示“当前模板**：{模板名称}”，可返回模板列表；\n- 移除内容区路径、重复的商品模板管理标题及示例角标。\n- 常驻说明告知“商品模板管理已改版，更新前的模板数据不再展示。请先在公共商品库创建公共商品，再创建模板并添加公共商品，最后同步至门店。”，不再要求先移除旧模板商品，不显示表格下载/导入说明；\n- 列表底部不展示旧模板商品示例及移除入口。\n\n#### 添加商品：搜索、布局与候选范围\n\n- ①标题为“添加商品”，顶部保留商品名称筛选框，占位“请输入商品名称/公共ID”；按商品名称模糊查询、商品公共ID精准查询。\n- ②选择区左侧为公共商品分类，右侧为所选分类的商品列表，旁边展示本次已选商品；\n- 选择器不展示本功能的“添加范围、当前模板去重与提交”排除的分类和商品；原型保留正常折扣/第二份促销候选以区分两类条件。\n- 当前模板已有项优先展示、降透明度、标“已添加”并禁选，分类全选跳过；其他模板已添加而当前未添加的仍可选。\n- **⑤商品行展示**：左侧为复选框，其右为商品图片，图片右侧展示商品名称和下方商品公共ID；弹窗中的商品名称必须完整显示，超出可换行，不以列表的两行省略规则截断。\n\n#### 添加商品：分类联选与选择保留\n\n- 保留一级/二级层级，二级紧随对应一级展示；点击分类名称只切换展示，不改变勾选。\n- 一级包含自身及全部下属二级的符合条件商品，二级仅本类，全部商品包含全部符合范围项。\n- 分类结果一次展示、区域滚动、不分页。勾选一级时切到该类，并联选其自身及全部下属二级的可选商品，下属可选二级联动选中；\n- 取消一级时清空同范围选择。二级操作只作用本类并切换展示，父级联动全选/半选/未选。\n- 搜索生效时只处理匹配项；空类或仅已添加项的复选框禁用，当前模板已有商品不计入本次新选数量。\n- 切分类或搜索保留选择，右侧逐项移除/全部清空；取消不添加。\n\n#### 模板商品的筛选与只读列表\n\n- 模板商品管理采用与公共库一致的左侧分类、右侧商品布局。\n- 分类树及排序输入遵循《商品列表与行内编辑》的分类规则；\n- 模板右侧仅展示当前模板引用的未删除公共商品，不扩大为该分类的全部公共库商品，禁用/下架但未删除的引用仍可查看。\n-  有二级分类的一级分类可独立展开/收起，首次进入默认折叠；\n- 展开/收起及选择保留沿用公共库列表规则，模板与公共库分别维护本次页面展开状态。\n- 模板商品管理先通过“添加商品”建立引用，再根据当前模板全部未删除商品所属分类生成左侧分类栏；\n- 空模板不展示整个分类栏（包括全部商品、分类及排序），右侧保留商品空列表与添加入口。\n- 有商品时只展示有当前模板商品的分类，二级所属一级一并保留，不展示其他公共库空分类；\n- 全部商品及分类数量仅统计当前模板未删除引用。分类依据模板商品集合计算，不随名称/公共ID或促销查询结果临时隐藏；\n- 禁用/下架但未删除的引用仍计入。添加后即时出现对应分类，移除最后一件该类商品或商品改分类后即时重算；\n- 当前所选分类消失时回到全部商品，不改变其他筛选和已选商品；\n- 模板清空后恢复无分类栏。此规则仅适用于模板商品管理列表，公共库列表及添加商品弹窗候选范围沿用原规则。\n- 名称/公共ID、促销筛选和分类范围与公共库一致；分类位于左侧，不再重复顶部分类下拉。一级显示本级及下属二级引用，二级仅本类，全部商品为当前模板全部未删除引用。\n- 列表字段沿用公共库，商品名含图片且最多两行，下方不重复公共ID；\n- 排序、价格、打包费、商品状态只读，不提供名称旁编辑、复制或新建商品。\n- 左侧分类排序为公共分类维护入口，商品只读不限制该分类排序入口。\n-  状态列仅显示“启用”或“禁用”，不显示上架/下架状态或副标题。\n- 中间字段可左右滚动，查看/删除操作固定最右侧。表头全选仅处理当前分类筛选结果；跨分类或查询保留选择，持续显示已选和隐藏选择数量，可一键清空。\n- 模板商品管理不提供新建、导入或替换商品入口，添加商品统一从公共商品库选择。模板列表原有复制模板入口保留。\n\n#### 查看、删除与空态反馈\n\n- **查看**：操作列保留查看/删除。点击查看打开商品基本信息与商品属性只读弹窗，可切换两类信息查看，字段及选择控件置灰不可修改，不展示保存按钮；\n- 需要修改时前往公共商品库。查看取消/关闭不修改商品、模板或门店。\n-  模板商品查看表单同样不展示“是否上下架”字段。\n- 可删除时二次确认，取消不修改；同步锁阻断时提示“商品正在同步，暂无法删除”。\n- **空状态**：当前模板没有可展示商品且未筛选时显示“暂无数据”；任一筛选条件生效且无匹配结果时显示“暂无符合条件的商品”。 空模板不展示分类栏，仍可点击“添加商品”；添加弹窗保留可供选择的公共商品分类。\n\n#### 验证场景：跨分类选择及模板隔离\n\n**前置条件**：模板A已添加一件商品，模板B未添加。\n\n**操作步骤**\n\n- 在A的添加商品弹窗切换分类/搜索，操作一级/二级复选框。\n- 切换B查看同一商品。\n\n**预期结果**：A中已添加项禁选，B中仍可选；分类结果无分页，父子联选/半选、搜索保留选择正确；独立促销标记资格按本功能的“添加范围、当前模板去重与提交”提交复核。\n\n\n### 五种商品同步\n\n所属端：连锁店总部；页面：商品模板与五种同步\n\n新增、删除、下架、上架、更新都按公共ID匹配。\n\n#### 省市区门店树与已选区域\n\n- 连锁/品牌、同步商品/同步所有商品统一使用省→市→区→门店树，不按账号类型分两套UI。\n- **选店弹窗按参考图左右布局**：左侧“全部门店”及省、市、区、门店多级可勾选树，逐级展开/收起；\n- 可在区下精确勾选单门店。勾选全部或省、市、区联选其范围内全部可选门店，取消同步取消该范围；\n- 部分门店已选时父级显示半选。\n- 右侧显示“已选择N个门店”和已选省→市→区→门店层级，N按实际门店去重计数；\n- 可移除单门店或整级区域，支持“全部删除”，左右勾选与数量同步更新。\n- 展开/收起不改变勾选，二次确认取消后保留选择；无符合条件门店时显示空态。\n\n#### 设置确认与空选提示\n\n- 设置弹窗底部取消/确定，不提供下一步；确定后按操作类型显示精确二次提示，二次取消返回并保留商品、门店及勾选项。\n- **未选商品**：请选择需要同步的商品。\n- **未选门店**：请选择需要同步的门店\n- 操作类型区域增加加粗标题“操作类型”，与“选择门店”均显示必选标记。\n- 按顺序显示新增门店商品、删除门店商品、下架门店商品、上架门店商品、更新商品信息；\n- 首次打开同步商品/同步所有商品弹窗不默认选中任何操作类型，须主动选择。\n- **未选操作类型**：请选择操作类型。两项均未选先提示门店；校验失败保留选择。二次确认取消返回设置时保留已选门店和操作类型；重新打开弹窗恢复未选状态。\n\n#### 五种同步的二次确认文案\n\n- **同步新增二次确认**：将按商品公共 ID 向 {门店数} 家门店新增 {商品数} 件商品，已存在相同公共 ID 的商品将跳过，不会重复新增。\n- **同步删除二次确认**：将删除 {门店数} 家门店中公共 ID 属于本次所选范围的商品。不会按名称删除，也不会删除其他商品。请确认。\n- **同步下架二次确认**：将下架 {门店数} 家门店中公共 ID 属于本次所选范围的商品，其他商品保持不变。\n- **同步上架二次确认**：将上架 {门店数} 家门店中公共 ID 属于本次所选范围的商品，其他商品保持不变。\n- **同步更新二次确认**：将按商品公共 ID 更新 {门店数} 家门店中的 {商品数} 件已有商品；\n- **可选同步**：{本次实际勾选字段组合或未选择}。上下架和商品排序按总部更新；\n- 未勾选的价格/售卖时间保留门店值，库存及销售数据保留。\n\n#### 提交结果与范围文案\n\n- **提交成功**：商品同步任务已提交，请在商品任务记录查看处理结果。任务编号：{编号}。\n- 提示中的门店数、商品数使用当前确认范围；可选同步未勾选时显示“未选择”，勾选一项显示该项，勾选多项按“促销信息/售卖时间”的固定顺序显示实际勾选组合。\n- 二次提示为文案确认，不另设范围/依赖预览步骤或列表。\n\n#### 验证场景：五种操作及统一选店\n\n**前置条件**：分别使用品牌/连锁的同步商品及同步所有商品入口。\n\n**操作步骤**\n\n- 勾选省市区或单门店，检查右侧去重数量并移除。\n- 对五类操作分别确认、取消二次提示、再次确认提交。\n\n**预期结果**：五组合使用同一门店树；首次确定不提交，二次取消保留设置；最终仅提交一项任务，文案取当前范围及编号。\n\n\n### 更新字段分组与库存保护\n\n所属端：连锁店总部；页面：商品模板与五种同步\n\n上下架和商品排序默认按总部同步；库存等经营字段保留，价格与售卖时间可选覆盖。\n\n#### 默认字段分组\n\n- **更新商品信息字段卡片按参考图展示三个分组标题**：“默认同步更新的数据”“默认不同步更新的数据”“可选择更新的数据（若需同步，请点击选中；若不需要，则不选中；）”。\n- 默认同步项以✓逐项展示商品名称、商品图片、打包费、商品信息、商品描述、推荐标签、商品一级二级分类、商品属性分类、商品属性组和属性值；\n- 默认不同步以Ⅹ逐项展示总库存、每日库存、是否推荐、起购数量；\n- 是否上下架、排序移入默认同步更新分组并以✓展示。\n\n#### 可选字段与覆盖说明\n\n- 可选字段第一项界面文案为“价格信息（商品价格、是否促销、折扣、折扣后价格、限购数量、第二份价格）”，对应任务里的促销信息整组；\n- 第二项为“售卖时间”。价格信息、售卖时间两个复选框默认均不选，各项下方蓝色说明分别为“将覆盖所选门店对应商品的价格配置信息”“将覆盖所选门店对应商品的完整售卖时间配置”。\n- 未勾选/整组覆盖及销售历史保留等既有规则不变。同步设置页不额外增加小料价格勾选项，小料按公共ID统一采用总部价格。\n\n#### 上下架和商品排序默认展示\n\n- 默认同步分组在既有字段中增加“是否上下架”“排序”，两项不展示复选框；默认不同步分组移除这两项，只保留总库存、每日库存、是否推荐、起购数量。可选择更新仍只有价格信息和售卖时间。\n- 二次确认说明“上下架和商品排序按总部更新；未勾选的价格/售卖时间保留门店值，库存及销售数据保留”。任务详情默认同步快照展示上下架、排序，可选勾选信息仍只展示价格和售卖时间。\n\n\n### 任务三级结果与字段快照\n\n所属端：连锁店总部；页面：任务记录与失败重试\n\n更新前的旧任务不再展示；更新后初始为空，仅展示更新后新创建的任务，支持任务→全部目标门店→失败商品。\n\n#### 任务列表与状态操作\n\n- 任务列ID、类型、门店数、提交时间、待处理/处理中/已成功/部分完成/失败、详情及重试。\n- 任务记录标题区仅展示标题“商品任务记录”和副标题“任务 → 目标门店 → 失败商品，保留执行范围与字段快照”；去掉该标题区上方“连锁总部 · 商品管理”导航说明及示例数据角标。\n- **状态仅标签**：已成功绿、部分完成橙、待处理灰、失败红、处理中蓝。已成功/待处理/处理中仅详情；部分完成/失败增加重新执行；未结束即使已有失败也不显示重试。\n- 任务列表的状态单元格仅展示状态标签（已成功、部分完成、待处理、失败、处理中），不在标签下展示“处理完成”“存在失败项”“等待处理”“全部项失败”“正在处理”等副标题；状态颜色和对应操作不变。\n- 新增“上架门店商品”任务类型，任务列表及详情按提交快照展示此类型；同步上架详情展示对应上架操作，不展示更新商品信息字段卡。\n\n#### 目标门店详情与同步快照\n\n- 【详情】打开“目标门店”，顶部操作类型与同步快照。\n- 状态选项全部/待处理/处理中/成功/失败，默认全部，查询回第一页。\n- 列为门店ID、名称、所属小镇（ID＋名称）、同步时间（秒）、处理状态、失败原因、操作。\n- 失败门店提供重新执行/失败列表，成功/处理中无该入口。\n- 支持上/下页、跳页、总数及暂无数据。\n- 顶部信息区沿参考图展示三个紧凑分组。更新商品信息任务的“本次同步信息”显示：商品名称、商品图片、商品打包费、商品信息、商品描述、推荐标签、商品一级、二级分类、商品属性分类、属性组及属性值、是否上下架、商品排序；\n- “本次勾选的同步信息”根据任务提交快照显示促销信息、售卖时间的实际勾选组合，均未勾选时显示“未选择，价格、促销及售卖时间保留门店值”；\n- **“不同步信息”固定显示**：总库存、每日库存、是否推荐、起购数量；\n- 上下架及商品排序已归入默认同步，按总部数据更新。参考图中的红色说明仅用于解释未勾选文案，不作为页面文案。\n- 其他同步类型展示对应操作；门店初始化任务展示商品信息、分类、属性、小料及推荐标签的完整处理范围，不冒用更新字段说明。\n\n#### 失败列表、返回与展示范围\n\n- 失败列表显示商品图片/名称/公共ID、失败时间、原因、重试；任务/门店/商品三个入口仅处理其范围仍失败项。\n- 初始化无公共ID失败项显示门店本地ID，统一初始化任务中的商品及基础资料失败项均显示实际资料类型和门店本地ID。\n- 失败列表底部增加【返回目标门店】，与【全部重新执行】【关闭】并列；\n- 无失败项时仍可返回。点击返回打开同一任务的目标门店弹窗，保留进入前的状态查询条件和页码；\n- 不关闭到任务列表、不创建或重试任务。关闭按钮继续退出详情。\n- 失败列表的首列表头统一为“商品信息”，不再使用“资料信息”；\n- 原商品名称/公共ID、失败时间、原因、历史尝试和重新执行操作保留。\n- 目标门店/失败列表弹窗移除顶部新增的状态标签、状态样式演示和DEMO编号整行，直接从本次同步信息区开始展示。\n\n#### 验证场景：新任务范围、详情返回与五状态\n\n**前置条件**：新任务列表初始为空，可通过原型专用入口查看独立状态样例。\n\n**操作步骤**\n\n- 创建新任务后切页返回。\n- 打开目标门店查询/分页，进入失败列表再返回。\n- 查看五状态样例及对应操作。\n\n**预期结果**：新任务保留且不混入旧任务/样例；返回保留查询页码；每页20条，状态无副标题，首列商品信息；未结束项无重试入口。\n\n\n### 选择门店后统一初始化商品资料\n\n所属端：连锁店总部；页面：门店初始化\n\n直接选择门店并确认，一次初始化所选门店无公共ID的商品信息、商品分类、商品属性、商品小料及推荐标签；不再选择资料类型或要求分次执行。\n\n#### 统一入口与处理范围\n\n- 仅在商品模板管理保留【门店商品初始化】入口，点击直接选择门店，不再显示初始化类型下拉或商品、分类、属性、小料、推荐标签的类型选择。\n- **初始化弹窗说明**：统一清理所选门店无公共ID的商品信息、商品分类、商品属性（含属性分类、属性组及属性值）、商品小料和推荐标签；有公共ID的记录保留。请先同步公共资料并确认门店可正常经营。\n\n#### 门店树与选择保留\n\n- 品牌与普通连锁均使用与同步商品一致的省→市→区→门店树，不显示账号类型下拉或另一套选店UI。\n- 左侧逐级展开/收起并勾选门店，支持区域联选、取消和父级半选；右侧按区域展示已选门店、去重计数，支持逐级移除及全部删除。二次确认取消返回后保留门店选择，关闭后重新打开按原规则重置。\n\n#### 统一确认文案与未选门店反馈\n\n- 底部取消/确认。未选择门店点击【确认】时提示“请选择初始化门店。”，不打开二次提示、不提交任务。\n- **二次确认文案**：“确定初始化这 N 家门店中所有无公共ID的商品信息、商品分类、商品属性、商品小料和推荐标签？无公共ID的记录将被删除，有公共ID的记录保留。请确认所选门店已同步公共资料，并可正常经营。”N为当前门店数。\n- 二次确认提供取消/确定；取消返回选店并保留选择，确定才提交一个门店初始化任务，不展示资料类型或预检候选列表。\n\n#### 验证场景：选店后统一初始化及取消保留\n\n**前置条件**：所选门店有无公共ID商品和不同类型基础资料，可从未执行初始化的门店直接发起。\n\n**操作步骤**\n\n- 打开门店商品初始化，使用省市区门店树选择门店。\n- 首次确认后取消，检查门店选择仍保留；再次确认并确定提交。\n- 查看任务及失败列表。\n\n**预期结果**：无类型选择或分类型前置阻断；首次确认/取消不清理，确定提交同一个统一任务；详情列出完整范围，失败项显示实际资料类型和本地ID。\n\n\n### 门店公共ID映射与保存规则\n\n所属端：商家APP；页面：旧版商家APP兼容\n\n门店沿用现有业务UI和原商品表，数据通过公共ID匹配处理；本条仅规定数据及保存规则，不新增核对页面。\n\n#### 无公共ID直接保存与成功反馈\n\n- 商家APP（新旧版本）、总后台和运营商PC保存无公共ID的商品、属性、小料、推荐标签及既有范围内的分类资料时，不再弹出无公共ID二次确认；通过权限及原业务校验后直接提交，保存成功仅提示“保存成功”。\n- 保存未成功时沿用原失败或权限提示，不提前显示成功；不增加无ID风险确认、取消或确认继续保存步骤。\n\n#### 各端页面沿用范围\n\n- 商家端、总后台、运营商PC沿用现有业务页面、布局和操作表单，不因公共ID数据处理新增界面字段或页面；\n- 无公共ID按原流程直接保存，保存成功提示“保存成功”。\n- 关联品牌类型连锁店的门店，商家APP推荐标签仅可查看，由总部维护。\n- 评审权限及兼容结果不是正式UI改版要求。\n\n#### 沿用复制入口与保存反馈\n\n- 总后台门店复制菜品、单独复制及运营商PC复制商品沿用原有业务入口，不新增公共ID输入或展示字段；\n- 复制成功后目标商品不携带源公共ID，源商品保持不变。\n- 不因目标商品无公共ID额外增加二次确认，成功后沿用原成功反馈。\n- 评审原型仅以规则说明呈现，真实复制接口与数据库结果需独立联调。\n\n#### 异常与边界\n\n- 门店主体沿用现有页面，公共ID只在数据库及数据处理层新增，不在业务界面展示；不因缺少公共ID增加二次确认或核对页面。\n\n#### 验证场景：各端无ID直接保存及权限限制\n\n**前置条件**：分别使用新旧商家APP、总后台和运营商PC，准备有权保存的无公共ID资料及受限账号。\n\n**操作步骤**\n\n- 保存允许编辑的无公共ID商品及基础资料，观察提交与成功反馈。\n- 使用受限账号保存，并复核原业务校验失败的情况。\n\n**预期结果**：有权限且原校验通过时直接保存，不弹出无公共ID确认；实际成功后提示“保存成功”，公共ID仍为空。无权限或原校验失败仍按原规则阻断，不写入且不提示成功。\n\n\n### 旧版商家APP读写保护\n\n所属端：商家APP；页面：旧版商家APP兼容\n\n先按现有权限和校验判断；有权限时，旧版APP保存商品、属性、小料及推荐标签不因公共ID有无而阻断。无ID仍为空，已有ID由后端保留并正常入库；不新增UI交互。\n\n#### 沿用现有界面\n\n- 本次兼容仅由后端处理，商家APP沿用现有UI、编辑和保存交互，不新增公共ID字段、无ID确认、强制升级提示或兼容核对页面；现有权限提示及原业务反馈继续沿用。\n\n\n### 旧显示结构与库存订单兼容\n\n所属端：商家APP；页面：旧版商家APP兼容\n\n兼容展示不能改变实体身份和计价语义。\n\n#### 沿用现有读取与保存交互\n\n- 本次不新增UI交互或升级提示，旧版按现有页面操作；权限与原有业务错误仍使用现有反馈，不因公共ID新增编辑阻断。\n\n\n### 商家APP门店操作权限\n\n所属端：商家APP；页面：商家APP操作限制\n\n按连锁店类型、门店创建来源及操作端执行对应限制。\n\n#### 受限提示与现有界面\n\n- 受限保存提示“该门店由服务商统一管理，若需修改请联系服务商！”。本条不新增业务界面。\n- 本条规定数据及操作权限处理，不要求调整现有UI；评审辅助权限表不作为新增业务界面。\n\n\n### 总后台品牌门店操作权限\n\n所属端：总后台；页面：总后台操作限制\n\n按连锁店类型、门店创建来源及操作端执行对应限制。\n\n#### 受限提示与现有界面\n\n- 受限保存提示“该门店由服务商统一管理，若需修改请联系服务商！”，现有页面布局不变。\n- 本条规定数据及操作权限处理，不要求调整现有UI；评审辅助权限表不作为新增业务界面。\n- 评审辅助权限表将“批量操作”行改为“批量上下架”；\n- 在品牌类型且非开放平台创建的门店场景中，“批量上下架”和“商品上架 / 下架”两行的当前权限均显示“沿用当前权限，可操作”，尝试操作反馈采用同一口径。\n\n\n### 运营商PC品牌门店操作权限\n\n所属端：运营商PC后台；页面：运营商PC操作限制\n\n按连锁店类型、门店创建来源及操作端执行对应限制。\n\n#### 受限提示与现有界面\n\n- 受限保存提示“该门店由服务商统一管理，若需修改请联系服务商！”，现有页面布局不变。\n- 本条规定数据及操作权限处理，不要求调整现有UI；评审辅助权限表不作为新增业务界面。\n- 评审辅助权限表将“批量操作”行改为“批量上下架”；\n- 在品牌类型且非开放平台创建的门店场景中，“批量上下架”和“商品上架 / 下架”两行的当前权限均显示“沿用当前权限，可操作”，尝试操作反馈采用同一口径。\n\n\n### 开放平台绑定连锁品牌后的商品管理处理\n\n所属端：连锁店总部；页面：开放平台处理\n\n连锁总部关联开放平台时只隐藏商品管理及其子菜单，保留其余五项菜单；单门店及未关联的总部保留商品管理。\n\n#### 商品菜单显隐与顺序\n\n- 满足本功能的“绑定总部的操作校验”时隐藏商品管理；单门店或未绑定总部保留菜单，具体操作仍受原权限。\n- **左侧菜单按参考图从上到下依次为**：首页、商品管理、营销管理、订单管理、门店管理、权限管理。\n- 关联开放平台的连锁总部仅隐藏一级【商品管理】及其全部二级菜单，包括公共商品库、商品模板管理、商品任务记录等商品管理入口；\n- 首页、营销管理、订单管理、门店管理、权限管理的名称、顺序及原有入口均保留。\n- 未关联开放平台的连锁总部显示参考图全部六项一级菜单，商品管理位于首页下方、营销管理上方；\n- 单门店同样保留商品管理菜单，不因所属连锁已关联开放平台而隐藏该菜单。\n- 商品管理之外的菜单不受本条关联规则影响，仍沿用原权限。\n\n#### 本次UI改动与演示边界\n\n- 本次补充为开放平台绑定场景的总部商品菜单显隐和操作限制；其他商家端、总后台、运营商PC业务UI沿用此前确定范围。评审中的绑定/身份选择与权限核对只是场景演示，不新增业务配置入口。\n\n#### 验证场景：应用绑定与总部/单店切换\n\n**前置条件**：当前品牌绑定开放平台。\n\n**操作步骤**\n\n- 在总部与单门店身份之间切换，再模拟未绑定总部。\n\n**预期结果**：仅绑定总部隐藏商品管理整组；其他菜单顺序不变。单店沿用原权限，直接访问/提交仍由后端拦截。\n\n\n### 首页三步菜单改版引导\n\n所属端：连锁店总部；页面：首页 · 商品管理改版引导\n\n新增功能及改版说明仍在总部首页弹窗中展示；仅有商品管理菜单权限时首次自动弹出三步引导，跳过或我知道了后不再自动显示。\n\n#### 首页触发与三步说明\n\n- 引导在总部首页触发，展示资格依本功能的“展示资格与权限优先”，不能借引导打开无权限菜单。\n- **分步引导**：遮罩直接覆盖现有连锁店总部首页，默认展开左侧【商品管理】菜单，第1步虚线标出【公共商品库】，说明新增内容及通过【新建商品】或【导入商品】创建公共商品；\n- 【下一步】到第2步，将虚线移至【商品模板管理】，说明旧模板已清空、不再展示，重新创建模板并从公共商品库选择商品，最后同步门店；\n- 再次【下一步】到第3步，虚线移至【商品任务记录】，说明旧记录不再展示、仅可查看更新后新记录，无新任务时列表为空。\n- 每次只突出当前菜单，支持【上一步】，底层始终为同一首页。\n- 首页侧栏与公共商品库统一白底；首页、商品管理同为一级菜单，左侧起点和一级样式对齐，公共商品库、商品模板管理、商品任务记录在商品管理下缩进。遮罩保留首页数据概览及订单统计，不随引导切换底图。\n\n#### 跳过、完成与关闭\n\n- 每步均有跳过说明，第3步为我知道了，点击立即关闭并提交已读；前后步只切高亮/文案，不提供业务手动查看或重看入口。\n- 窄屏下引导说明完整可读，上一步、下一步、跳过说明及我知道了按钮可达。\n\n#### 验证场景：首页引导已读与权限\n\n**前置条件**：当前用户/连锁本次改版未读。\n\n**操作步骤**\n\n- 有权限时前后切换三步，分别检查跳过与完成。\n- 模拟应用绑定或无菜单权限。\n\n**预期结果**：底图始终首页，前后步不记已读，跳过/完成记已读且不重弹；无权限不展示、不写已读；无手动查看入口。\n"
  }
}</script>

function permissionDecision(surface,key,scope=B.permissionScope){
 if(surface==='app'&&key==='tag'&&['brand','brandOpen'].includes(scope))return {state:'deny',text:'总部维护，商家不可新增 / 编辑 / 删除'};
 if(surface==='app'&&key==='viewTagProducts'&&['brand','brandOpen'].includes(scope))return {state:'allow',text:'仅查看，不可变更关联'};
 if(scope!=='brand')return {state:'inherit',text:['open','brandOpen'].includes(scope)?'沿用现有开放平台规则':'沿用普通门店现有权限'};
 if(['admin','operator'].includes(surface)&&['batch','onoff'].includes(key))return {state:'inherit',text:'沿用当前权限，可操作'};
 const deny=['product','category','attribute'];
 let allow=['viewActivity'];
 if(surface==='app'){deny.push('batch','hqActivity');allow.push('onoff','addonStock','newActivity','ownActivity');}
 else{deny.push('addonStock','addon','tag','hqActivity');if(surface==='operator')allow.push('newActivity');else deny.push('newActivity','ownActivity');}
 const state=deny.includes(key)?'deny':allow.includes(key)?'allow':'inherit';
 return {state,text:state==='deny'?'不可操作':state==='allow'?'允许':'沿用现有权限'};
}

function candidates(s){
 const rows=[];
 const add=(entity,item,extra={})=>{if(!hasPublicIdentity(item))rows.push({key:item.local,name:item.name,entity,...extra});};
 for(const p of s.products)add('商品',p);
 for(const group of s.defs['属性']||[]){
  for(const value of group.values||[])add('属性值',value,{name:group.name+' / '+value.name,group:group.local});
  add('属性',group);
 }
 for(const type of ['属性分类','分类','小料','推荐标签']){
  const rowsForType=[...(s.defs[type]||[])];
  // 子分类先于父分类处理，保留仍有引用的上级。
  if(type==='分类')rowsForType.sort((a,b)=>Number(!!b.parent)-Number(!!a.parent));
  for(const item of rowsForType)add(type,item);
 }
 return rows;
}

function initReferenced(s,entity,obj,group){
 const matches=key=>key!==null&&key!==undefined&&String(key).trim()!==''&&(key===obj.local||(hasPublicIdentity(obj)&&key===obj.id));
 if(obj.refs)return true;
 if(entity==='分类')return s.products.some(p=>matches(p.category))||(s.defs['分类']||[]).some(c=>c!==obj&&matches(c.parent));
 if(entity==='属性分类')return (s.defs['属性']||[]).some(g=>matches(g.classId));
 if(entity==='属性')return s.products.some(p=>(p.groups||[]).some(matches))||(obj.values||[]).some(v=>hasPublicIdentity(v)||v.refs);
 if(entity==='属性值')return s.products.some(p=>(p.attributeValues||p.valueIds||[]).some(matches)||(p.groups||[]).some(id=>id===group.local||(hasPublicIdentity(group)&&id===group.id)));
 if(entity==='小料')return s.products.some(p=>(p.addons||[]).some(matches))||(s.defs['属性']||[]).some(g=>(g.values||[]).some(v=>matches(v.addonId)));
 if(entity==='推荐标签')return s.products.some(p=>(p.tags||[]).some(matches));
 return false;
}
function executeInitialization(s,i){
 let container,group;
 if(i.entity==='商品')container=s.products;
 else if(i.entity==='属性值'){
  group=(s.defs['属性']||[]).find(g=>g.local===i.group);
  container=group?.values||[];
 }else container=s.defs[i.entity]||[];
 const obj=container.find(x=>x.local===i.key);
 if(!obj)return {state:'成功',reason:'已删除，无变化'};

 if(!syncTypes.includes(t.type))throw Error('请选择操作类型');if(!source||source.deleted)throw Error('公共商品已失效');if((s.last[i.publicId]||0)>t.seq)throw Error('较新任务已处理，请重新发起同步');let matches=s.products.filter(p=>p.id===i.publicId);if(matches.length>1)throw Error('门店存在重复商品公共ID');let target=matches[0];if(t.type==='新增门店商品'&&target)return {state:'跳过',reason:'相同公共ID已存在'};if(t.type!=='新增门店商品'&&!target)return {state:'跳过',reason:'未找到相同公共ID，不按名称匹配'};if(target?.activity)throw Error('商品参与门店活动，不可操作');if(['新增门店商品','更新商品信息'].includes(t.type)&&source.status!=='启用')throw Error('公共商品未启用');if(t.type==='删除门店商品')s.products.splice(s.products.indexOf(target),1);else if(t.type==='下架门店商品')target.on=false;else if(t.type==='上架门店商品')target.on=true;else{syncDependency(s,'分类',source.category);for(const id of source.groups)syncDependency(s,'属性',id);for(const id of source.tags)syncDependency(s,'推荐标签',id);if(!target){target={...clone(source),local:newID('LP'),stock:-1,daily:-1,sales:0,virtualSales:0,on:source.on!==false,recommend:false};s.products.push(target);}else{for(const k of ['name','image','pack','info','desc','category','groups','tags'])target[k]=clone(source[k]);if(t.price){target.price=source.price;target.promo=source.promo;if(source.promo==='折扣')for(const k of ['discount','promoPrice','limit'])target[k]=source[k];if(source.promo==='第二份促销')target.secondPrice=source.secondPrice;}if(t.sale)for(const k of ['sale','weeks','times'])target[k]=clone(source[k]);target.on=source.on!==false;target.sort=source.sort;}}s.last[i.publicId]=t.seq;Object.assign(original,s);return {state:'成功',reason:''};}

function deletionPlan(ids,template=false,approved=null){
 return [...new Set(ids)].map(id=>{const p=product(id);let reason='';
  if(!p||p.deleted)reason='商品已删除或已失效';
  else if(template&&!B.templates.includes(id))reason='当前模板引用已移除';
  else if(!template&&publicProductStoreRefs(id).length)reason='运营中且未删除的关联门店仍存在同公共ID商品';
  else if(approved&&!approved.includes(id))reason='未列入本次可删除确认范围';
  return {id,name:p?.name||id,category:p?dname('分类',p.category):'—',reason};
 });
}

function confirmPublicProductDelete(m){

function attributeValueInUse(groupId,value){

nput type="checkbox" data-quick="${esc(p.local)}" ${B.quick.has(p.local)?'checked':''}><span>${esc(p.name)}</span></label>`).join('')||`<p class="biz-empty">${quickEligibleStore(s)?'暂无可导入菜品':'请选择符合条件的来源门店'}</p>`}</div><div class="biz-quick-chosen"><header><span>已选择<b>${chosen.length}</b>个商品</span>${btn('全部删除','quick-clear','','link danger')}</header>${chosen.map(p=>`<div class="biz-quick-chosen-row"><span>${esc(p.name)}</span>${btn('⊗','quick-remove',`data-local="${esc(p.local)}" aria-label="移除 ${esc(p.name)}"`,'link danger')}</div>`).join('')}</div></div></div>`:''}</div><div class="biz-modal-footer">${btn('取消','close-modal')}${btn('确认导入','confirm-quick','id="quick-confirm-import" '+(quickEligibleStore(s)?'':'disabled'),'primary')}</div></div>`;

const ReviewDocument=(()=>{
 const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function safeHref(href){
  if(!href||/[\u0000-\u001f\u007f\\]/.test(href)||/^(?:\/\/|\/)/.test(href))return false;
  if(/^[a-z][a-z0-9+.-]*:/i.test(href))return /^https?:\/\/[^\s]+$/i.test(href);
  return true;
 }
 function inline(text){
  const token=/\x60([^\x60]+)\x60|\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*/g;
  let out='',last=0;
  for(const m of text.matchAll(token)){
   out+=escape(text.slice(last,m.index));
   if(m[1]!==undefined)out+='<code>'+escape(m[1])+'</code>';
   else if(m[2]!==undefined){const href=m[3].trim();out+=safeHref(href)?'<a href="'+escape(href)+'"'+(/^https?:/i.test(href)?' target="_blank" rel="noopener"':'')+'>'+escape(m[2])+'</a>':escape(m[2]);}
   else out+='<strong>'+escape(m[4])+'</strong>';
   last=m.index+m[0].length;
  }
  return out+escape(text.slice(last));
 }
 function slug(text){return text.toLowerCase().replace(/[\x60*_]/g,'').replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s+/g,'-');}
 function render(md){
  const lines=md.replace(/\r/g,'').split('\n'),seen=new Map();let out='',code=false,block=[],list='';
  const close=()=>{if(list){out+='</'+list+'>';list='';}};
  for(let i=0;i<lines.length;i++){
   const line=lines[i];if(line.startsWith('\x60\x60\x60')){close();if(code){out+='<pre><code>'+escape(block.join('\n'))+'</code></pre>';block=[];}code=!code;continue;}
   if(code){block.push(line);continue;}
   if(!line.trim()){close();continue;}
   if(/^\|/.test(line)&&/^\|\s*:?-+/.test(lines[i+1]||'')){
    close();const cells=t=>t.replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
    out+='<div class="md-table"><table><thead><tr>'+cells(line).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i++;
    while(/^\|/.test(lines[i+1]||'')){out+='<tr>'+cells(lines[++i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';}out+='</tbody></table></div>';continue;
   }
   const h=line.match(/^(#{1,6})\s+(.+)/);if(h){close();const base=slug(h[2]),n=seen.get(base)||0;seen.set(base,n+1);out+='<h'+h[1].length+' data-md-anchor="'+escape(base+(n?'-'+n:''))+'">'+inline(h[2])+'</h'+h[1].length+'>';continue;}
   const item=line.match(/^(?:([-*]) |(\d+)\. )(.+)/);
   if(item){const type=item[2]?'ol':'ul';if(list!==type){close();list=type;out+='<'+type+(item[2]?' start="'+Number(item[2])+'"':'')+'>';}out+='<li>'+inline(item[3])+'</li>';continue;}
   close();out+=(line.startsWith('> ')?'<blockquote>'+inline(line.slice(2))+'</blockquote>':'<p>'+inline(line)+'</p>');
  }
  close();if(code)out+='<pre><code>'+escape(block.join('\n'))+'</code></pre>';return out;
 }
 return {render};
})();

// Shared display formatting; business text stays intact.
function readableItems(values) {
 const expanded=(values||[]).flatMap(value=>/^公共ID：1、/.test(value)?value.slice('公共ID：'.length).split(/(?=[1-9]、)/).map(piece=>'公共ID：'+piece.replace(/^[1-9]、/,'')):[value]);
 return expanded.flatMap(value=>{
  if(value.length<100)return [value];
  const parts=[];let begin=0,quote='';
  for(let i=0;i<value.length;i++){
   const c=value[i];
   if(!quote&&(c==='“'||c==='「'))quote=c==='“'?'”':'」';
   else if(c===quote)quote='';
   if(!quote&&(c==='；'||c==='。')&&i-begin>=24){parts.push(value.slice(begin,i+1));begin=i+1;}
  }
  if(begin<value.length)parts.push(value.slice(begin));
  return parts.filter(Boolean);
 });
}
function emphasizeRule(text) {
 text=text.replace(/^顶部说明[1-4]：/,'说明文案：');
 const match=text.match(/^([^：:\n]{2,28})[：:]/);
 return match?'**'+match[1]+'**'+text.slice(match[1].length):text;
}

function renderRequirement(r, endName, pageName, audience='all', level=2) {
 const heading=(name,depth=0)=>'#'.repeat(Math.min(level+depth,4))+' '+name+'\n\n';
 const list=values=>readableItems(values).map(v=>'- '+emphasizeRule(v)).join('\n')+'\n';
 const legacy=r.legacyUnclassified??!(r.common||r.backend||r.frontend);
 let body='';
 const section=(name,part)=>{
  if(!part)return '';
  let out='';
  const groupTitle=title=>audience==='all'?'**'+title+'**\n\n':heading(title,1);
  if(part.ruleGroups?.length)out+=part.ruleGroups.map(group=>groupTitle(group.title)+list(group.items)+'\n').join('');
  else if(part.rules?.length)out+=list(part.rules)+'\n';
  for(const [key,label] of [['exceptions','异常与边界'],['acceptance','关键验证']])
   if(part[key]?.length)out+=groupTitle(label)+list(part[key])+'\n';
  return out?(audience==='all'?heading(name,1):'')+out:'';
 };
 if(r.rules?.length||r.exceptions?.length||r.acceptance?.length)body+=section(legacy?'旧格式未分类，需结合全文确认':'共用规则',r);
 body+=section('共用规则',r.common);
 for(const role of ['backend','frontend'])if(audience==='all'||audience===role)body+=section(role==='backend'?'后端功能规则':'前端 UI 与交互',r[role]);
 for(const c of r.cases||[])if(audience==='all'||!c.audience||c.audience==='all'||c.audience===audience)
  body+=heading('验证场景：'+c.name,1)+'**前置条件**：'+(c.precondition||'无额外条件')+'\n\n**操作步骤**\n\n'+list(c.steps)+'\n**预期结果**：'+c.expected+'\n\n';
 if(r.development?.length)body+=heading('共用研发说明',1)+list(r.development)+'\n';
 if(!body.trim())return '';
 return heading(r.title)+'所属端：'+endName(r.end)+'；页面：'+pageName(r.page)+'\n\n'+r.summary+'\n\n'+body;
}

function documentMarkdown(category=documentState.category){
 const group=documentGroups().find(g=>g.id===category);
 const shared=reviewData.shared.map(s=>'### '+s.title+'\n\n'+s.text+'\n').join('\n');
 const common=reviewData.requirements.map(r=>{
  const item={...r,backend:undefined,frontend:undefined,legacyUnclassified:r.legacyUnclassified??!(r.common||r.backend||r.frontend)};
  item.cases=(r.cases||[]).filter(c=>!c.audience||c.audience==='all');

 }).filter(Boolean).join('\n');
 const roleBody=role=>reviewData.requirements.map(r=>{
  const item={...r,common:undefined,rules:[],exceptions:[],acceptance:[],development:[]};
  item.cases=(r.cases||[]).filter(c=>c.audience===role);

 }).filter(Boolean).join('\n');
 const chapter=(title,body)=>body.trim()?'## '+title+'\n\n'+body+'\n':'';
 const publicBody=chapter('公共说明',shared+'\n'+common);
 const title='# '+reviewData.title+' PRD\n\n版本：'+reviewData.version+'\n\n';
 if(category==='all')return reviewData.documentMarkdown||title+publicBody+chapter('后端功能规则',roleBody('backend'))+chapter('前端 UI 与交互',roleBody('frontend'));

function refreshDocument(){
