function initialShot(){return {allowed:true,front:true,support:true,scene:'page',output:null,message:'点击「模拟系统截图」，体验附加信息与微信快捷分享。',card:false,wechat:false,friend:'',confirm:false,settings:false,wxInstalled:true,wxFailure:false,sequence:0,history:[],preview:false,lastCleanup:''};}
const shot=initialShot();
function settingMarkup(){return settingsReviewMarkup('order');}
function permissionMarkup(){return settingsReviewMarkup('permissions');}
function dialogMarkup(bottom=false){return `<section class="shot-dialog"><h3>${bottom?'订单操作':'提示'}</h3><p>${bottom?'联系商家　　联系顾客':'当前暂无新任务，请稍后查看'}</p><footer><span>${bottom?'取消':'我知道了'}</span></footer></section>`;}
function captureMarkup(){return interactiveCaptureMarkup();}
function dateLabel(date){const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}.${pad(date.getMonth()+1)}.${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;}
function generateShot(){
 shot.output=null;
 if(!shot.allowed)shot.message='系统未允许截图检测，本次未生成附加信息图片。';
 else if(!shot.front)shot.message='APP在后台，本次不检测、不生成图片。';
 else if(!shot.support)shot.message='当前系统或截图方式不在已验证范围，未模拟生成结果。';
 else if(shot.scene==='special')shot.message='特殊／系统弹窗的处理方式待确认，本演示不替业务决定回退结果。';
 else{shot.output={scene:shot.scene,time:dateLabel(new Date()),watermarked:false};shot.message='已模拟生成临时截图，尚未添加水印。';}
}
function resultMarkup(){return interactiveResultMarkup();}
const pageMarkup={settings:settingMarkup,permissions:permissionMarkup,capture:captureMarkup,result:resultMarkup};
function handleShotAction(action){handleShareAction(action);}


// 本文件与业务交互.js共用状态；原型与联动评审复用同一套手机操作。
let shareTimer=0;
function clearShareCard(){clearTimeout(shareTimer);shot.card=false;}
function discardTemporary(reason){clearShareCard();shot.output=null;shot.preview=false;shot.wechat=false;shot.confirm=false;shot.friend='';shot.lastCleanup=reason;if(reason)shot.message=reason;}
function showShareCard(){clearShareCard();shot.card=true;const sequence=shot.sequence;shareTimer=setTimeout(()=>{if(shot.card&&shot.sequence===sequence){discardTemporary('未点击分享，临时截图已删除。再次截图可重新分享。');renderCanvas();}},5000);}
function sceneTitle(scene){return {page:'新任务',subpage:'待取货',delivery:'待送货',completed:'已完成',dialog:'功能弹窗',bottom:'底部操作窗口',special:'特殊弹窗',settings:'设置页面'}[scene]||'新任务';}
function emptyArt(){return `<svg viewBox="0 0 180 160" aria-hidden="true"><circle cx="90" cy="80" r="70" fill="#fff"/><path d="M33 38L146 24M35 39l8 22m99-36l6 25" stroke="#aeb8c2" stroke-width="4" fill="none"/><g transform="rotate(-14 92 90)"><rect x="53" y="51" width="80" height="96" rx="8" fill="#d8e1e7"/><rect x="59" y="57" width="68" height="83" rx="5" fill="#fff"/><rect x="76" y="46" width="34" height="15" rx="3" fill="#aebbc5"/><path d="M72 78h41M72 93h34M72 108h41M72 123h28" stroke="#e4e9f0" stroke-width="5"/><path d="M85 93l20 20m0-20l-20 20" stroke="#ff8128" stroke-width="8"/></g><path d="M132 59l17-20 9 10-17 20-13 6z" fill="#9cabb9"/></svg>`;}
function appBodyMarkup(scene,freeze=false){return `<div class="rider-app"><header class="rider-top"><div class="rider-tools"><span class="static-round">♙</span><span class="static-round">▤</span><span class="rider-weather">14°C，晴天，西北风 2级</span><span class="rider-bot">◉</span></div><div class="rider-services"><span class="active">外卖</span><span>跑腿</span><span>万能帮</span></div><nav class="rider-tabs"><span class="active">新任务(0)</span><span>待取货(0)</span><span>待送货(0)</span><span>已完成(0)</span></nav></header><div class="rider-body"><div class="rider-empty">${emptyArt()}<p>暂时没有任务</p></div></div>${scene==='dialog'?'<div class="rider-mask"><div class="rider-dialog">'+popupMarkup(false,freeze)+'</div></div>':''}${scene==='bottom'?'<div class="rider-mask bottom"><div class="rider-bottom">'+popupMarkup(true,freeze)+'</div></div>':''}</div>`;}
function popupMarkup(bottom,freeze=false){return bottom?`<h3>联系</h3><p class="popup-note">请选择联系对象</p><div class="contact-options"><span>♧<b>联系商家</b></span><span>♙<b>联系顾客</b></span></div><button type="button" data-action="close-popup">取消</button>`:`<h3>温馨提示</h3><p>当前暂无新任务<br>请稍后查看</p><button type="button" data-action="close-popup">我知道了</button>`;}
function feedbackMarkup(o,hotspots=false){if(!o)return '';if(!o.watermarked)return `<div class="feedback-image raw-capture" inert><div class="feedback-content">${o.content}</div></div>`;return `<div class="feedback-image" inert><header class="feedback-head ${hotspots?'rv-hotspot':''}" ${hotspots?'data-req="SHOT-IMAGE"':''}><div><img src="${brandImage}" alt="小镇外卖"><b>小镇外卖骑士端</b></div><p>为了更快的解决问题，请使用此图反馈问题</p></header><div class="feedback-content">${o.content}</div><section class="feedback-fields ${hotspots?'rv-hotspot':''}" ${hotspots?'data-req="SHOT-IMAGE"':''}><div>骑手姓名：张三</div><div>骑手ID：82</div><div>骑手位置：34.724677,113.765393</div><div>当前时间：${esc(o.time)}</div><div>手机品牌：HONOR</div><div>手机型号：MEY-AN00</div><div>系统版本：Android 14</div><div>当前版本：10.0.0</div></section></div>`;}
function settingsRows(kind){
 const order=[['试听语音广播','▷'],['铃声播报次数','三次 ›'],['滑动接单设置','switch-on'],['导航设置（可设置外部地图）','高德地图 ›'],['是否开启来单调大音量','switch-on'],['开启通知（为了防止漏单，请不要关闭）','switch-off'],['悬浮窗设置（悬浮在桌面可拖动）','switch-off'],['开启通知使用权限','去设置 ›'],['后台自动启动','去设置 ›'],['省电模式','去设置 ›']];
 const permissions=[['允许小镇外卖访问定位权限','未开启始终允许 ›'],['允许小镇外卖获取电话状态或手机信息权限','去设置 ›'],['允许小镇外卖显示悬浮窗权限','去设置 ›'],['允许小镇外卖访问相机权限','去设置 ›'],['允许小镇外卖访问麦克风权限','去设置 ›'],['允许小镇外卖访问读写手机存储权限','已开启 ›']];
 if(kind==='order')order.splice(7,0,['开启截图添加手机信息水印功能','removed-watermark']);else permissions.push(['允许小镇外卖访问所有文件访问权限','removed-permission']);
 return (kind==='order'?order:permissions).map(([label,value])=>value.startsWith('removed-')?'<section class="removed-setting rv-hotspot" data-req="'+(kind==='order'?'SHOT-SETTING':'SHOT-PERMISSION')+'"><div class="setting-reference-row"><span>'+label+'</span>'+(kind==='order'?'<span class="reference-toggle switch-on" aria-label="原水印开关（待移除）"></span>':'<small>已开启 ›</small>')+'</div>'+(kind==='order'?'<p class="removed-original-note">（开启之后，截图上面会显示手机的基本信息，便于快速排查问题）</p>':'')+'<p class="removal-label">本次去掉此'+(kind==='order'?'开关及说明':'权限入口')+'</p></section>':'<div class="setting-reference-row"><span>'+label+'</span>'+(value.startsWith('switch-')?'<span class="reference-toggle '+value+'" aria-label="原有设置示意"></span>':'<small>'+value+'</small>')+'</div>').join('');
}
function settingsScreen(kind=shot.settings){return '<div class="demo-settings removal-demo"><header><b>'+(kind==='order'?'接单设置':'系统权限管理')+'</b></header><div class="settings-scroll"><section class="settings-reference-list">'+settingsRows(kind)+'</section></div></div>';}
function settingsReviewMarkup(kind){return `<div class="shot-layout"><div class="demo-phone-area rv-hotspot" data-req="${kind==='order'?'SHOT-SETTING':'SHOT-PERMISSION'}"><div class="demo-phone"><div class="demo-status light"><span>11:30</span><span>5G ▰</span></div><div class="demo-screen">${settingsScreen(kind)}</div><div class="demo-gesture"></div></div></div><p class="demo-fineprint">按用户参考图保留其余设置；此处展示调整后的页面。</p></div>`;}
function wxScreen(){return `<div class="wx-screen"><div class="wx-demo-tag">微信分享 · 模拟演示</div><header><button type="button" data-action="wx-cancel">取消</button><b>选择一个聊天</b><span></span></header><div class="wx-search">⌕ 搜索</div><p class="wx-label">最近聊天 · 以下均为演示联系人</p>${['小镇运营客服','技术支持','配送站长'].map((f,i)=>`<button type="button" class="wx-friend" data-action="friend-${i}"><span class="wx-avatar a${i}">${['客','技','站'][i]}</span><span>${f}</span><small>›</small></button>`).join('')}${shot.confirm?`<div class="wx-mask"><section class="wx-confirm"><h3>发送给：${esc(shot.friend)}</h3><div class="wx-picture">${feedbackMarkup(shot.output)}</div><p>图片包含骑手、位置与设备信息</p><div><button type="button" data-action="wx-back">取消</button><button type="button" data-action="wx-send">发送（演示）</button></div></section></div>`:''}</div>`;}
function shareCardMarkup(){const o=shot.output;if(!o)return '';const kind=o.scene==='dialog'?'dialog':o.scene==='bottom'?'bottom':'page';return '<aside class="shot-share-card thumb-'+kind+' rv-hotspot" data-req="SHOT-SHARE" aria-label="截图快捷分享"><div class="share-thumb thumb-content-'+kind+'"><div class="thumbnail-content" inert>'+o.content+'</div></div><button type="button" data-action="wx-share">分享截图</button><span class="share-timer" aria-hidden="true"></span></aside>';}
function currentDemoLabel(){return shot.settings==='order'?'接单设置':shot.settings==='permissions'?'系统权限设置':shot.scene==='dialog'?'功能弹窗演示':shot.scene==='bottom'?'底部弹窗演示':'骑手首页截图演示';}
function scenarioRailMarkup(){return `<aside class="scenario-rail" aria-label="演示场景切换"><div class="rail-group"><h3>界面演示</h3>${[['scene-page','骑手首页截图演示',!shot.settings&&shot.scene==='page'],['open-dialog','功能弹窗演示',!shot.settings&&shot.scene==='dialog'],['open-bottom','底部弹窗演示',!shot.settings&&shot.scene==='bottom'],['settings-order','接单设置',shot.settings==='order'],['settings-permissions','系统权限设置',shot.settings==='permissions']].map(([action,label,on])=>'<button type="button" data-action="'+action+'" aria-pressed="'+on+'">'+label+'</button>').join('')}</div>${shot.settings?'<div class="rail-scene-note"><b>本次去掉</b><p>虚线框标出原来的'+(shot.settings==='order'?'截图水印开关及说明':'所有文件访问权限入口')+'，更新后移除。</p></div>':'<div class="rail-group"><h3 class="rail-capture-title rv-hotspot" data-req="SHOT-DETECT">截图演示</h3><button type="button" class="rail-capture" data-action="shot-capture">模拟系统截图</button><p>'+(shot.scene==='page'?'缩略图为正常骑手首页。':shot.scene==='dialog'?'缩略图仅为功能弹窗内容，不包含底层页面和遮罩。':'缩略图仅为底部弹窗内容，不包含底层页面和遮罩。')+'</p></div>'}</aside>`;}
function interactiveCaptureMarkup(){return `<div class="single-app-demo five-scenes"><div class="single-demo-heading"><span class="single-demo-number">①</span><b>骑手APP</b><span class="single-demo-location">${currentDemoLabel()}</span></div><div class="single-demo-stage"><div class="demo-phone-area rv-hotspot" data-req="SHOT-CONTENT"><div class="demo-phone"><div class="demo-status"><span>11:30</span><span>▂▄▆ 5G ▰</span></div><div class="demo-screen" data-phone="screen">${shot.settings?settingsScreen():appBodyMarkup(shot.scene)}${shot.card&&!shot.settings?shareCardMarkup():''}</div><div class="demo-gesture"></div></div></div>${scenarioRailMarkup()}</div><div class="demo-message" role="status">${esc(shot.message)}</div></div>`;}

function interactiveResultMarkup(){const o=shot.output;return `<div class="shot-layout demo-result"><div class="result-caption"><span class="result-dot"></span>${o?('第 '+o.sequence+' 张 · '+sceneTitle(o.scene)+'截图'):'暂无临时图片'}<span>${o?(o.watermarked?'点击分享后 · 八项水印已添加':'临时截图 · 尚未添加水印'):'等待下次截图'}</span></div>${o?'<div class="feedback-wrap rv-hotspot" data-req="SHOT-IMAGE">'+feedbackMarkup(o)+'</div><div class="feedback-info"><b>截图时间：'+esc(o.time)+'</b><span>'+(o.watermarked?'水印仅用于本次微信分享。':'点击手机左侧「分享截图」后才附加水印；不分享则清理。')+'</span></div>':'<div class="feedback-placeholder"><div>▧</div><h3>'+(shot.lastCleanup?'临时图片已清理':'先截图，再选择分享')+'</h3><p>'+(shot.lastCleanup?esc(shot.lastCleanup):'截图后显示原页面／弹窗缩略图<br>点击分享时才添加骑手、位置与设备水印')+'</p></div>'}<p class="demo-fineprint">此区域仅用于核对临时图片与分享水印，不是APP新增页面。截图不保留；本原型只模拟临时图片清理，不操作真实相册。</p></div>`;}
function takeInteractiveShot(){
 if(shot.wechat)return;
 clearShareCard();shot.confirm=false;shot.friend='';const settings=shot.settings;
 generateShot();
 if(shot.output){shot.sequence++;shot.output.sequence=shot.sequence;if(settings)shot.output.scene='settings';shot.output.content=settings?settingsScreen():['dialog','bottom'].includes(shot.scene)?`<div class="captured-popup ${shot.scene==='bottom'?'bottom':''}">${popupMarkup(shot.scene==='bottom',true)}</div>`:appBodyMarkup(shot.scene,true);showShareCard();shot.lastCleanup='';shot.message='临时截图已生成，尚未添加水印；点击「分享截图」后加水印，不分享则删除临时图。';}
 renderCanvas();
}
function changeDemoCondition(key,value){discardTemporary('演示条件已更新，原临时图片已清理。');shot[key]=value;renderCanvas();}
function handleShareAction(action){
 if(action==='shot-capture'){if(!shot.settings)takeInteractiveShot();return;}
 if(action==='scene-page'){discardTemporary('点击「模拟系统截图」，查看正常首页缩略图。');shot.settings=false;shot.scene='page';}
 else if(action==='open-dialog'||action==='open-bottom'){discardTemporary('截图缩略图仅保留弹窗内容，不包含遮罩与底层页面。');shot.settings=false;shot.scene=action==='open-dialog'?'dialog':'bottom';}
 else if(action==='settings-order'||action==='settings-permissions'){discardTemporary('虚线框标出原入口；本次更新去掉框内内容。');shot.settings=action==='settings-order'?'order':'permissions';}
 else if(action==='wx-share'){if(!shot.card||!shot.output)return;shot.output.watermarked=true;discardTemporary('分享时添加骑手、位置与设备水印；本演示不展开微信界面，临时图片已清理。');}
 else if(action==='demo-reset'){discardTemporary('');Object.assign(shot,initialShot());}
 else return;
 renderCanvas();
}
document.addEventListener('click',e=>{const screen=e.target.closest('[data-phone="screen"]');if(!screen||!shot.card||e.target.closest('.shot-share-card,.rv-marker'))return;discardTemporary('未点击分享，临时截图已删除。');renderCanvas();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){discardTemporary('演示进入后台，临时图片已清理。');renderCanvas();}});

/* SHOT_JS_END */
function renderCanvas(){const details=document.querySelector('.demo-conditions'),open=details?.open;document.getElementById('demo-app').innerHTML=interactiveCaptureMarkup();if(open&&document.querySelector('.demo-conditions'))document.querySelector('.demo-conditions').open=true;}
// 与移动端模板相同的页面、底部窗口入口；状态统一由演示模型维护。
function showPage(id){handleShareAction('scene-'+id);}function showSheet(){handleShareAction('open-bottom');}function hideSheet(){handleShareAction('close-popup');}
document.addEventListener('click',e=>{if(e.target.closest('.feedback-image'))return;const b=e.target.closest('[data-action]');if(b&&!b.disabled)handleShotAction(b.dataset.action);});
document.addEventListener('change',e=>{const k=e.target.dataset.shotKey;if(k)changeDemoCondition(k,e.target.checked);});
renderCanvas();
</script></body></html>
