  "documentMarkdown": "# App 全局截图监听与微信快捷分享功能需求\n\n**需求类型：** 功能新增  \n**适用平台：** Android  \n**参考效果：** 淘宝截图后出现的左侧悬浮分享卡片（本需求仅保留“分享截图”按钮）\n\n## 一、需求目的\n\n用户在 App 内任意页面截图后，App 自动识别截图操作，重新生成当前页面或弹窗的图片，并在屏幕左侧显示一个小型分享卡片。用户点击“分享截图”，即可通过微信将图片发送给好友。\n\n## 二、功能说明\n\n### 1. 全局截图监听\n\n- App 在前台时，用户在任意页面截图，均尝试自动检测（以系统支持的截图方式为准）。\n- 页面切换后仍然有效，不需要用户手动开启。\n- App 进入后台后，不进行截图检测和图片生成。\n- 本期优先支持 Android 14 及以上系统。\n\n### 2. 自动选择图片内容\n\n| 截图时的界面 | 生成并分享的图片 |\n|---|---|\n| 普通页面 | 当前页面图片 |\n| 页面内切换的子页面 | 当前完整页面图片 |\n| 显示受支持的功能弹窗 | 仅弹窗图片 |\n| 显示受支持的底部弹窗 | 仅底部弹窗图片 |\n\n**核心规则：有受支持的弹窗时优先生成弹窗图片，否则生成当前页面图片。**\n\n图片由 App 重新生成，不读取用户相册中的原始截图，因此与系统截图可能存在细微差异。系统状态栏、系统弹窗以及部分特殊弹窗不在本期保证范围内。\n\n### 3. 截图分享悬浮卡片\n\n- **出现时机：** 检测到截图并成功生成图片后自动显示。\n- **显示位置：** 屏幕左侧，参考淘宝截图分享卡片样式。\n- **卡片内容：** 上方为生成图片的缩略图，下方仅保留一个 **“分享截图”** 按钮。\n- **不显示：** “识别截图”、商品搜索及其他功能入口。\n- **自动关闭：** 5 秒内未操作，卡片自动消失。\n- **手动关闭：** 点击卡片外部可关闭，且不影响原页面正常操作。\n- **连续截图：** 如卡片尚未关闭，再次截图时更新为最新图片，不重复叠加卡片。\n- **页面切换：** 卡片关闭，不将上一页面图片误用于新页面。\n- **展示要求：** 卡片尽量小巧，不遮挡页面主要操作区域；弹出时不改变当前页面内容。\n\n### 4. 微信分享\n\n- 点击 **“分享截图”** 后，调起微信图片分享流程。\n- **分享范围：** 本期仅支持发送给微信好友，不增加朋友圈等其他渠道。\n- 用户在微信中自行选择好友并确认发送；App 不自动发送。\n- 用户取消分享或从微信返回 App 后，分享卡片关闭。\n- 未安装微信、无法调起微信或分享失败时，给出简洁提示，不影响 App 使用。\n- 不要求先将重新生成的图片保存到系统相册。\n\n## 三、用户使用流程\n\n**用户截图 → App 检测截图 → 判断当前显示的是页面还是弹窗 → 重新生成图片 → 左侧显示缩略图及“分享截图”按钮 → 用户点击 → 打开微信选择好友发送。**\n\n### 场景一：普通页面\n\n用户在订单详情页截图，左侧出现分享卡片；点击“分享截图”，向微信好友分享订单详情页图片。\n\n### 场景二：功能弹窗\n\n用户打开订单操作弹窗后截图，分享卡片展示弹窗缩略图；分享时仅发送弹窗图片，不包含底层订单详情页。\n\n### 场景三：底部弹窗\n\n用户打开底部操作菜单并截图，分享卡片展示底部弹窗图片；点击后可发送给微信好友。\n\n## 四、注意事项\n\n1. 本期优先支持 Android 14 及以上；并非所有系统截图方式都能被检测到。\n2. 生成图片不是系统保存的原始截图，动态内容可能与用户截图瞬间略有不同。\n3. 不读取用户相册，不自动上传图片，不自动发送给微信好友。\n4. 仅处理本 App 的页面，不获取其他 App 的画面。\n5. 不支持系统弹窗及部分特殊弹窗；涉及支付、密码等敏感页面时应禁止生成或分享敏感内容。\n6. 截图分享卡片不能出现在本次重新生成的图片中。\n7. 截图检测、图片生成及微信分享均不得影响 App 的正常使用。\n\n## 五、验收标准\n\n1. App 前台任意受支持的普通页面截图后，自动出现左侧分享卡片，缩略图正确。\n2. 显示受支持的弹窗时截图，缩略图和分享图片均仅包含该弹窗。\n3. 分享卡片只有 **“分享截图”** 一个操作按钮，没有“识别截图”。\n4. 点击按钮后能进入微信好友图片分享流程，用户可自行选择好友发送。\n5. 5 秒不操作自动关闭；点击卡片外部可关闭。\n6. 连续截图时卡片更新为最新图片，不出现多个重叠卡片。\n7. App 切换页面或进入后台后，不出现旧图片误分享的问题。\n8. 用户取消分享、未安装微信或分享失败时，App 不闪退、不卡顿。\n9. 图片不会被自动保存到相册或上传服务器。\n\n## 六、本期不包含\n\n- Android 13 及以下版本的完整截图监听兼容。\n- 截图内容识别、商品搜索、OCR 文字识别。\n- 微信朋友圈、其他社交平台分享。\n- 读取相册原始截图、跨 App 截图。\n- 将弹窗和底层页面合成为一张图片。\n\n## 七、最终效果\n\n**App 内截图 → 左侧弹出“图片缩略图 + 分享截图”卡片 → 点击后分享到微信好友。**\n\n有受支持的弹窗就分享弹窗图片；没有弹窗就分享当前页面图片。操作简单，参考淘宝的截图快捷分享体验。\n\n## 八、设置项调整\n\n1. **接单设置：** 移除「开启截图添加手机信息水印功能」开关及其说明。\n2. **系统权限设置：** 移除「允许小镇外卖访问所有文件访问权限」设置项。\n",

    "common": "# App 全局截图监听与微信快捷分享功能需求\n\n**需求类型：** 功能新增  \n**适用平台：** Android  \n**参考效果：** 淘宝截图后出现的左侧悬浮分享卡片（本需求仅保留“分享截图”按钮）\n\n## 一、需求目的\n\n用户在 App 内任意页面截图后，App 自动识别截图操作，重新生成当前页面或弹窗的图片，并在屏幕左侧显示一个小型分享卡片。用户点击“分享截图”，即可通过微信将图片发送给好友。\n\n## 二、功能说明\n\n### 1. 全局截图监听\n\n- App 在前台时，用户在任意页面截图，均尝试自动检测（以系统支持的截图方式为准）。\n- 页面切换后仍然有效，不需要用户手动开启。\n- App 进入后台后，不进行截图检测和图片生成。\n- 本期优先支持 Android 14 及以上系统。\n\n### 2. 自动选择图片内容\n\n| 截图时的界面 | 生成并分享的图片 |\n|---|---|\n| 普通页面 | 当前页面图片 |\n| 页面内切换的子页面 | 当前完整页面图片 |\n| 显示受支持的功能弹窗 | 仅弹窗图片 |\n| 显示受支持的底部弹窗 | 仅底部弹窗图片 |\n\n**核心规则：有受支持的弹窗时优先生成弹窗图片，否则生成当前页面图片。**\n\n图片由 App 重新生成，不读取用户相册中的原始截图，因此与系统截图可能存在细微差异。系统状态栏、系统弹窗以及部分特殊弹窗不在本期保证范围内。\n\n### 3. 截图分享悬浮卡片\n\n- **出现时机：** 检测到截图并成功生成图片后自动显示。\n- **显示位置：** 屏幕左侧，参考淘宝截图分享卡片样式。\n- **卡片内容：** 上方为生成图片的缩略图，下方仅保留一个 **“分享截图”** 按钮。\n- **不显示：** “识别截图”、商品搜索及其他功能入口。\n- **自动关闭：** 5 秒内未操作，卡片自动消失。\n- **手动关闭：** 点击卡片外部可关闭，且不影响原页面正常操作。\n- **连续截图：** 如卡片尚未关闭，再次截图时更新为最新图片，不重复叠加卡片。\n- **页面切换：** 卡片关闭，不将上一页面图片误用于新页面。\n- **展示要求：** 卡片尽量小巧，不遮挡页面主要操作区域；弹出时不改变当前页面内容。\n\n### 4. 微信分享\n\n- 点击 **“分享截图”** 后，调起微信图片分享流程。\n- **分享范围：** 本期仅支持发送给微信好友，不增加朋友圈等其他渠道。\n- 用户在微信中自行选择好友并确认发送；App 不自动发送。\n- 用户取消分享或从微信返回 App 后，分享卡片关闭。\n- 未安装微信、无法调起微信或分享失败时，给出简洁提示，不影响 App 使用。\n- 不要求先将重新生成的图片保存到系统相册。\n\n## 三、用户使用流程\n\n**用户截图 → App 检测截图 → 判断当前显示的是页面还是弹窗 → 重新生成图片 → 左侧显示缩略图及“分享截图”按钮 → 用户点击 → 打开微信选择好友发送。**\n\n### 场景一：普通页面\n\n用户在订单详情页截图，左侧出现分享卡片；点击“分享截图”，向微信好友分享订单详情页图片。\n\n### 场景二：功能弹窗\n\n用户打开订单操作弹窗后截图，分享卡片展示弹窗缩略图；分享时仅发送弹窗图片，不包含底层订单详情页。\n\n### 场景三：底部弹窗\n\n用户打开底部操作菜单并截图，分享卡片展示底部弹窗图片；点击后可发送给微信好友。\n\n## 四、注意事项\n\n1. 本期优先支持 Android 14 及以上；并非所有系统截图方式都能被检测到。\n2. 生成图片不是系统保存的原始截图，动态内容可能与用户截图瞬间略有不同。\n3. 不读取用户相册，不自动上传图片，不自动发送给微信好友。\n4. 仅处理本 App 的页面，不获取其他 App 的画面。\n5. 不支持系统弹窗及部分特殊弹窗；涉及支付、密码等敏感页面时应禁止生成或分享敏感内容。\n6. 截图分享卡片不能出现在本次重新生成的图片中。\n7. 截图检测、图片生成及微信分享均不得影响 App 的正常使用。\n\n## 五、验收标准\n\n1. App 前台任意受支持的普通页面截图后，自动出现左侧分享卡片，缩略图正确。\n2. 显示受支持的弹窗时截图，缩略图和分享图片均仅包含该弹窗。\n3. 分享卡片只有 **“分享截图”** 一个操作按钮，没有“识别截图”。\n4. 点击按钮后能进入微信好友图片分享流程，用户可自行选择好友发送。\n5. 5 秒不操作自动关闭；点击卡片外部可关闭。\n6. 连续截图时卡片更新为最新图片，不出现多个重叠卡片。\n7. App 切换页面或进入后台后，不出现旧图片误分享的问题。\n8. 用户取消分享、未安装微信或分享失败时，App 不闪退、不卡顿。\n9. 图片不会被自动保存到相册或上传服务器。\n\n## 六、本期不包含\n\n- Android 13 及以下版本的完整截图监听兼容。\n- 截图内容识别、商品搜索、OCR 文字识别。\n- 微信朋友圈、其他社交平台分享。\n- 读取相册原始截图、跨 App 截图。\n- 将弹窗和底层页面合成为一张图片。\n\n## 七、最终效果\n\n**App 内截图 → 左侧弹出“图片缩略图 + 分享截图”卡片 → 点击后分享到微信好友。**\n\n有受支持的弹窗就分享弹窗图片；没有弹窗就分享当前页面图片。操作简单，参考淘宝的截图快捷分享体验。\n\n## 八、设置项调整\n\n1. **接单设置：** 移除「开启截图添加手机信息水印功能」开关及其说明。\n2. **系统权限设置：** 移除「允许小镇外卖访问所有文件访问权限」设置项。\n",

function initialShot(){return {allowed:true,front:true,support:true,scene:'page',output:null,message:'点击「模拟系统截图」，体验附加信息与微信快捷分享。',card:false,wechat:false,friend:'',confirm:false,settings:false,wxInstalled:true,wxFailure:false,sequence:0,history:[],preview:false,lastCleanup:''};}
const shot=initialShot();
function settingMarkup(){return settingsReviewMarkup('order');}
function permissionMarkup(){return settingsReviewMarkup('permissions');}
function dialogMarkup(bottom=false){return `<section class="shot-dialog"><h3>${bottom?'订单操作':'提示'}</h3><p>${bottom?'联系商家　　联系顾客':'当前暂无新任务，请稍后查看'}</p><footer><span>${bottom?'取消':'我知道了'}</span></footer></section>`;}
function captureMarkup(){return interactiveCaptureMarkup();}
function dateLabel(date){const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}.${pad(date.getMonth()+1)}.${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;}
function generateShot(){
 shot.output=null;
 if(!shot.allowed)shot.message='系统未允许截图检测，本次未生成附加信息图片。';
 else if(!shot.front)shot.message='APP在后台，本次不检测、不生成图片。';
 else if(!shot.support)shot.message='当前系统或截图方式不在已验证范围，未模拟生成结果。';
 else if(shot.scene==='special')shot.message='特殊／系统弹窗的处理方式待确认，本演示不替业务决定回退结果。';
 else{shot.output={scene:shot.scene,time:dateLabel(new Date()),watermarked:false};shot.message='已模拟生成临时截图，尚未添加水印。';}
}
function resultMarkup(){return interactiveResultMarkup();}
const pageMarkup={settings:settingMarkup,permissions:permissionMarkup,capture:captureMarkup,result:resultMarkup};
function handleShotAction(action){handleShareAction(action);}


// 本文件与业务交互.js共用状态；原型与联动评审复用同一套手机操作。
let shareTimer=0;
function clearShareCard(){clearTimeout(shareTimer);shot.card=false;}
function discardTemporary(reason){clearShareCard();shot.output=null;shot.preview=false;shot.wechat=false;shot.confirm=false;shot.friend='';shot.lastCleanup=reason;if(reason)shot.message=reason;}

const ReviewDocument=(()=>{
 const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function safeHref(href){
  if(!href||/[\u0000-\u001f\u007f\\]/.test(href)||/^(?:\/\/|\/)/.test(href))return false;
  if(/^[a-z][a-z0-9+.-]*:/i.test(href))return /^https?:\/\/[^\s]+$/i.test(href);
  return true;
 }
 function inline(text){
  const token=/\x60([^\x60]+)\x60|\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*/g;
  let out='',last=0;
  for(const m of text.matchAll(token)){
   out+=escape(text.slice(last,m.index));
   if(m[1]!==undefined)out+='<code>'+escape(m[1])+'</code>';
   else if(m[2]!==undefined){const href=m[3].trim();out+=safeHref(href)?'<a href="'+escape(href)+'"'+(/^https?:/i.test(href)?' target="_blank" rel="noopener"':'')+'>'+escape(m[2])+'</a>':escape(m[2]);}
   else out+='<strong>'+escape(m[4])+'</strong>';
   last=m.index+m[0].length;
  }
  return out+escape(text.slice(last));
 }
 function slug(text){return text.toLowerCase().replace(/[\x60*_]/g,'').replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s+/g,'-');}
 function render(md){
  const lines=md.replace(/\r/g,'').split('\n'),seen=new Map();let out='',code=false,block=[],list='';
  const close=()=>{if(list){out+='</'+list+'>';list='';}};
  for(let i=0;i<lines.length;i++){
   const line=lines[i];if(line.startsWith('\x60\x60\x60')){close();if(code){out+='<pre><code>'+escape(block.join('\n'))+'</code></pre>';block=[];}code=!code;continue;}
   if(code){block.push(line);continue;}
   if(!line.trim()){close();continue;}
   if(/^\|/.test(line)&&/^\|\s*:?-+/.test(lines[i+1]||'')){
    close();const cells=t=>t.replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
    out+='<div class="md-table"><table><thead><tr>'+cells(line).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i++;
    while(/^\|/.test(lines[i+1]||'')){out+='<tr>'+cells(lines[++i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';}out+='</tbody></table></div>';continue;
   }
   const h=line.match(/^(#{1,6})\s+(.+)/);if(h){close();const base=slug(h[2]),n=seen.get(base)||0;seen.set(base,n+1);out+='<h'+h[1].length+' data-md-anchor="'+escape(base+(n?'-'+n:''))+'">'+inline(h[2])+'</h'+h[1].length+'>';continue;}
   const item=line.match(/^(?:([-*]) |(\d+)\. )(.+)/);
   if(item){const type=item[2]?'ol':'ul';if(list!==type){close();list=type;out+='<'+type+(item[2]?' start="'+Number(item[2])+'"':'')+'>';}out+='<li>'+inline(item[3])+'</li>';continue;}
   close();out+=(line.startsWith('> ')?'<blockquote>'+inline(line.slice(2))+'</blockquote>':'<p>'+inline(line)+'</p>');
  }
  close();if(code)out+='<pre><code>'+escape(block.join('\n'))+'</code></pre>';return out;
 }
 return {render};
})();

const documentState={on:false,category:'all',source:false};
function documentGroups(){return [{id:'all',name:'完整 PRD',hint:'完整需求与共享说明'},
 {id:'common',name:'公共说明',hint:'范围、流程、跨端规则与待确认项'},

function renderRequirement(r, endName, pageName, audience='all', level=2) {
 const heading=(name,depth=0)=>level+depth>4?'**'+name+'**\n\n':'#'.repeat(level+depth)+' '+name+'\n\n';
 const list=values=>(values||[]).map(v=>'- '+v).join('\n')+'\n';
 const legacy=r.legacyUnclassified??!(r.common||r.backend||r.frontend);
 let body='';
 const section=(name,part)=>{
  if(!part)return '';
  let out=part.markdown?.trim()?part.markdown.trim()+'\n\n':'';
  for(const [key,label] of [['rules','规则'],['exceptions','异常与边界'],['acceptance','关键验证']])
   if(part[key]?.length){const title=key==='rules'?(name==='旧格式未分类，需结合全文确认'?name:''):label;out+=(title?'**'+title+'**\n\n':'')+list(part[key])+'\n';}
  return out?(audience==='all'?heading(name,1)+out:out):'';
 };
 if((r.rules?.length||r.exceptions?.length||r.acceptance?.length))
  body+=section(legacy?'旧格式未分类，需结合全文确认':'共用规则',r);
 body+=section('共用规则',r.common);
 for(const role of ['backend','frontend'])if(audience==='all'||audience===role)
  body+=section(role==='backend'?'后端功能规则':'前端 UI 与交互',r[role]);
 for(const c of r.cases||[])if(audience==='all'||!c.audience||c.audience==='all'||c.audience===audience)
  body+=heading('验证场景：'+c.name,1)+'前置条件：'+(c.precondition||'无额外条件')+'\n\n'+c.steps.map((s,i)=>(i+1)+'. '+s).join('\n')+'\n\n预期结果：'+c.expected+'\n\n';
 if(r.development?.length)body+=heading('共用研发说明',1)+list(r.development)+'\n';
 if(!body.trim())return '';
 // End/page/summary remain on review cards; document chapters already supply context.
 return heading(r.title)+body;
}
function requirementMarkdown(r,audience='all',level=3){return renderRequirement(r,endName,pageName,audience,level);}
function documentMarkdown(category=documentState.category){
 const group=documentGroups().find(g=>g.id===category);
 const shared=reviewData.shared.map(s=>'### '+s.title+'\n\n'+s.text+'\n').join('\n');
 const commonItem=r=>{
  const item={...r,backend:undefined,frontend:undefined,legacyUnclassified:r.legacyUnclassified??!(r.common||r.backend||r.frontend)};
  item.cases=(r.cases||[]).filter(c=>!c.audience||c.audience==='all');
  return requirementMarkdown(item,'common',4);
 };
 const roleItem=(r,role)=>{
  const item={...r,common:undefined,rules:[],exceptions:[],acceptance:[],development:[]};
  item.cases=(r.cases||[]).filter(c=>c.audience===role);
  return requirementMarkdown(item,role,4);
 };
 const chapter=(title,body)=>body.trim()?'## '+title+'\n\n'+body+'\n':'';
 const publicBody=chapter('公共说明',shared);
 const byEnd=audience=>reviewData.ends.map(end=>{
  const rows=reviewData.requirements.filter(r=>r.end===end.id);
  const section=(name,body)=>body.trim()?'### '+name+'\n\n'+body+'\n':'';
  let body=section('共用说明',rows.map(commonItem).filter(Boolean).join('\n'));
  for(const role of ['backend','frontend'])if(audience==='all'||audience===role)
   body+=section(role==='backend'?'后端调整':'前端 UI 调整',rows.map(r=>roleItem(r,role)).filter(Boolean).join('\n'));
  return chapter(end.name,body);
 }).join('\n');
 const title='# '+reviewData.title+' PRD\n\n版本：'+reviewData.version+'\n\n';
 if(category==='all')return reviewData.documentMarkdown||title+publicBody+byEnd('all');
 if(category==='common')return reviewData.documentViews?.common||title+publicBody+byEnd('common');
 if(category==='backend'||category==='frontend')return reviewData.documentViews?.[category]||title+publicBody+byEnd(category);
 if(!group)return '';
 return group.markdown||'# '+group.name+'\n\n'+(group.hint||'')+'\n\n## 功能需求\n\n'+reviewData.requirements.filter(r=>group.requirementIds?.includes(r.id)).map(r=>requirementMarkdown(r)).join('\n');
}
function refreshDocument(){
 const groups=documentGroups(),group=groups.find(g=>g.id===documentState.category)||groups[0];documentState.category=group.id;
 $('md-title').textContent=group.name;$('md-hint').textContent=group.hint||'';
 $('md-categories').innerHTML=groups.map(g=>`<button type="button" data-category="${esc(g.id)}" aria-pressed="${g.id===group.id}">${esc(g.name)}</button>`).join('');
 const md=documentMarkdown(),q=$('md-search').value.trim().toLowerCase();
 const blocks=q?md.split(/(?=^## )/m).filter(b=>b.toLowerCase().includes(q)):null;
 const shown=q?(blocks.length?blocks.join('\n'):'未找到符合条件的内容。'):md;
 $('md-content').innerHTML=documentState.source?'<pre class="md-source">'+esc(shown)+'</pre>':ReviewDocument.render(shown);
 $('md-source-toggle').textContent=documentState.source?'阅读文档':'查看 Markdown 源码';
 const heads=[...$('md-content').querySelectorAll('h1,h2,h3,h4,h5,h6')];heads.forEach((h,i)=>h.id='md-section-'+i);
 $('md-toc').innerHTML=documentState.source?'':heads.map((h,i)=>`<button type="button" data-md-section="${i}" class="level-${h.tagName.toLowerCase()}">${esc(h.textContent)}</button>`).join('');
 $('md-result').textContent=q?'当前关键词：'+$('md-search').value+'；下载保留本分类全部内容。':'下载保留当前分类完整内容。';
 $('md-section-jump').innerHTML='<option value="">跳转章节…</option>'+heads.map((h,i)=>`<option value="${i}">${esc(h.textContent)}</option>`).join('');
}
function showReviewDocument(on){documentState.on=on;document.body.classList.toggle('viewing-markdown',on);$('review-document').hidden=!on;$('workspace').hidden=on;document.querySelector('.rv-context').hidden=on;document.querySelector('.rv-tools').hidden=on;if(on){hoverId='';refreshDocument();}renderNav();scheduleLine();}
function enterDocument(category='all',{push=true}={}){if(!documentGroups().some(g=>g.id===category)){notify('该文档分类不存在，已打开完整 PRD。');category='all';}documentState.category=category;showReviewDocument(true);if(push)pushHash('#document='+encodeURIComponent(category));}
function downloadDocument(category){
 const group=documentGroups().find(g=>g.id===category);if(!group)return;
 const content=documentMarkdown(category),url=URL.createObjectURL(new Blob([content],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=(reviewData.title+'_'+group.name).replace(/[<>:"/\\|?*]/g,'_')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function locateDocumentHeading(index){const target=$('md-section-'+index);if(target)target.scrollIntoView({block:'start',behavior:motion()});}
function bindDocumentControls(){
 $('md-content').addEventListener('click',e=>{
  const link=e.target.closest('a[href^="#"]');if(!link)return;
  const hash=link.getAttribute('href');if(/^#(?:req|end|document)=/.test(hash))return;
  e.preventDefault();let anchor;try{anchor=decodeURIComponent(hash.slice(1));}catch{return notify('文档锚点格式无效。');}
  const target=[...$('md-content').querySelectorAll('[data-md-anchor]')].find(h=>h.dataset.mdAnchor===anchor||h.id===anchor);
  if(target)target.scrollIntoView({block:'start',behavior:motion()});else notify('当前文档中未找到该章节，可清除搜索或查看完整 PRD。');
 });
 $('md-categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;documentState.category=b.dataset.category;$('md-search').value='';refreshDocument();pushHash('#document='+encodeURIComponent(documentState.category));$('md-reading').scrollTop=0;});
 $('md-toc').addEventListener('click',e=>{const b=e.target.closest('[data-md-section]');if(b)locateDocumentHeading(b.dataset.mdSection);});
 $('md-section-jump').addEventListener('change',e=>{if(e.target.value!=='')locateDocumentHeading(e.target.value);});
 $('md-search').addEventListener('input',refreshDocument);$('md-clear').addEventListener('click',()=>{$('md-search').value='';refreshDocument();$('md-search').focus();});
 $('md-source-toggle').addEventListener('click',()=>{documentState.source=!documentState.source;refreshDocument();});
 $('md-download').addEventListener('click',()=>downloadDocument(documentState.category));$('md-download-all').addEventListener('click',()=>downloadDocument('all'));
 $('md-return').addEventListener('click',()=>{showReviewDocument(false);pushHash(selectedId?'#req='+encodeURIComponent(selectedId):'#end='+encodeURIComponent(currentEnd)+(currentPage==='all'?'':'&page='+encodeURIComponent(currentPage)));});
}
// 评审交互；业务数据和状态适配与评审壳分开维护。
let currentEnd='all',currentPage='all',selectedId='',hoverId='',lens='all',view='review',toastTimer,lineFrame;

const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reqById=id=>reviewData.requirements.find(r=>r.id===id);
const endName=id=>reviewData.ends.find(e=>e.id===id)?.name||id;
const pageName=id=>reviewData.pages.find(p=>p.id===id)?.name||id;
const narrow=()=>matchMedia('(max-width:860px)').matches;
const motion=()=>matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth';
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',3500);}
function scopedRequirements(){return reviewData.requirements.filter(r=>(currentEnd==='all'||r.end===currentEnd)&&(currentPage==='all'||r.page===currentPage));}
function matchesSearch(r,q){return [r.id,r.title,r.summary,...(r.rules||[]),...(r.exceptions||[]),...(r.acceptance||[]),...['common','backend','frontend'].flatMap(role=>[r[role]?.markdown||'',...['rules','exceptions','acceptance'].flatMap(key=>r[role]?.[key]||[])]),...(r.cases||[]).map(c=>[c.name,c.precondition,...(c.steps||[]),c.expected].join(' ')),...(r.development||[])].join(' ').toLowerCase().includes(q);}
function filteredRequirements(){const q=$('search').value.trim().toLowerCase();return scopedRequirements().filter(r=>matchesSearch(r,q));}
function pushHash(hash){if(location.hash!==hash)history.pushState(null,'',hash);}
function renderNav(){const items=[{id:'all',name:'全部端'},...reviewData.ends];$('end-nav').innerHTML=items.map(e=>`<button type="button" data-end="${esc(e.id)}" aria-pressed="${!documentState.on&&currentEnd===e.id}">${esc(e.name)}</button>`).join('')+`<button type="button" id="document-tab" aria-pressed="${documentState.on}">Markdown 文档</button>`;const pages=reviewData.pages.filter(p=>currentEnd==='all'||p.end===currentEnd);$('page-filter').innerHTML='<option value="all">全部页面</option>'+pages.map(p=>`<option value="${esc(p.id)}">${esc(currentEnd==='all'?endName(p.end)+' · ':'')}${esc(p.name)}</option>`).join('');$('page-filter').value=currentPage;}
function renderCanvas(){
 const filter=$('page-filter');if(filter)filter.closest('label')?.setAttribute('hidden','');
 const scroll=$('canvas').scrollTop,open=$('canvas').querySelector('.demo-conditions')?.open;
 $('canvas').innerHTML='<section class="rv-section"><div class="rv-stage mobile">'+interactiveCaptureMarkup()+'</div></section>';
 if(open)$('canvas').querySelector('.demo-conditions').open=true;
 $('canvas').querySelectorAll('[data-req]').forEach(el=>{const r=reqById(el.dataset.req);if(!r)return;const marker=document.createElement('button');marker.type='button';marker.className='rv-marker';marker.textContent=String(reviewData.requirements.indexOf(r)+1);marker.setAttribute('aria-label','查看需求：'+r.title);el.append(marker);});
 $('canvas').scrollTop=scroll;highlight();
}

function roleSections(r){
 const legacy=r.legacyUnclassified??!(r.common||r.backend||r.frontend);
 const section=(name,part,role)=>{
  if(!part)return '';
  const body=(part.markdown?.trim()?ReviewDocument.render(part.markdown):'')+[['rules','规则'],['exceptions','异常与边界'],['acceptance','关键验证']].filter(([key])=>part[key]?.length).map(([key,label])=>'<h3>'+label+'</h3>'+list(part[key])).join('');
  if(!body)return '';
  const open=role==='common'||lens==='all'||lens==='qa'||(role==='backend'&&lens==='dev')||role===lens;
  return '<details class="rv-role" '+(open?'open':'')+'><summary>'+name+'</summary>'+body+'</details>';
 };
 return section(legacy?'旧格式未分类，需结合全文确认':'共用规则',r,'common')+section('共用规则',r.common,'common')+section('后端功能规则',r.backend,'backend')+section('前端 UI 与交互',r.frontend,'frontend');
}
function list(values){return `<ul>${values.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;}
function casesMarkup(r){return (r.cases||[]).length?`<div class="rv-cases">${r.cases.map(c=>`<div class="rv-case"><b>${esc(c.name)}</b><p>前置条件：${esc(c.precondition||'无额外条件')}</p><p>操作步骤</p><ol>${(c.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p>预期结果：${esc(c.expected)}</p></div>`).join('')}</div>`:'';}
function renderDocs(){
 const scroll=$('doc-body').scrollTop,rows=filteredRequirements();
 const lensNote=lens==='qa'?'测试查阅：展开关键验证与场景。':lens==='dev'?'后端规则：展开业务内容，前端 UI 可按需展开。':lens==='frontend'?'前端 UI：展开界面交互，后端规则可按需展开。':'完整需求：公共说明、后端规则与前端 UI 分组查阅。';
 $('requirements').innerHTML=`<p class="rv-lens-note">${lensNote}</p>`+(rows.length?rows.map(r=>`<article class="rv-rule" id="req-${esc(r.id)}" data-doc="${esc(r.id)}"><h3 class="rv-rule-title"><span class="rv-rule-number">${reviewData.requirements.indexOf(r)+1}</span>${esc(r.title)}</h3><div class="rv-rule-meta">${esc(endName(r.end))} / ${esc(pageName(r.page))}</div><p>${esc(r.summary)}</p><div class="rv-rule-sections">${roleSections(r)}${r.cases?.length?`<details class="rv-acceptance" ${lens==='qa'?'open':''}><summary>验证场景（${r.cases.length}）</summary>${casesMarkup(r)}</details>`:''}${r.development?.length?`<details class="rv-development" ${lens==='dev'?'open':''}><summary>研发说明</summary>${list(r.development)}</details>`:''}</div>${r.locatable===false?'<div class="rv-rule-footer"><span class="rv-no-target">全局规则 · 无独立界面</span></div>':''}</article>`).join(''):'<div class="rv-empty">未找到匹配需求。<br><button type="button" data-clear>清除关键词</button></div>');
 $('shared').innerHTML=reviewData.shared.filter(s=>currentEnd==='all'||s.ends.includes(currentEnd)).map(s=>`<details class="rv-shared" open><summary>${esc(s.title)}</summary><p>${esc(s.text)}</p></details>`).join('');
 $('doc-body').scrollTop=scroll;updateNavigation();highlight();
}
function updateNavigation(){
 const rows=filteredRequirements(),index=rows.findIndex(r=>r.id===selectedId);
 $('doc-count').textContent=`${rows.length} / ${scopedRequirements().length} 条${index>=0?' · 当前 '+(index+1):''}`;
 $('req-jump').innerHTML='<option value="">跳转到需求…</option>'+rows.map(r=>`<option value="${esc(r.id)}">${esc(r.title)}</option>`).join('');$('req-jump').value=index>=0?selectedId:'';
 $('prev-req').disabled=!rows.length||index===0;$('next-req').disabled=!rows.length||index===rows.length-1;
 const r=reqById(selectedId);$('review-context').textContent=r?endName(r.end)+' / '+pageName(r.page)+' / '+r.title:'点击原型标注查看对应需求；目录与翻阅仅用于文档查阅。';
}
function highlight(){document.querySelectorAll('[data-req]').forEach(el=>{el.classList.toggle('rv-selected',el.dataset.req===selectedId);el.classList.toggle('rv-hover',el.dataset.req===hoverId);});document.querySelectorAll('[data-doc]').forEach(el=>{el.classList.toggle('selected',el.dataset.doc===selectedId);el.classList.toggle('rv-hover',el.dataset.doc===hoverId);});scheduleLine();}
function setView(value){view=value;document.body.classList.toggle('rv-prototype-only',view==='prototype');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));scheduleLine();}
function setScope(end,page,{push=true}={}){if(page==='settings'||page==='permissions'){discardTemporary('已切换设置页面。');shot.settings=page==='settings'?'order':'permissions';}else if(page==='capture'){discardTemporary('已返回骑手首页。');shot.settings=false;shot.scene='page';}else if(page==='result'){shot.settings=false;}currentEnd=end;currentPage=page;selectedId='';hoverId='';$('search').value='';if(push)pushHash('#end='+encodeURIComponent(end)+(page==='all'?'':'&page='+encodeURIComponent(page)));renderNav();renderCanvas();renderDocs();$('canvas').scrollTop=0;$('doc-body').scrollTop=0;}
// 项目适配入口：仅在直接打开已有需求地址时进入必要状态。普通业务操作不会调用这里。
async function activateRequirement(req){if(req.id==='SHOT-SETTING'||req.id==='SHOT-PERMISSION'){discardTemporary('虚线框标出本次去掉的原入口。');shot.settings=req.id==='SHOT-SETTING'?'order':'permissions';}else if(req.id==='SHOT-IMAGE'||req.id==='SHOT-SHARE'){shot.settings=false;if(!shot.output){shot.front=true;shot.allowed=true;shot.support=true;takeInteractiveShot();}showShareCard();}renderCanvas();}

function scrollTarget(container,target){if(!target)return;if(narrow()){target.scrollIntoView({behavior:motion(),block:'center'});return;}const rect=target.getBoundingClientRect(),bounds=container.getBoundingClientRect();container.scrollTo({top:container.scrollTop+rect.top-bounds.top-Math.max(16,(bounds.height-Math.min(rect.height,bounds.height-32))/2),behavior:motion()});}
function hotspotFor(id){return [...$('canvas').querySelectorAll('[data-req]')].find(el=>el.dataset.req===id);}
async function choose(id,source,{push=true,keepSearch=false}={}){
 const r=reqById(id);if(!r)return notify('未找到对应需求，请从端导航重新选择。');
 let rerender=false;if(currentEnd!=='all'&&currentEnd!==r.end){currentEnd=r.end;rerender=true;}if(currentPage!=='all'&&currentPage!==r.page){currentPage=r.page;rerender=true;}
 if(rerender){renderNav();renderCanvas();}if(!keepSearch&&$('search').value){$('search').value='';renderDocs();}
 if(!document.getElementById('req-'+id))renderDocs();selectedId=id;hoverId='';
 if(source==='link'&&r.locatable!==false){if(view==='prototype')setView('review');await activateRequirement(r);}
 const card=document.getElementById('req-'+id);card?.querySelector('.rv-acceptance')?.setAttribute('open','');highlight();updateNavigation();if(push)pushHash('#req='+encodeURIComponent(id));
 if(source==='link'&&r.locatable!==false){const target=hotspotFor(id);if(target)scrollTarget($('canvas'),target);else notify('该需求暂未提供可定位界面，请查阅右侧规则。');}
 if(source==='canvas'||source==='navigate'||source==='link'&&!narrow())scrollTarget($('doc-body'),card);
 scheduleLine();
}
async function applyHash(){const params=new URLSearchParams(location.hash.slice(1));if(params.has('document')){enterDocument(params.get('document'),{push:false});return;}if(documentState.on)showReviewDocument(false);if(params.has('req')){const r=reqById(params.get('req'));if(!r){notify('此需求链接已失效，可从端导航查看现有需求。');return;}currentEnd=r.end;currentPage=r.page;$('search').value='';renderNav();renderCanvas();renderDocs();await choose(r.id,'link',{push:false});}else if(params.has('end')){const end=params.get('end'),page=params.get('page')||'all';if((end==='all'||reviewData.ends.some(e=>e.id===end))&&(page==='all'||reviewData.pages.some(p=>p.id===page&&(end==='all'||p.end===end))))setScope(end,page,{push:false});else notify('此端或页面不存在，已保留当前评审页。');}else setScope('all','all',{push:false});}
function setHover(id){if(hoverId===id)return;hoverId=id;highlight();}
function bindHover(container,attribute){container.addEventListener('pointerover',e=>{const hot=e.target.closest('['+attribute+']');if(hot)setHover(hot.getAttribute(attribute));});container.addEventListener('pointerout',e=>{const hot=e.target.closest('['+attribute+']');if(hot&&!hot.contains(e.relatedTarget))setHover('');});container.addEventListener('focusin',e=>{const hot=e.target.closest('['+attribute+']');if(hot)setHover(hot.getAttribute(attribute));});container.addEventListener('focusout',e=>{if(!container.contains(e.relatedTarget))setHover('');});}
function scheduleLine(){if(lineFrame)return;lineFrame=requestAnimationFrame(()=>{lineFrame=0;drawLine();});}
function visibleIn(el,panel){const r=el.getBoundingClientRect(),p=panel.getBoundingClientRect();return r.width>0&&r.height>0&&r.right>p.left&&r.left<p.right&&r.bottom>p.top&&r.top<p.bottom;}
function drawLine(){
 const svg=$('review-lines');svg.style.display='none';if(documentState.on||narrow()||view!=='review'||!$('lines').checked)return;
 const id=hoverId||selectedId;if(!id)return;const card=document.getElementById('req-'+id),target=[...$('canvas').querySelectorAll('[data-req]')].find(el=>el.dataset.req===id&&visibleIn(el,$('canvas')));if(!card||!target||!visibleIn(card,$('doc-body')))return;
 const a=target.getBoundingClientRect(),b=card.getBoundingClientRect(),ca=$('canvas').getBoundingClientRect(),cb=$('doc-body').getBoundingClientRect();const x1=Math.min(a.right,ca.right-4),y1=Math.max(ca.top+8,Math.min(ca.bottom-8,a.top+a.height/2)),x2=b.left,y2=Math.max(cb.top+8,Math.min(cb.bottom-8,b.top+Math.min(b.height/2,70))),dx=Math.max(35,(x2-x1)/2);
 svg.querySelector('path').setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);const dots=svg.querySelectorAll('circle');dots[0].setAttribute('cx',x1);dots[0].setAttribute('cy',y1);dots[1].setAttribute('cx',x2);dots[1].setAttribute('cy',y2);svg.style.display='block';
}
function adjustWidth(width){const max=Math.max(340,Math.min(680,window.innerWidth-420));const actual=Math.min(max,Math.max(340,width));$('workspace').style.setProperty('--rv-doc-width',actual+'px');$('splitter').setAttribute('aria-valuemax',max);$('splitter').setAttribute('aria-valuenow',Math.round(actual));scheduleLine();}
$('splitter').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();$('splitter').setPointerCapture(e.pointerId);document.body.classList.add('rv-resizing');});
$('splitter').addEventListener('pointermove',e=>{if($('splitter').hasPointerCapture(e.pointerId))adjustWidth(window.innerWidth-e.clientX);});
function stopResize(){document.body.classList.remove('rv-resizing');}
$('splitter').addEventListener('pointerup',stopResize);$('splitter').addEventListener('lostpointercapture',stopResize);$('splitter').addEventListener('dblclick',()=>adjustWidth(440));
$('splitter').addEventListener('keydown',e=>{const width=Number($('splitter').getAttribute('aria-valuenow'));if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();adjustWidth(width+(e.key==='ArrowLeft'?20:-20));}if(e.key==='Home'){e.preventDefault();adjustWidth(440);}});
document.title=reviewData.title;
$('review-title').textContent=reviewData.title;$('review-sub').textContent=reviewData.version+' · 点击原型查阅需求 · 支持研发与测试查阅';
$('end-nav').addEventListener('click',e=>{if(e.target.closest('#document-tab')){enterDocument();return;}const b=e.target.closest('[data-end]');if(b){if(documentState.on)showReviewDocument(false);setScope(b.dataset.end,'all');}});
$('page-filter').addEventListener('change',e=>setScope(currentEnd,e.target.value));
$('search').addEventListener('input',renderDocs);$('clear-search').addEventListener('click',()=>{$('search').value='';renderDocs();$('search').focus();});
$('markers').addEventListener('change',e=>{document.body.classList.toggle('rv-no-markers',!e.target.checked);scheduleLine();});$('lines').addEventListener('change',scheduleLine);
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{lens=b.dataset.lens;document.body.classList.remove('rv-lens-qa','rv-lens-dev','rv-lens-frontend');if(lens!=='all')document.body.classList.add('rv-lens-'+lens);document.querySelectorAll('[data-lens]').forEach(btn=>btn.setAttribute('aria-pressed',btn===b));renderDocs();}));
$('req-jump').addEventListener('change',e=>{if(e.target.value)choose(e.target.value,'navigate',{keepSearch:true});});
function stepRequirement(delta){const rows=filteredRequirements(),index=rows.findIndex(r=>r.id===selectedId),next=index<0?(delta>0?0:rows.length-1):index+delta;if(rows[next])choose(rows[next].id,'navigate',{keepSearch:true});}
$('prev-req').addEventListener('click',()=>stepRequirement(-1));$('next-req').addEventListener('click',()=>stepRequirement(1));
$('requirements').addEventListener('click',e=>{if(e.target.closest('[data-clear]')){$('search').value='';renderDocs();}});
// 标注只查说明，不触发所在业务操作。业务按钮／输入框仍只执行本身操作，点击空白热点可定位需求。
$('canvas').addEventListener('click',e=>{
 const marker=e.target.closest('.rv-marker');if(marker){e.preventDefault();e.stopPropagation();choose(marker.closest('[data-req]').dataset.req,'canvas');return;}
 const hot=e.target.closest('[data-req]'),interactive=e.target.closest('button,input,select,textarea,label,a,[role="button"],[contenteditable="true"]');if(view==='review'&&hot&&!interactive)choose(hot.dataset.req,'canvas');
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 handleShotAction(b.dataset.action);
},true);
$('canvas').addEventListener('change',e=>{const key=e.target.dataset.shotKey;if(!key)return;changeDemoCondition(key,e.target.type==='checkbox'?e.target.checked:e.target.value);});
bindHover($('canvas'),'data-req');bindHover($('requirements'),'data-doc');
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.closest('input,textarea,select,[contenteditable="true"]')){e.preventDefault();if(documentState.on)$('md-search').focus();else{setView('review');$('search').focus();if(narrow())$('search').scrollIntoView({block:'center'});}}if(e.key==='Escape'&&e.target===$('search')){$('search').value='';renderDocs();$('search').blur();}});
$('reset').addEventListener('click',()=>{clearShareCard();Object.assign(shot,initialShot());setScope('rider','all');notify('已重置演示');});
document.addEventListener('scroll',scheduleLine,true);document.addEventListener('toggle',scheduleLine,true);window.addEventListener('resize',()=>{adjustWidth(Number($('splitter').getAttribute('aria-valuenow')));scheduleLine();});new ResizeObserver(scheduleLine).observe($('workspace'));
window.addEventListener('hashchange',applyHash);window.addEventListener('popstate',applyHash);
bindDocumentControls();renderNav();renderCanvas();renderDocs();adjustWidth(440);applyHash();

</script>
