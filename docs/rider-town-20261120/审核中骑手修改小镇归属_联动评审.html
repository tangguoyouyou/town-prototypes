      "id": "end-admin",
      "name": "总后台 · 完整需求",
      "hint": "按端整理；本端共用规则引用请结合完整PRD中对应端与功能查阅。",
      "requirementIds": [

      "end": "admin",
      "markdown": "# 审核中骑手修改小镇归属\n\n版本：V1.0\n\n## 公共说明\n\n创建／修改：2026-11-20；适用端：总后台、用户端、骑手 APP、运营商 PC、运营商 APP；\n\n需求背景：待审核骑手也需要调整小镇归属，并避免运营商或骑手在归属已变更后继续按旧归属操作。\n\n本次改动：\n\n* 总后台对用户端申请、骑手 APP 已实名认证的待审核骑手提供【分配小镇】；APP 未提交资质的申请支持直接注销，注销后可重新申请。\n* 按申请来源同步归属，用户端同步显示新小镇及客服电话；审核通过后使用新归属。\n* 运营商 PC／APP 审核增加归属校验；骑手 APP 注销保持现有逻辑，仅提示；总后台注销账号后，APP 原界面后续操作提示登录过期。\n\n列表展示：总后台骑手申请／骑手管理、运营商 PC／APP 骑手列表中的骑手手机号暂不脱敏，完整展示手机号。\n\n来源说明：本需求中的“骑手 APP 注册来源”包括“骑手APP注册”和“骑手APP支付宝绑定”，两种来源处理一致。\n\n## 总后台\n\n### 后端调整\n\n#### 待审核骑手分配小镇\n\n所属端：总后台；页面：骑手申请\n\n用户端申请或骑手 APP 已实名认证的待审核骑手可修改归属。\n\n**处理规则**\n\n- 待审核骑手中，来源为“用户端申请”，或属于骑手 APP 注册来源/骑手APP支付宝绑定来源且已完成实名认证的骑手，允许修改小镇归属；操作权限沿用现有规则，可选择全部小镇；只有二次确认后才修改归属，取消不修改。修改成功后，“申请小镇”更新，状态仍为待审核。\n- 来源为“用户端申请”：同步调整该骑手申请的归属；用户端待审核详情中的“申请入职的小镇”及下方“小镇客服电话”均更新为新小镇对应信息。\n- 骑手 APP 注册来源：同步调整该骑手在申请中的小镇归属；审核通过时，使用修改后的归属，不恢复为原申请小镇。\n- 各申请来源的骑手审核通过后，正式骑手归属均以修改后的新小镇为准。\n\n\n#### 未提交资质的 APP 申请注销\n\n所属端：总后台；页面：骑手申请\n\n总后台确认注销未提交资质的 APP 申请账号，允许重新申请。\n\n**处理规则**\n\n- 待审核骑手属于骑手 APP 注册来源/骑手APP支付宝绑定来源且未提交资质信息时，总后台【骑手申请】列表可注销该骑手账号；二次确认后才执行注销，取消不注销。\n- 注销成功后，该账号不可登录骑手APP，本次申请结束；已登录骑手的后续操作按骑手 APP「账号状态与注销校验」处理。骑手可以使用原手机号重新申请，不因原账号已申请而被拦截。\n\n\n\n### 前端 UI 调整\n\n#### 待审核骑手分配小镇\n\n所属端：总后台；页面：骑手申请\n\n用户端申请或骑手 APP 已实名认证的待审核骑手可修改归属。\n\n**入口、展示与操作**\n\n- 总后台骑手管理页签顺序：骑手管理、骑手申请、骑手资金管理、保险管理；【骑手申请】紧随【骑手管理】。\n- 入口：总后台 → 小镇管理 → 骑手管理 → 骑手申请。符合改镇条件的待审核记录显示【分配小镇】，点击打开【选择小镇】弹窗。\n- 弹窗默认展示全部小镇，字段为ID、小镇名称、所属区域、操作；数据量较多时分页展示。输入小镇名称可模糊查询，点击【查询】展示匹配结果；点击【重置】清空条件并恢复全部小镇。\n- 每行提供【选择】。点击后弹出二次确认：“是否将骑手从【原小镇名称】更换到【目标小镇名称】？”原小镇取骑手当前归属，目标小镇取所选行。\n- 点击【确认】后执行更换，成功提示“操作成功”，关闭弹窗并更新列表；点击【取消】只关闭二次确认弹窗，不修改归属。选择小镇弹窗右上角【关闭】退出本次操作。\n\n\n#### 审核通过后的归属展示\n\n所属端：总后台；页面：骑手管理\n\n审核通过后，骑手管理显示修改后的所属小镇。\n\n**入口、展示与操作**\n\n- 总后台【骑手管理】列表的“所属小镇”显示修改后的新小镇；【分配小镇】沿用总后台「待审核骑手分配小镇」的选择列表及二次确认交互。\n\n\n#### 未提交资质的 APP 申请注销\n\n所属端：总后台；页面：骑手申请\n\n总后台确认注销未提交资质的 APP 申请账号，允许重新申请。\n\n**入口、展示与操作**\n\n- 未提交资质的 APP 申请在操作列显示【注销】；未提交资质的骑手没有【分配小镇】操作。点击【注销】弹出二次确认：“是否注销【骑手手机号】骑手账号，注销之后骑手不可登录APP？”其中手机号完整展示，替换为当前行的实际手机号。\n- 弹窗提供【确定】【取消】。点击【确定】执行注销，成功后提示“注销成功”，关闭弹窗并刷新列表；点击【取消】关闭弹窗，不注销账号，不改变本次申请。\n\n\n\n### 测试要点\n\n- 符合条件的待审核骑手改镇 → 查询、选择及二次确认有效，取消不修改；状态仍为待审核，两种来源审核通过后使用新归属。未提交资质账号 → 注销取消保留，确定后不可登录原账号，原手机号可重新申请。\n- “骑手APP注册”“骑手APP支付宝绑定”分别核对 → 已实名认证可改镇，未提交资质可经二次确认注销，注销后原登录失效且可重新申请，处理一致。\n"
    },

  "documentMarkdown": "# 审核中骑手修改小镇归属\n\n版本：V1.0\n\n## 公共说明\n\n创建／修改：2026-11-20；适用端：总后台、用户端、骑手 APP、运营商 PC、运营商 APP；\n\n需求背景：待审核骑手也需要调整小镇归属，并避免运营商或骑手在归属已变更后继续按旧归属操作。\n\n本次改动：\n\n* 总后台对用户端申请、骑手 APP 已实名认证的待审核骑手提供【分配小镇】；APP 未提交资质的申请支持直接注销，注销后可重新申请。\n* 按申请来源同步归属，用户端同步显示新小镇及客服电话；审核通过后使用新归属。\n* 运营商 PC／APP 审核增加归属校验；骑手 APP 注销保持现有逻辑，仅提示；总后台注销账号后，APP 原界面后续操作提示登录过期。\n\n列表展示：总后台骑手申请／骑手管理、运营商 PC／APP 骑手列表中的骑手手机号暂不脱敏，完整展示手机号。\n\n来源说明：本需求中的“骑手 APP 注册来源”包括“骑手APP注册”和“骑手APP支付宝绑定”，两种来源处理一致。\n\n## 总后台\n\n### 后端调整\n\n#### 待审核骑手分配小镇\n\n所属端：总后台；页面：骑手申请\n\n用户端申请或骑手 APP 已实名认证的待审核骑手可修改归属。\n\n**处理规则**\n\n- 待审核骑手中，来源为“用户端申请”，或属于骑手 APP 注册来源/骑手APP支付宝绑定来源且已完成实名认证的骑手，允许修改小镇归属；操作权限沿用现有规则，可选择全部小镇；只有二次确认后才修改归属，取消不修改。修改成功后，“申请小镇”更新，状态仍为待审核。\n- 来源为“用户端申请”：同步调整该骑手申请的归属；用户端待审核详情中的“申请入职的小镇”及下方“小镇客服电话”均更新为新小镇对应信息。\n- 骑手 APP 注册来源：同步调整该骑手在申请中的小镇归属；审核通过时，使用修改后的归属，不恢复为原申请小镇。\n- 各申请来源的骑手审核通过后，正式骑手归属均以修改后的新小镇为准。\n\n\n#### 未提交资质的 APP 申请注销\n\n所属端：总后台；页面：骑手申请\n\n总后台确认注销未提交资质的 APP 申请账号，允许重新申请。\n\n**处理规则**\n\n- 待审核骑手属于骑手 APP 注册来源/骑手APP支付宝绑定来源且未提交资质信息时，总后台【骑手申请】列表可注销该骑手账号；二次确认后才执行注销，取消不注销。\n- 注销成功后，该账号不可登录骑手APP，本次申请结束；已登录骑手的后续操作按骑手 APP「账号状态与注销校验」处理。骑手可以使用原手机号重新申请，不因原账号已申请而被拦截。\n\n\n\n### 前端 UI 调整\n\n#### 待审核骑手分配小镇\n\n所属端：总后台；页面：骑手申请\n\n用户端申请或骑手 APP 已实名认证的待审核骑手可修改归属。\n\n**入口、展示与操作**\n\n- 总后台骑手管理页签顺序：骑手管理、骑手申请、骑手资金管理、保险管理；【骑手申请】紧随【骑手管理】。\n- 入口：总后台 → 小镇管理 → 骑手管理 → 骑手申请。符合改镇条件的待审核记录显示【分配小镇】，点击打开【选择小镇】弹窗。\n- 弹窗默认展示全部小镇，字段为ID、小镇名称、所属区域、操作；数据量较多时分页展示。输入小镇名称可模糊查询，点击【查询】展示匹配结果；点击【重置】清空条件并恢复全部小镇。\n- 每行提供【选择】。点击后弹出二次确认：“是否将骑手从【原小镇名称】更换到【目标小镇名称】？”原小镇取骑手当前归属，目标小镇取所选行。\n- 点击【确认】后执行更换，成功提示“操作成功”，关闭弹窗并更新列表；点击【取消】只关闭二次确认弹窗，不修改归属。选择小镇弹窗右上角【关闭】退出本次操作。\n\n\n#### 审核通过后的归属展示\n\n所属端：总后台；页面：骑手管理\n\n审核通过后，骑手管理显示修改后的所属小镇。\n\n**入口、展示与操作**\n\n- 总后台【骑手管理】列表的“所属小镇”显示修改后的新小镇；【分配小镇】沿用总后台「待审核骑手分配小镇」的选择列表及二次确认交互。\n\n\n#### 未提交资质的 APP 申请注销\n\n所属端：总后台；页面：骑手申请\n\n总后台确认注销未提交资质的 APP 申请账号，允许重新申请。\n\n**入口、展示与操作**\n\n- 未提交资质的 APP 申请在操作列显示【注销】；未提交资质的骑手没有【分配小镇】操作。点击【注销】弹出二次确认：“是否注销【骑手手机号】骑手账号，注销之后骑手不可登录APP？”其中手机号完整展示，替换为当前行的实际手机号。\n- 弹窗提供【确定】【取消】。点击【确定】执行注销，成功后提示“注销成功”，关闭弹窗并刷新列表；点击【取消】关闭弹窗，不注销账号，不改变本次申请。\n\n\n\n### 测试要点\n\n- 符合条件的待审核骑手改镇 → 查询、选择及二次确认有效，取消不修改；状态仍为待审核，两种来源审核通过后使用新归属。未提交资质账号 → 注销取消保留，确定后不可登录原账号，原手机号可重新申请。\n- “骑手APP注册”“骑手APP支付宝绑定”分别核对 → 已实名认证可改镇，未提交资质可经二次确认注销，注销后原登录失效且可重新申请，处理一致。\n\n## 用户端\n\n### 前端 UI 调整\n\n#### 用户端申请小镇展示\n\n所属端：用户端；页面：申请骑手 · 待审核\n\n用户端申请的骑手看到新的申请小镇。\n\n**入口、展示与操作**\n\n- 沿用总后台「待审核骑手分配小镇」的归属更新规则。用户端 → 申请骑手 → 待审核详情：重新进入或刷新页面后，“申请入职的小镇”和下方“小镇客服电话”显示新小镇对应信息。\n- 页面继续显示“待审核...”；姓名、联系电话和撤回申请等已有展示与操作沿用原规则。\n\n\n\n### 测试要点\n\n- 用户端申请改镇 → 重新进入或刷新后，小镇名称和客服电话同步更新。\n\n## 骑手 APP\n\n### 后端调整\n\n#### 骑手 APP 账号状态与注销校验\n\n所属端：骑手 APP；页面：注销账户\n\n后台注销后操作提示登录过期；账号有效时注销为假的操作，仅提示。\n\n**处理规则**\n\n- 总后台按「未提交资质的 APP 申请注销」规则注销成功后，骑手原登录状态失效。若仍停留在 APP 原界面，点击其他操作按钮时阻止本次操作，提示“您的账号登录过期，请重新登录”。\n- 账号已注销时，点击【注销账户】同样按登录失效处理，不提示小镇归属变更；刷新页面或使用原手机号重新申请，不恢复原登录状态。\n- 账号仍有效、仅小镇归属变更时，操作【注销账户】，保持现有逻辑，提示：注销信息已提交，相关人员将在1~2个工作日进行处理，请勿重复提交！\n\n\n\n### 前端 UI 调整\n\n#### 骑手 APP 审核中页面\n\n所属端：骑手 APP；页面：完善信息 · 审核中\n\n申请归属调整后，保持现有审核中提示。\n\n**入口、展示与操作**\n\n- 骑手 APP 注册来源：后台修改申请归属后，页面保持“通过实名认证，等待审核中”的现有提示。\n- 审核通过后的归属沿用总后台「待审核骑手分配小镇」规则，骑手端已有归属展示位置显示新小镇。\n\n\n#### 骑手 APP 账号状态与注销校验\n\n所属端：骑手 APP；页面：注销账户\n\n后台注销后操作提示登录过期；账号有效时注销为假的操作，仅提示。\n\n**入口、展示与操作**\n\n- 骑手停留在 APP 原界面时，点击消息通知、帮助中心等其他按钮，以及【注销账户】，均按本端「骑手 APP 账号状态与注销校验」展示对应提示；账号已被总后台注销时显示登录过期提示，不展示注销成功或归属变更提示。\n- 账号有效时，侧边菜单 →【注销账户】为假的操作，仅提示。\n\n\n\n### 测试要点\n\n- 已实名申请改镇 → 审核中提示保留，通过后展示新归属；账号有效时点击注销 → 仅显示指定提示，不执行实际注销，小镇归属变更不影响该提示。\n- 总后台注销确认前或取消 → APP 原操作不受影响；确定注销后，停留原界面点击其他按钮或注销 → 提示“您的账号登录过期，请重新登录”，阻止操作；刷新或原手机号重新申请后，原登录状态仍失效。\n\n## 运营商 PC\n\n### 后端调整\n\n#### 运营商审核归属校验\n\n所属端：运营商 PC；页面：骑手审核\n\n运营商只能审核当前仍归属本小镇的骑手。\n\n**处理规则**\n\n- 运营商 PC 和运营商 APP 审核骑手时，均需校验骑手当前是否仍归属本次操作的小镇；\n- 如果骑手已不归属本小镇，阻止本次审核，提示“骑手小镇归属变更，请刷新后重试”，不改变骑手审核状态；\n- 刷新后按当前小镇归属重新展示骑手列表；仍归属本小镇的骑手沿用原有审核规则。\n\n\n\n### 前端 UI 调整\n\n#### 运营商审核归属校验\n\n所属端：运营商 PC；页面：骑手审核\n\n运营商只能审核当前仍归属本小镇的骑手。\n\n**入口、展示与操作**\n\n- 入口：运营商 PC → 配送管理 → 骑手管理 → 骑手审核。归属校验失败时展示本端「运营商审核归属校验」规定的提示；刷新后，已不归属本小镇的骑手不再显示。\n\n\n\n### 测试要点\n\n- 骑手在审核期间移出本镇 → 通过、拒绝均被阻止并按本端规则提示，审核状态不变；刷新后移出本镇列表。\n\n## 运营商 APP\n\n### 后端调整\n\n#### 运营商 APP 审核提示\n\n所属端：运营商 APP；页面：待审核骑手\n\n运营商 APP 使用相同归属校验和提示。\n\n**处理规则**\n\n- 沿用运营商 PC「运营商审核归属校验」规则，不重复定义校验条件及处理结果。\n\n\n\n### 前端 UI 调整\n\n#### 运营商 APP 审核提示\n\n所属端：运营商 APP；页面：待审核骑手\n\n运营商 APP 使用相同归属校验和提示。\n\n**入口、展示与操作**\n\n- 入口：运营商 APP → 骑手管理 → 待审核。归属变更提示及刷新后不显示对应骑手的处理，沿用运营商 PC「运营商审核归属校验」规则。\n\n\n\n### 测试要点\n\n- 按运营商 PC「运营商审核归属校验」测试要点核对本端：归属变更时提示一致，刷新后对应骑手不再显示。\n",

    "backend": "# 审核中骑手修改小镇归属\n\n版本：V1.0\n\n## 公共说明\n\n创建／修改：2026-11-20；适用端：总后台、用户端、骑手 APP、运营商 PC、运营商 APP；\n\n需求背景：待审核骑手也需要调整小镇归属，并避免运营商或骑手在归属已变更后继续按旧归属操作。\n\n本次改动：\n\n* 总后台对用户端申请、骑手 APP 已实名认证的待审核骑手提供【分配小镇】；APP 未提交资质的申请支持直接注销，注销后可重新申请。\n* 按申请来源同步归属，用户端同步显示新小镇及客服电话；审核通过后使用新归属。\n* 运营商 PC／APP 审核增加归属校验；骑手 APP 注销保持现有逻辑，仅提示；总后台注销账号后，APP 原界面后续操作提示登录过期。\n\n列表展示：总后台骑手申请／骑手管理、运营商 PC／APP 骑手列表中的骑手手机号暂不脱敏，完整展示手机号。\n\n来源说明：本需求中的“骑手 APP 注册来源”包括“骑手APP注册”和“骑手APP支付宝绑定”，两种来源处理一致。\n\n## 总后台\n\n### 后端调整\n\n#### 待审核骑手分配小镇\n\n所属端：总后台；页面：骑手申请\n\n用户端申请或骑手 APP 已实名认证的待审核骑手可修改归属。\n\n**处理规则**\n\n- 待审核骑手中，来源为“用户端申请”，或属于骑手 APP 注册来源/骑手APP支付宝绑定来源且已完成实名认证的骑手，允许修改小镇归属；操作权限沿用现有规则，可选择全部小镇；只有二次确认后才修改归属，取消不修改。修改成功后，“申请小镇”更新，状态仍为待审核。\n- 来源为“用户端申请”：同步调整该骑手申请的归属；用户端待审核详情中的“申请入职的小镇”及下方“小镇客服电话”均更新为新小镇对应信息。\n- 骑手 APP 注册来源：同步调整该骑手在申请中的小镇归属；审核通过时，使用修改后的归属，不恢复为原申请小镇。\n- 各申请来源的骑手审核通过后，正式骑手归属均以修改后的新小镇为准。\n\n\n#### 未提交资质的 APP 申请注销\n\n所属端：总后台；页面：骑手申请\n\n总后台确认注销未提交资质的 APP 申请账号，允许重新申请。\n\n**处理规则**\n\n- 待审核骑手属于骑手 APP 注册来源/骑手APP支付宝绑定来源且未提交资质信息时，总后台【骑手申请】列表可注销该骑手账号；二次确认后才执行注销，取消不注销。\n- 注销成功后，该账号不可登录骑手APP，本次申请结束；已登录骑手的后续操作按骑手 APP「账号状态与注销校验」处理。骑手可以使用原手机号重新申请，不因原账号已申请而被拦截。\n\n\n\n### 测试要点\n\n- 符合条件的待审核骑手改镇 → 查询、选择及二次确认有效，取消不修改；状态仍为待审核，两种来源审核通过后使用新归属。未提交资质账号 → 注销取消保留，确定后不可登录原账号，原手机号可重新申请。\n- “骑手APP注册”“骑手APP支付宝绑定”分别核对 → 已实名认证可改镇，未提交资质可经二次确认注销，注销后原登录失效且可重新申请，处理一致。\n\n## 用户端\n\n### 测试要点\n\n- 用户端申请改镇 → 重新进入或刷新后，小镇名称和客服电话同步更新。\n\n## 骑手 APP\n\n### 后端调整\n\n#### 骑手 APP 账号状态与注销校验\n\n所属端：骑手 APP；页面：注销账户\n\n后台注销后操作提示登录过期；账号有效时注销为假的操作，仅提示。\n\n**处理规则**\n\n- 总后台按「未提交资质的 APP 申请注销」规则注销成功后，骑手原登录状态失效。若仍停留在 APP 原界面，点击其他操作按钮时阻止本次操作，提示“您的账号登录过期，请重新登录”。\n- 账号已注销时，点击【注销账户】同样按登录失效处理，不提示小镇归属变更；刷新页面或使用原手机号重新申请，不恢复原登录状态。\n- 账号仍有效、仅小镇归属变更时，操作【注销账户】，保持现有逻辑，提示：注销信息已提交，相关人员将在1~2个工作日进行处理，请勿重复提交！\n\n\n\n### 测试要点\n\n- 已实名申请改镇 → 审核中提示保留，通过后展示新归属；账号有效时点击注销 → 仅显示指定提示，不执行实际注销，小镇归属变更不影响该提示。\n- 总后台注销确认前或取消 → APP 原操作不受影响；确定注销后，停留原界面点击其他按钮或注销 → 提示“您的账号登录过期，请重新登录”，阻止操作；刷新或原手机号重新申请后，原登录状态仍失效。\n\n## 运营商 PC\n\n### 后端调整\n\n#### 运营商审核归属校验\n\n所属端：运营商 PC；页面：骑手审核\n\n运营商只能审核当前仍归属本小镇的骑手。\n\n**处理规则**\n\n- 运营商 PC 和运营商 APP 审核骑手时，均需校验骑手当前是否仍归属本次操作的小镇；\n- 如果骑手已不归属本小镇，阻止本次审核，提示“骑手小镇归属变更，请刷新后重试”，不改变骑手审核状态；\n- 刷新后按当前小镇归属重新展示骑手列表；仍归属本小镇的骑手沿用原有审核规则。\n\n\n\n### 测试要点\n\n- 骑手在审核期间移出本镇 → 通过、拒绝均被阻止并按本端规则提示，审核状态不变；刷新后移出本镇列表。\n\n## 运营商 APP\n\n### 后端调整\n\n#### 运营商 APP 审核提示\n\n所属端：运营商 APP；页面：待审核骑手\n\n运营商 APP 使用相同归属校验和提示。\n\n**处理规则**\n\n- 沿用运营商 PC「运营商审核归属校验」规则，不重复定义校验条件及处理结果。\n\n\n\n### 测试要点\n\n- 按运营商 PC「运营商审核归属校验」测试要点核对本端：归属变更时提示一致，刷新后对应骑手不再显示。\n",
    "frontend": "# 审核中骑手修改小镇归属\n\n版本：V1.0\n\n## 公共说明\n\n创建／修改：2026-11-20；适用端：总后台、用户端、骑手 APP、运营商 PC、运营商 APP；\n\n需求背景：待审核骑手也需要调整小镇归属，并避免运营商或骑手在归属已变更后继续按旧归属操作。\n\n本次改动：\n\n* 总后台对用户端申请、骑手 APP 已实名认证的待审核骑手提供【分配小镇】；APP 未提交资质的申请支持直接注销，注销后可重新申请。\n* 按申请来源同步归属，用户端同步显示新小镇及客服电话；审核通过后使用新归属。\n* 运营商 PC／APP 审核增加归属校验；骑手 APP 注销保持现有逻辑，仅提示；总后台注销账号后，APP 原界面后续操作提示登录过期。\n\n列表展示：总后台骑手申请／骑手管理、运营商 PC／APP 骑手列表中的骑手手机号暂不脱敏，完整展示手机号。\n\n来源说明：本需求中的“骑手 APP 注册来源”包括“骑手APP注册”和“骑手APP支付宝绑定”，两种来源处理一致。\n\n## 总后台\n\n### 前端 UI 调整\n\n#### 待审核骑手分配小镇\n\n所属端：总后台；页面：骑手申请\n\n用户端申请或骑手 APP 已实名认证的待审核骑手可修改归属。\n\n**入口、展示与操作**\n\n- 总后台骑手管理页签顺序：骑手管理、骑手申请、骑手资金管理、保险管理；【骑手申请】紧随【骑手管理】。\n- 入口：总后台 → 小镇管理 → 骑手管理 → 骑手申请。符合改镇条件的待审核记录显示【分配小镇】，点击打开【选择小镇】弹窗。\n- 弹窗默认展示全部小镇，字段为ID、小镇名称、所属区域、操作；数据量较多时分页展示。输入小镇名称可模糊查询，点击【查询】展示匹配结果；点击【重置】清空条件并恢复全部小镇。\n- 每行提供【选择】。点击后弹出二次确认：“是否将骑手从【原小镇名称】更换到【目标小镇名称】？”原小镇取骑手当前归属，目标小镇取所选行。\n- 点击【确认】后执行更换，成功提示“操作成功”，关闭弹窗并更新列表；点击【取消】只关闭二次确认弹窗，不修改归属。选择小镇弹窗右上角【关闭】退出本次操作。\n\n\n#### 审核通过后的归属展示\n\n所属端：总后台；页面：骑手管理\n\n审核通过后，骑手管理显示修改后的所属小镇。\n\n**入口、展示与操作**\n\n- 总后台【骑手管理】列表的“所属小镇”显示修改后的新小镇；【分配小镇】沿用总后台「待审核骑手分配小镇」的选择列表及二次确认交互。\n\n\n#### 未提交资质的 APP 申请注销\n\n所属端：总后台；页面：骑手申请\n\n总后台确认注销未提交资质的 APP 申请账号，允许重新申请。\n\n**入口、展示与操作**\n\n- 未提交资质的 APP 申请在操作列显示【注销】；未提交资质的骑手没有【分配小镇】操作。点击【注销】弹出二次确认：“是否注销【骑手手机号】骑手账号，注销之后骑手不可登录APP？”其中手机号完整展示，替换为当前行的实际手机号。\n- 弹窗提供【确定】【取消】。点击【确定】执行注销，成功后提示“注销成功”，关闭弹窗并刷新列表；点击【取消】关闭弹窗，不注销账号，不改变本次申请。\n\n\n\n### 测试要点\n\n- 符合条件的待审核骑手改镇 → 查询、选择及二次确认有效，取消不修改；状态仍为待审核，两种来源审核通过后使用新归属。未提交资质账号 → 注销取消保留，确定后不可登录原账号，原手机号可重新申请。\n- “骑手APP注册”“骑手APP支付宝绑定”分别核对 → 已实名认证可改镇，未提交资质可经二次确认注销，注销后原登录失效且可重新申请，处理一致。\n\n## 用户端\n\n### 前端 UI 调整\n\n#### 用户端申请小镇展示\n\n所属端：用户端；页面：申请骑手 · 待审核\n\n用户端申请的骑手看到新的申请小镇。\n\n**入口、展示与操作**\n\n- 沿用总后台「待审核骑手分配小镇」的归属更新规则。用户端 → 申请骑手 → 待审核详情：重新进入或刷新页面后，“申请入职的小镇”和下方“小镇客服电话”显示新小镇对应信息。\n- 页面继续显示“待审核...”；姓名、联系电话和撤回申请等已有展示与操作沿用原规则。\n\n\n\n### 测试要点\n\n- 用户端申请改镇 → 重新进入或刷新后，小镇名称和客服电话同步更新。\n\n## 骑手 APP\n\n### 前端 UI 调整\n\n#### 骑手 APP 审核中页面\n\n所属端：骑手 APP；页面：完善信息 · 审核中\n\n申请归属调整后，保持现有审核中提示。\n\n**入口、展示与操作**\n\n- 骑手 APP 注册来源：后台修改申请归属后，页面保持“通过实名认证，等待审核中”的现有提示。\n- 审核通过后的归属沿用总后台「待审核骑手分配小镇」规则，骑手端已有归属展示位置显示新小镇。\n\n\n#### 骑手 APP 账号状态与注销校验\n\n所属端：骑手 APP；页面：注销账户\n\n后台注销后操作提示登录过期；账号有效时注销为假的操作，仅提示。\n\n**入口、展示与操作**\n\n- 骑手停留在 APP 原界面时，点击消息通知、帮助中心等其他按钮，以及【注销账户】，均按本端「骑手 APP 账号状态与注销校验」展示对应提示；账号已被总后台注销时显示登录过期提示，不展示注销成功或归属变更提示。\n- 账号有效时，侧边菜单 →【注销账户】为假的操作，仅提示。\n\n\n\n### 测试要点\n\n- 已实名申请改镇 → 审核中提示保留，通过后展示新归属；账号有效时点击注销 → 仅显示指定提示，不执行实际注销，小镇归属变更不影响该提示。\n- 总后台注销确认前或取消 → APP 原操作不受影响；确定注销后，停留原界面点击其他按钮或注销 → 提示“您的账号登录过期，请重新登录”，阻止操作；刷新或原手机号重新申请后，原登录状态仍失效。\n\n## 运营商 PC\n\n### 前端 UI 调整\n\n#### 运营商审核归属校验\n\n所属端：运营商 PC；页面：骑手审核\n\n运营商只能审核当前仍归属本小镇的骑手。\n\n**入口、展示与操作**\n\n- 入口：运营商 PC → 配送管理 → 骑手管理 → 骑手审核。归属校验失败时展示本端「运营商审核归属校验」规定的提示；刷新后，已不归属本小镇的骑手不再显示。\n\n\n\n### 测试要点\n\n- 骑手在审核期间移出本镇 → 通过、拒绝均被阻止并按本端规则提示，审核状态不变；刷新后移出本镇列表。\n\n## 运营商 APP\n\n### 前端 UI 调整\n\n#### 运营商 APP 审核提示\n\n所属端：运营商 APP；页面：待审核骑手\n\n运营商 APP 使用相同归属校验和提示。\n\n**入口、展示与操作**\n\n- 入口：运营商 APP → 骑手管理 → 待审核。归属变更提示及刷新后不显示对应骑手的处理，沿用运营商 PC「运营商审核归属校验」规则。\n\n\n\n### 测试要点\n\n- 按运营商 PC「运营商审核归属校验」测试要点核对本端：归属变更时提示一致，刷新后对应骑手不再显示。\n"
  }

ame)}（${esc(rider.source)}）账号已注销，可使用原手机号重新申请。</p><button data-action="demo-reapply" data-id="${id}">${id==='unqualified'?'模拟原手机号重新申请':'模拟支付宝绑定手机号重新申请'}</button>`;}).join('')}`:''}</div>`;

const ReviewDocument=(()=>{
 const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function safeHref(href){
  if(!href||/[\u0000-\u001f\u007f\\]/.test(href)||/^(?:\/\/|\/)/.test(href))return false;
  if(/^[a-z][a-z0-9+.-]*:/i.test(href))return /^https?:\/\/[^\s]+$/i.test(href);
  return true;
 }
 function inline(text){
  const token=/\x60([^\x60]+)\x60|\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*/g;
  let out='',last=0;
  for(const m of text.matchAll(token)){
   out+=escape(text.slice(last,m.index));
   if(m[1]!==undefined)out+='<code>'+escape(m[1])+'</code>';
   else if(m[2]!==undefined){const href=m[3].trim();out+=safeHref(href)?'<a href="'+escape(href)+'"'+(/^https?:/i.test(href)?' target="_blank" rel="noopener"':'')+'>'+escape(m[2])+'</a>':escape(m[2]);}
   else out+='<strong>'+escape(m[4])+'</strong>';
   last=m.index+m[0].length;
  }
  return out+escape(text.slice(last));
 }
 function slug(text){return text.toLowerCase().replace(/[\x60*_]/g,'').replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s+/g,'-');}
 function render(md){
  const lines=md.replace(/\r/g,'').split('\n'),seen=new Map();let out='',code=false,block=[],list='';
  const close=()=>{if(list){out+='</'+list+'>';list='';}};
  for(let i=0;i<lines.length;i++){
   const line=lines[i];if(line.startsWith('\x60\x60\x60')){close();if(code){out+='<pre><code>'+escape(block.join('\n'))+'</code></pre>';block=[];}code=!code;continue;}
   if(code){block.push(line);continue;}
   if(!line.trim()){close();continue;}
   if(/^\|/.test(line)&&/^\|\s*:?-+/.test(lines[i+1]||'')){
    close();const cells=t=>t.replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
    out+='<div class="md-table"><table><thead><tr>'+cells(line).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i++;
    while(/^\|/.test(lines[i+1]||'')){out+='<tr>'+cells(lines[++i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';}out+='</tbody></table></div>';continue;
   }
   const h=line.match(/^(#{1,6})\s+(.+)/);if(h){close();const base=slug(h[2]),n=seen.get(base)||0;seen.set(base,n+1);out+='<h'+h[1].length+' data-md-anchor="'+escape(base+(n?'-'+n:''))+'">'+inline(h[2])+'</h'+h[1].length+'>';continue;}
   const item=line.match(/^(?:([-*]) |(\d+)\. )(.+)/);
   if(item){const type=item[2]?'ol':'ul';if(list!==type){close();list=type;out+='<'+type+(item[2]?' start="'+Number(item[2])+'"':'')+'>';}out+='<li>'+inline(item[3])+'</li>';continue;}
   close();out+=(line.startsWith('> ')?'<blockquote>'+inline(line.slice(2))+'</blockquote>':'<p>'+inline(line)+'</p>');
  }
  close();if(code)out+='<pre><code>'+escape(block.join('\n'))+'</code></pre>';return out;
 }

function renderRequirement(r, endName, pageName, audience='all', level=2) {

  if(!part)return '';

  for(const [key,label] of [['rules','规则'],['exceptions','异常与边界'],['acceptance','关键验证']])
   if(part[key]?.length){const title=key==='rules'?(name==='后端功能规则'?'处理规则':name==='前端 UI 与交互'?'入口、展示与操作':name):label;out+=(audience==='all'?'**'+title+'**\n\n':heading(title,1))+list(part[key])+'\n';}

 };
 if((r.rules?.length||r.exceptions?.length||r.acceptance?.length))
  body+=section(legacy?'旧格式未分类，需结合全文确认':'共用规则',r);

 for(const c of r.cases||[])if(audience==='all'||!c.audience||c.audience==='all'||c.audience===audience)
  body+=heading('验证场景：'+c.name,1)+'前置条件：'+(c.precondition||'无额外条件')+'\n\n'+c.steps.map((s,i)=>(i+1)+'. '+s).join('\n')+'\n\n预期结果：'+c.expected+'\n\n';
 if(r.development?.length)body+=heading('共用研发说明',1)+list(r.development)+'\n';

 $('canvas').innerHTML=`<div class="rv-intro"><div><h2>${currentEnd==='all'?'全端功能评审':esc(endName(currentEnd))+' · 功能原型'}</h2><div class="rv-sub">操作按钮体验流程，点击橙色标注查阅需求</div></div><span class="rv-pill">${pages.length} 个页面分组</span></div>`+pages.map(p=>`<section class="rv-section" id="page-${esc(p.id)}"><div class="rv-section-title"><span class="rv-square">${reviewData.pages.indexOf(p)+1}</span>${esc(endName(p.end))} · ${esc(p.name)}<span class="rv-path">${esc(p.path)}</span></div><div class="rv-stage ${reviewData.ends.find(e=>e.id===p.end)?.device==='mobile'?'mobile':''}">${pageMarkup[p.id]()}</div></section>`).join('');
 $('canvas').querySelectorAll('[data-req]').forEach(el=>{const r=reqById(el.dataset.req);if(!r)return;const marker=document.createElement('button');marker.type='button';marker.className='rv-marker';marker.textContent=String(reviewData.requirements.indexOf(r)+1);marker.setAttribute('aria-label','查看需求：'+r.title);marker.title='查看需求：'+r.title;el.append(marker);});
 $('canvas').scrollTop=scroll;highlight();
}
function roleSections(r){
 const legacy=r.legacyUnclassified??!(r.common||r.backend||r.frontend);
 const section=(name,part,role)=>{
  if(!part)return '';
  const body=[['rules','规则'],['exceptions','异常与边界'],['acceptance','关键验证']].filter(([key])=>part[key]?.length).map(([key,label])=>'<h3>'+label+'</h3>'+list(part[key])).join('');
  if(!body)return '';
  const open=role==='common'||lens==='all'||lens==='qa'||(role==='backend'&&lens==='dev')||role===lens;
  return '<details class="rv-role" '+(open?'open':'')+'><summary>'+name+'</summary>'+body+'</details>';
 };
 return section(legacy?'旧格式未分类，需结合全文确认':'共用规则',r,'common')+section('共用规则',r.common,'common')+section('后端功能规则',r.backend,'backend')+section('前端 UI 与交互',r.frontend,'frontend');
}
function list(values){return `<ul>${values.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;}
function casesMarkup(r){return (r.cases||[]).length?`<div class="rv-cases">${r.cases.map(c=>`<div class="rv-case"><b>${esc(c.name)}</b><p>前置条件：${esc(c.precondition||'无额外条件')}</p><p>操作步骤</p><ol>${(c.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p>预期结果：${esc(c.expected)}</p></div>`).join('')}</div>`:'';}
function renderDocs(){
 const scroll=$('doc-body').scrollTop,rows=filteredRequirements();
 const lensNote=lens==='qa'?'测试查阅：展开关键验证与场景。':lens==='dev'?'后端规则：展开业务内容，前端 UI 可按需展开。':lens==='frontend'?'前端 UI：展开界面交互，后端规则可按需展开。':'完整需求：公共说明、后端规则与前端 UI 分组查阅。';
 $('requirements').innerHTML=`<p class="rv-lens-note">${lensNote}</p>`+(rows.length?rows.map(r=>`<article class="rv-rule" id="req-${esc(r.id)}" data-doc="${esc(r.id)}"><h3 class="rv-rule-title"><span class="rv-rule-number">${reviewData.requirements.indexOf(r)+1}</span>${esc(r.title)}</h3><div class="rv-rule-meta">${esc(endName(r.end))} / ${esc(pageName(r.page))}</div><p>${esc(r.summary)}</p><div class="rv-rule-sections">${roleSections(r)}${r.cases?.length?`<details class="rv-acceptance" ${lens==='qa'?'open':''}><summary>验证场景（${r.cases.length}）</summary>${casesMarkup(r)}</details>`:''}${r.development?.length?`<details class="rv-development" ${lens==='dev'?'open':''}><summary>研发说明</summary>${list(r.development)}</details>`:''}</div>${r.locatable===false?'<div class="rv-rule-footer"><span class="rv-no-target">全局规则 · 无独立界面</span></div>':''}</article>`).join(''):'<div class="rv-empty">未找到匹配需求。<br><button type="button" data-clear>清除关键词</button></div>');
 $('shared').innerHTML=reviewData.shared.filter(s=>currentEnd==='all'||s.ends.includes(currentEnd)).map(s=>`<details class="rv-shared" open><summary>${esc(s.title)}</summary><p>${esc(s.text)}</p></details>`).join('');
 $('doc-body').scrollTop=scroll;updateNavigation();highlight();
}
function updateNavigation(){
 const rows=filteredRequirements(),index=rows.findIndex(r=>r.id===selectedId);
 $('doc-count').textContent=`${rows.length} / ${scopedRequirements().length} 条${index>=0?' · 当前 '+(index+1):''}`;
 $('req-jump').innerHTML='<option value="">跳转到需求…</option>'+rows.map(r=>`<option value="${esc(r.id)}">${esc(r.title)}</option>`).join('');$('req-jump').value=index>=0?selectedId:'';
 $('prev-req').disabled=!rows.length||index===0;$('next-req').disabled=!rows.length||index===rows.length-1;
 const r=reqById(selectedId);$('review-context').textContent=r?endName(r.end)+' / '+pageName(r.page)+' / '+r.title:'点击原型标注查看对应需求；目录与翻阅仅用于文档查阅。';
}
function highlight(){document.querySelectorAll('[data-req]').forEach(el=>{el.classList.toggle('rv-selected',el.dataset.req===selectedId);el.classList.toggle('rv-hover',el.dataset.req===hoverId);});document.querySelectorAll('[data-doc]').forEach(el=>{el.classList.toggle('selected',el.dataset.doc===selectedId);el.classList.toggle('rv-hover',el.dataset.doc===hoverId);});scheduleLine();}
function setView(value){view=value;document.body.classList.toggle('rv-prototype-only',view==='prototype');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));scheduleLine();}
function setScope(end,page,{push=true}={}){currentEnd=end;currentPage=page;selectedId='';hoverId='';$('search').value='';if(push)pushHash('#end='+encodeURIComponent(end)+(page==='all'?'':'&page='+encodeURIComponent(page)));renderNav();renderCanvas();renderDocs();$('canvas').scrollTop=0;$('doc-body').scrollTop=0;}
// 项目适配入口：仅在直接打开已有需求地址时进入必要状态。普通业务操作不会调用这里。
async function activateRequirement(req){if(req.state==='assign'&&!demo.editing)openTownPicker('user');}
function scrollTarget(container,target){if(!target)return;if(narrow()){target.scrollIntoView({behavior:motion(),block:'center'});return;}const rect=target.getBoundingClientRect(),bounds=container.getBoundingClientRect();container.scrollTo({top:container.scrollTop+rect.top-bounds.top-Math.max(16,(bounds.height-Math.min(rect.height,bounds.height-32))/2),behavior:motion()});}
function hotspotFor(id){return [...$('canvas').querySelectorAll('[data-req]')].find(el=>el.dataset.req===id);}
async function choose(id,source,{push=true,keepSearch=false}={}){
 const r=reqById(id);if(!r)return notify('未找到对应需求，请从端导航重新选择。');
 let rerender=false;if(currentEnd!=='all'&&currentEnd!==r.end){currentEnd=r.end;rerender=true;}if(currentPage!=='all'&&currentPage!==r.page){currentPage=r.page;rerender=true;}
 if(rerender){renderNav();renderCanvas();}if(!keepSearch&&$('search').value){$('search').value='';renderDocs();}
 if(!document.getElementById('req-'+id))renderDocs();selectedId=id;hoverId='';
 if(source==='link'&&r.locatable!==false){if(view==='prototype')setView('review');await activateRequirement(r);}
 const card=document.getElementById('req-'+id);card?.querySelector('.rv-acceptance')?.setAttribute('open','');highlight();updateNavigation();if(push)pushHash('#req='+encodeURIComponent(id));
 if(source==='link'&&r.locatable!==false){const target=hotspotFor(id);if(target)scrollTarget($('canvas'),target);else notify('该需求暂未提供可定位界面，请查阅右侧规则。');}
 if(source==='canvas'||source==='navigate'||source==='link'&&!narrow())scrollTarget($('doc-body'),card);
 scheduleLine();
}
async function applyHash(){const params=new URLSearchParams(location.hash.slice(1));if(params.has('document')){enterDocument(params.get('document'),{push:false});return;}if(documentState.on)showReviewDocument(false);if(params.has('req')){const r=reqById(params.get('req'));if(!r){notify('此需求链接已失效，可从端导航查看现有需求。');return;}currentEnd=r.end;currentPage=r.page;$('search').value='';renderNav();renderCanvas();renderDocs();await choose(r.id,'link',{push:false});}else if(params.has('end')){const end=params.get('end'),page=params.get('page')||'all';if((end==='all'||reviewData.ends.some(e=>e.id===end))&&(page==='all'||reviewData.pages.some(p=>p.id===page&&(end==='all'||p.end===end))))setScope(end,page,{push:false});else notify('此端或页面不存在，已保留当前评审页。');}else setScope('admin','applications',{push:false});}
function setHover(id){if(hoverId===id)return;hoverId=id;highlight();}
function bindHover(container,attribute){container.addEventListener('pointerover',e=>{const hot=e.target.closest('['+attribute+']');if(hot)setHover(hot.getAttribute(attribute));});container.addEventListener('pointerout',e=>{const hot=e.target.closest('['+attribute+']');if(hot&&!hot.contains(e.relatedTarget))setHover('');});container.addEventListener('focusin',e=>{const hot=e.target.closest('['+attribute+']');if(hot)setHover(hot.getAttribute(attribute));});container.addEventListener('focusout',e=>{if(!container.contains(e.relatedTarget))setHover('');});}
function scheduleLine(){if(lineFrame)return;lineFrame=requestAnimationFrame(()=>{lineFrame=0;drawLine();});}
function visibleIn(el,panel){const r=el.getBoundingClientRect(),p=panel.getBoundingClientRect();return r.width>0&&r.height>0&&r.right>p.left&&r.left<p.right&&r.bottom>p.top&&r.top<p.bottom;}
function drawLine(){
 const svg=$('review-lines');svg.style.display='none';if(documentState.on||narrow()||view!=='review'||!$('lines').checked)return;
 const id=hoverId||selectedId;if(!id)return;const card=document.getElementById('req-'+id),target=[...$('canvas').querySelectorAll('[data-req]')].find(el=>el.dataset.req===id&&visibleIn(el,$('canvas')));if(!card||!target||!visibleIn(card,$('doc-body')))return;
 const a=target.getBoundingClientRect(),b=card.getBoundingClientRect(),ca=$('canvas').getBoundingClientRect(),cb=$('doc-body').getBoundingClientRect();const x1=Math.min(a.right,ca.right-4),y1=Math.max(ca.top+8,Math.min(ca.bottom-8,a.top+a.height/2)),x2=b.left,y2=Math.max(cb.top+8,Math.min(cb.bottom-8,b.top+Math.min(b.height/2,70))),dx=Math.max(35,(x2-x1)/2);
 svg.querySelector('path').setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);const dots=svg.querySelectorAll('circle');dots[0].setAttribute('cx',x1);dots[0].setAttribute('cy',y1);dots[1].setAttribute('cx',x2);dots[1].setAttribute('cy',y2);svg.style.display='block';
}
function adjustWidth(width){const max=Math.max(340,Math.min(680,window.innerWidth-420));const actual=Math.min(max,Math.max(340,width));$('workspace').style.setProperty('--rv-doc-width',actual+'px');$('splitter').setAttribute('aria-valuemax',max);$('splitter').setAttribute('aria-valuenow',Math.round(actual));scheduleLine();}
$('splitter').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();$('splitter').setPointerCapture(e.pointerId);document.body.classList.add('rv-resizing');});
$('splitter').addEventListener('pointermove',e=>{if($('splitter').hasPointerCapture(e.pointerId))adjustWidth(window.innerWidth-e.clientX);});
function stopResize(){document.body.classList.remove('rv-resizing');}
$('splitter').addEventListener('pointerup',stopResize);$('splitter').addEventListener('lostpointercapture',stopResize);$('splitter').addEventListener('dblclick',()=>adjustWidth(440));
$('splitter').addEventListener('keydown',e=>{const width=Number($('splitter').getAttribute('aria-valuenow'));if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();adjustWidth(width+(e.key==='ArrowLeft'?20:-20));}if(e.key==='Home'){e.preventDefault();adjustWidth(440);}});
document.title=reviewData.title;
$('review-title').textContent=reviewData.title;$('review-sub').textContent=reviewData.version+' · 点击原型查阅需求 · 支持研发与测试查阅';
$('end-nav').addEventListener('click',e=>{if(e.target.closest('#document-tab')){enterDocument();return;}const b=e.target.closest('[data-end]');if(b){if(documentState.on)showReviewDocument(false);setScope(b.dataset.end,'all');}});
$('page-filter').addEventListener('change',e=>setScope(currentEnd,e.target.value));
$('search').addEventListener('input',renderDocs);$('clear-search').addEventListener('click',()=>{$('search').value='';renderDocs();$('search').focus();});
$('markers').addEventListener('change',e=>{document.body.classList.toggle('rv-no-markers',!e.target.checked);scheduleLine();});$('lines').addEventListener('change',scheduleLine);
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{lens=b.dataset.lens;document.body.classList.remove('rv-lens-qa','rv-lens-dev','rv-lens-frontend');if(lens!=='all')document.body.classList.add('rv-lens-'+lens);document.querySelectorAll('[data-lens]').forEach(btn=>btn.setAttribute('aria-pressed',btn===b));renderDocs();}));
$('req-jump').addEventListener('change',e=>{if(e.target.value)choose(e.target.value,'navigate',{keepSearch:true});});
function stepRequirement(delta){const rows=filteredRequirements(),index=rows.findIndex(r=>r.id===selectedId),next=index<0?(delta>0?0:rows.length-1):index+delta;if(rows[next])choose(rows[next].id,'navigate',{keepSearch:true});}
$('prev-req').addEventListener('click',()=>stepRequirement(-1));$('next-req').addEventListener('click',()=>stepRequirement(1));
$('requirements').addEventListener('click',e=>{if(e.target.closest('[data-clear]')){$('search').value='';renderDocs();}});
// 标注只查说明，不触发所在业务操作。业务按钮／输入框仍只执行本身操作，点击空白热点可定位需求。
$('canvas').addEventListener('click',e=>{
 const marker=e.target.closest('.rv-marker');if(marker){e.preventDefault();e.stopPropagation();choose(marker.closest('[data-req]').dataset.req,'canvas');return;}
 const hot=e.target.closest('[data-req]'),interactive=e.target.closest('button,input,select,textarea,label,a,[role="button"],[contenteditable="true"]');if(view==='review'&&hot&&!interactive)choose(hot.dataset.req,'canvas');
},true);
function townReviewAllowed(id){if(!getRider(id)||getRider(id).town!==demo.opTown){notify('骑手小镇归属变更，请刷新后重试');return false;}return true;}
function accountSessionAllowed(){if(demo.expiredRiders.includes(demo.sessionRider.id)||!getRider(demo.sessionRider.id)){demo.closeNotice='您的账号登录过期，请重新登录';renderCanvas();notify(demo.closeNotice);return false;}return true;}
function refreshOperator(end){const rows=structuredClone(demo.rows.filter(r=>r.id!=='active'&&r.town===demo.opTown));if(end==='operator-app')demo.opAPP=rows;else demo.opPC=rows;demo.review=null;renderCanvas();notify('已刷新本镇列表');}
$('canvas').addEventListener('input',e=>{if(e.target.dataset.business==='query')demo.query=e.target.value;if(e.target.dataset.business==='town-search')demo.townQuery=e.target.value;});
$('canvas').addEventListener('change',e=>{if(e.target.dataset.business==='source')demo.source=e.target.value;if(e.target.dataset.business==='status')demo.status=e.target.value;if(e.target.dataset.business==='town-page-size'){demo.townPageSize=Number(e.target.value);demo.townPage=1;renderCanvas();}});
$('canvas').addEventListener('keydown',e=>{if(e.target.dataset.business==='town-search'&&e.key==='Enter'){e.preventDefault();demo.townFilter=demo.townQuery.trim();demo.townPage=1;renderCanvas();}});
$('canvas').addEventListener('click',e=>{
 if(e.target.closest('.rv-marker'))return;
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 switch(b.dataset.action){
 case 'assign':if(!assignAllowed(getRider(b.dataset.id))&&getRider(b.dataset.id).status!=='审核通过')break;openTownPicker(b.dataset.id);break;
 case 'assign-cancel':demo.editing='';demo.draft='';demo.townConfirm=false;renderCanvas();break;
 case 'town-query':demo.townFilter=demo.townQuery.trim();demo.townPage=1;renderCanvas();break;
 case 'town-reset':demo.townQuery='';demo.townFilter='';demo.townPage=1;renderCanvas();break;
 case 'town-page':demo.townPage=Number(b.dataset.page);renderCanvas();break;
 case 'town-select':{const selected=towns.find(t=>String(t.id)===b.dataset.townId);if(!selected)break;demo.draft=selected.name;demo.townConfirm=true;renderCanvas();break;}
 case 'town-confirm-cancel':demo.townConfirm=false;demo.draft='';renderCanvas();break;
 case 'town-confirm':if(!demo.townConfirm||!towns.some(t=>t.name===demo.draft))break;getRider(demo.editing).town=demo.draft;demo.editing='';demo.draft='';demo.townConfirm=false;renderCanvas();notify('操作成功');break;
 case 'admin-page':demo.editing='';demo.query='';demo.source='全部';demo.status='全部';setScope('admin',b.dataset.page);break;
 case 'admin-close':if(!canCloseUnqualified(getRider(b.dataset.id)))break;demo.closingId=b.dataset.id;renderCanvas();break;
 case 'admin-close-cancel':demo.closingId='';renderCanvas();break;
 case 'admin-close-confirm':{const rider=getRider(demo.closingId);if(!rider||!canCloseUnqualified(rider))break;demo.expiredRiders.push(rider.id);demo.rows=demo.rows.filter(r=>r.id!==demo.closingId);demo.reapplyIds.push(rider.id);demo.closingId='';renderCanvas();notify('注销成功');break;}
 case 'demo-reapply':{const id=b.dataset.id||demo.reapplyIds[0];if(!demo.reapplyIds.includes(id))break;demo.rows.push(structuredClone(riderSeed.find(r=>r.id===id)));demo.reapplyIds=demo.reapplyIds.filter(item=>item!==id);renderCanvas();notify('重新申请成功（模拟）');break;}
 case 'admin-query':renderCanvas();break;
 case 'admin-reset':demo.query='';demo.source='全部';demo.status='全部';renderCanvas();break;
 case 'review-open':if(!townReviewAllowed(b.dataset.id))break;demo.review={id:b.dataset.id,end:b.dataset.end,result:b.dataset.result};renderCanvas();break;
 case 'review-cancel':demo.review=null;renderCanvas();break;
 case 'review-submit':if(!demo.review||!townReviewAllowed(demo.review.id))break;getRider(demo.review.id).status=demo.review.result;refreshOperator(demo.review.end);notify('审核结果已提交（演示）');break;
 case 'operator-refresh':refreshOperator(b.dataset.end);break;
 case 'demo-session':{const rider=getRider(b.dataset.id);if(!rider||demo.expiredRiders.includes(rider.id))break;demo.sessionRider=structuredClone(rider);demo.sessionTown=rider.town;demo.closeNotice='';renderCanvas();notify('已切换模拟登录骑手');break;}
 case 'account-menu':if(!accountSessionAllowed())break;notify(`${b.dataset.label}沿用原流程，本次原型未展开`);break;
 case 'account-logout':if(!accountSessionAllowed())break;notify('退出登录沿用原流程，本次原型未展开');break;
 case 'account-close':if(!accountSessionAllowed())break;demo.closeNotice='注销信息已提交，相关人员将在1~2个工作日进行处理，请勿重复提交！';renderCanvas();notify(demo.closeNotice);break;
 case 'account-refresh':if(!accountSessionAllowed())break;demo.sessionTown=getRider(demo.sessionRider.id).town;demo.closeNotice='';renderCanvas();notify('已刷新归属');break;
 case 'original-withdraw':notify('撤回申请沿用原流程，本次原型未展开');break;
 case 'original-logout':notify('退出登录沿用原流程，本次原型未展开');break;
 }
});

bindHover($('canvas'),'data-req');bindHover($('requirements'),'data-doc');
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.closest('input,textarea,select,[contenteditable="true"]')){e.preventDefault();if(documentState.on)$('md-search').focus();else{setView('review');$('search').focus();if(narrow())$('search').scrollIntoView({block:'center'});}}if(e.key==='Escape'&&e.target===$('search')){$('search').value='';renderDocs();$('search').blur();}});
$('reset').addEventListener('click',()=>{resetRiderDemo();setScope('admin','applications');notify('演示已重置');});
document.addEventListener('scroll',scheduleLine,true);document.addEventListener('toggle',scheduleLine,true);window.addEventListener('resize',()=>{adjustWidth(Number($('splitter').getAttribute('aria-valuenow')));scheduleLine();});new ResizeObserver(scheduleLine).observe($('workspace'));
window.addEventListener('hashchange',applyHash);window.addEventListener('popstate',applyHash);
bindDocumentControls();renderNav();renderCanvas();renderDocs();adjustWidth(440);applyHash();

</script>
